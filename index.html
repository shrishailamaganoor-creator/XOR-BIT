<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              }
            });
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              ((event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
                (event.message && event.message.indexOf('Cannot set property fetch') !== -1))
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var msg = event && event.reason && (event.reason.message || String(event.reason));
            if (msg && msg.indexOf('Cannot set property fetch') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XOR Bit" />
    <meta name="application-name" content="XOR Bit" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090B" />
    <title>XOR Bit — Personal Life & Engineering OS</title>
    <meta name="description" content="A single-file, offline-first dashboard that runs your studies, habits, money, focus and projects." />
    <meta property="og:title" content="XOR Bit — Personal Life & Engineering OS" />
    <meta property="og:description" content="A single-file, offline-first dashboard that runs your studies, habits, money, focus and projects." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Atmospheric Film Grain Overlay (0.025 opacity, non-blocking) -->
    <svg class="pointer-events-none fixed inset-0 z-50 h-full w-full opacity-[0.025]" aria-hidden="true">
      <filter id="nexora-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#nexora-grain)" />
    </svg>

    <div id="root"></div>
    <script>
      if (window.location.hostname.endsWith('github.io')) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './compiled/app.css';
        document.head.appendChild(link);
        var s = document.createElement('script');
        s.type = 'module';
        s.src = './compiled/app.js';
        document.body.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
