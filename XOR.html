                    <span style={{ color: 'var(--ink-muted)' }}>SCHEDULED ON {selectedDateKey}</span>
                    <span>{selectedDayReviews.length} REVIEWS</span>
                  </div>

                  {selectedDayReviews.length === 0 ? (
                    <p className="font-mono text-xs py-2" style={{ color: 'var(--ink-muted)' }}>
                      No revisions scheduled for this date.
                    </p>
                  ) : (
                    <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                      {selectedDayReviews.map((r) => (
                        <div
                          key={`${r.topicId}-${r.interval}`}
                          className="p-2.5 rounded-md border flex items-center justify-between gap-2"
                          style={{
                            backgroundColor: 'var(--bg-canvas)',
                            borderColor: r.overdue ? 'var(--status-warn)' : 'var(--border-hairline)'
                          }}
                        >
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5">
                              <span
                                className="font-mono text-[10px] px-1.5 py-0.2 rounded border"
                                style={{ color: r.overdue ? 'var(--status-warn)' : 'var(--ink-secondary)' }}
                              >
                                +{r.interval}D
                              </span>
                              <span className={`text-xs font-medium truncate ${r.done ? 'line-through opacity-50' : ''}`}>
                                {r.title}
                              </span>
                            </div>
                            <div className="font-mono text-[10px] mt-0.5" style={{ color: r.overdue ? 'var(--status-warn)' : 'var(--ink-muted)' }}>
                              Created {r.createdAt} {r.overdue ? '• OVERDUE' : ''}
                            </div>
                          </div>

                          <div className="flex items-center gap-1.5 shrink-0">
                            <button
                              type="button"
                              onClick={() => markReviewDone(r.topicId, r.interval, r.done)}
                              className={`px-2 py-1 rounded text-[10px] font-mono ${
                                r.done ? 'arch-btn-ghost' : 'arch-btn-primary'
                              }`}
                            >
                              {r.done ? 'Undo' : 'Done'}
                            </button>
                            <button
                              type="button"
                              onClick={() => deleteTopic(r.topicId)}
                              className="arch-btn-ghost p-1 rounded"
                              title="Delete topic"
                            >
                              <Icon name="trash" size={11} />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <div className="lg:col-span-7 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    03 // PROBLEM VAULT (UNLIMITED NESTED NOTEBOOK)
                  </span>
                  <span className="font-mono text-[11px] tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                    {problemPages.length} PAGES
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                  <div className="sm:col-span-5 flex items-center arch-input rounded-md px-2.5 py-1.5 gap-2">
                    <Icon name="search" size={13} />
                    <input
                      value={vaultSearch}
                      onChange={(e) => setVaultSearch(e.target.value)}
                      placeholder="Search titles & notes..."
                      className="bg-transparent text-xs focus:outline-none w-full"
                    />
                  </div>

                  <form onSubmit={handleAddRootPage} className="sm:col-span-7 flex gap-2">
                    <input
                      value={rootTitle}
                      onChange={(e) => setRootTitle(e.target.value)}
                      placeholder="New root page (e.g., Dynamic Programming)..."
                      className="flex-1 arch-input rounded-md px-3 py-1.5 text-xs"
                    />
                    <select
                      value={rootDiff}
                      onChange={(e) => setRootDiff(e.target.value)}
                      className="arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                    >
                      <option value="Easy">Easy</option>
                      <option value="Med">Med</option>
                      <option value="Hard">Hard</option>
                    </select>
                    <button type="submit" className="arch-btn-primary px-3 py-1.5 rounded-md text-xs font-mono shrink-0">
                      + Page
                    </button>
                  </form>
                </div>

                {problemPages.length === 0 ? (
                  <EmptyState
                    code="PROBLEM.VAULT // 0_PAGES"
                    title="No problem pages in your notebook"
                    subtitle="Create a root topic or problem page above, then add unlimited nested sub-pages with difficulty tags and notes."
                  />
                ) : (
                  <div className="max-h-[540px] overflow-y-auto pr-1">
                    {renderPageNodes(null, 0)}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // VIEW 14: SYSTEM CORE (Settings, Visibility, Backup)
      const SettingsView = () => {
        const { awardXP, data, focusLabel, focusMinutes, hiddenSidebarIds, mediaMap, navItems, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setHiddenSidebarIds, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const exportJSON = async () => {
          try {
            const storedMedia = await loadAllMediaFromIDB();
            const backup = {
              format: 'NEXORA_BACKUP_V1',
              exportedAt: new Date().toISOString(),
              data,
              media: { ...storedMedia, ...mediaMap }
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `xor-bit-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
            notify('Exported XOR Bit backup with media');
          } catch (err) {
            notify('Could not create backup', 'err');
          }
        };

        const importJSON = (e) => {
          const input = e.target;
          const file = input.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (!isPlainObject(parsed)) throw new Error('Backup must be an object');
              if (parsed.format && parsed.format !== 'NEXORA_BACKUP_V1') {
                throw new Error('Unsupported backup format');
              }
              const hasEnvelope = Object.prototype.hasOwnProperty.call(parsed, 'data');
              const restoredData = normalizeImportedState(hasEnvelope ? parsed.data : parsed);
              const hasMedia = hasEnvelope && Object.prototype.hasOwnProperty.call(parsed, 'media');
              const restoredMedia = hasMedia ? validateImportedMedia(parsed.media) : null;
              if (restoredMedia) await replaceAllMediaInIDB(restoredMedia);
              setData(restoredData);
              if (restoredMedia) setMediaMap(restoredMedia);
              notify(hasMedia ? 'Restored backup and uploaded media' : 'Restored backup data');
            } catch (err) {
              notify(err?.message === 'IndexedDB is unavailable' ? 'Could not restore backup media' : 'Invalid or incomplete backup file', 'err');
            } finally {
              input.value = '';
            }
          };
          reader.onerror = () => {
            notify('Could not read backup file', 'err');
            input.value = '';
          };
          reader.readAsText(file);
        };

        return (
          <div className="space-y-6 max-w-4xl">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                14 // SYSTEM CONFIGURATION & STORAGE
              </div>
              <h1 className="text-2xl font-semibold heading-tight mt-1">System Core</h1>
            </div>

            <div className="arch-panel p-5 rounded-xl space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div className="font-mono text-xs uppercase" style={{ color: 'var(--ink-muted)' }}>
                    SIDEBAR MODULE VISIBILITY
                  </div>
                  <p className="text-[11px] mt-1" style={{ color: 'var(--ink-secondary)' }}>
                    Choose which modules appear in the sidebar. Hidden modules stay installed with all their data and can be shown again here.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => setHiddenSidebarIds([])}
                  className="arch-btn-ghost px-3 py-1.5 rounded-md text-[11px] font-mono"
                >
                  Show All Modules
                </button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {navItems.filter((item) => item.id !== 'dashboard' && item.id !== 'settings').map((item) => {
                  const isVisible = !hiddenSidebarIds.includes(item.id);
                  return (
                    <label key={item.id} className="flex items-center justify-between gap-3 rounded-md border px-3 py-2 cursor-pointer" style={{ borderColor: 'var(--border-hairline)', backgroundColor: 'var(--bg-canvas)' }}>
                      <span className="flex items-center gap-2 text-xs">
                        <Icon name={item.icon} size={14} />
                        {item.label}
                      </span>
                      <span className="flex items-center gap-2 text-[10px] font-mono" style={{ color: 'var(--ink-muted)' }}>
                        {isVisible ? 'VISIBLE' : 'HIDDEN'}
                        <input
                          type="checkbox"
                          checked={isVisible}
                          onChange={() => setHiddenSidebarIds((prev) => isVisible ? prev.concat(item.id) : prev.filter((id) => id !== item.id))}
                          aria-label={`${isVisible ? 'Hide' : 'Show'} ${item.label} in sidebar`}
                          className="accent-current"
                        />
                      </span>
                    </label>
                  );
                })}
              </div>
              <p className="text-[10px] font-mono" style={{ color: 'var(--ink-muted)' }}>
                TODAY and SYSTEM CORE stay available so you can always return here and restore modules. Changes save automatically.
              </p>
            </div>

            <div className="arch-panel p-5 rounded-xl space-y-4">
              <div className="font-mono text-xs uppercase" style={{ color: 'var(--ink-muted)' }}>
                ARCHITECTURAL COLOR TOKENS
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {[
                  { id: 'obsidian', name: 'Direction A: Obsidian Precision', sub: 'Linear / Raycast Matte Carbon (#09090B)' },
                  { id: 'paper', name: 'Direction B: Editorial Paper', sub: 'Stripe Press Warm Alabaster (#FAF8F5)' },
                  { id: 'industrial', name: 'Direction C: Swiss Industrial', sub: 'Teenage Engineering Stone + Orange (#FF4F00)' }
                ].map((t) => (
                  <button
                    key={t.id}
                    type="button"
                    onClick={() =>
                      setData((prev) => ({ ...prev, profile: { ...prev.profile, theme: t.id } }))
                    }
                    className={`p-3.5 rounded-lg border text-left transition ${
                      data.profile.theme === t.id ? 'arch-btn-primary' : 'arch-btn-ghost'
                    }`}
                  >
                    <div className="text-xs font-semibold">{t.name}</div>
                    <div className="text-[10px] font-mono mt-1 opacity-75">{t.sub}</div>
                  </button>
                ))}
              </div>
            </div>

            <div className="arch-panel p-5 rounded-xl space-y-4">
              <div className="font-mono text-xs uppercase" style={{ color: 'var(--ink-muted)' }}>
                OPERATOR IDENTITY & FEEDBACK
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="text-[11px] font-mono block mb-1" style={{ color: 'var(--ink-muted)' }}>Operator Name</label>
                  <input
                    value={data.profile.name}
                    onChange={(e) => setData((prev) => ({ ...prev, profile: { ...prev.profile, name: e.target.value } }))}
                    className="w-full arch-input rounded-md px-3 py-2 text-xs"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-mono block mb-1" style={{ color: 'var(--ink-muted)' }}>Program / Branch</label>
                  <input
                    value={data.profile.title}
                    onChange={(e) => setData((prev) => ({ ...prev, profile: { ...prev.profile, title: e.target.value } }))}
                    className="w-full arch-input rounded-md px-3 py-2 text-xs"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-mono block mb-1" style={{ color: 'var(--ink-muted)' }}>Active Term</label>
                  <input
                    value={data.profile.semester}
                    onChange={(e) => setData((prev) => ({ ...prev, profile: { ...prev.profile, semester: e.target.value } }))}
                    className="w-full arch-input rounded-md px-3 py-2 text-xs"
                  />
                </div>
              </div>

              <div className="flex flex-wrap gap-2.5 pt-2">
                <button
                  type="button"
                  onClick={() =>
                    setData((prev) => ({
                      ...prev,
                      profile: { ...prev.profile, soundEnabled: !prev.profile.soundEnabled }
                    }))
                  }
                  className="arch-btn-ghost px-3.5 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-1.5"
                >
                  <Icon name={data.profile.soundEnabled ? 'volume' : 'mute'} size={14} />
                  <span>Tactile Audio: {data.profile.soundEnabled ? 'ACTIVE' : 'MUTED'}</span>
                </button>
              </div>
            </div>

            <div className="arch-panel p-5 rounded-xl space-y-4">
              <div className="font-mono text-xs uppercase" style={{ color: 'var(--ink-muted)' }}>
                LOCAL STORAGE VAULT
              </div>
              <div className="flex flex-wrap gap-2.5">
                <button type="button" onClick={exportJSON} className="arch-btn-primary px-4 py-2 rounded-md text-xs font-mono inline-flex items-center gap-1.5">
                  <Icon name="download" size={14} />
                  <span>Export JSON Snapshot</span>
                </button>
                <label className="arch-btn-ghost px-4 py-2 rounded-md text-xs font-mono inline-flex items-center gap-1.5 cursor-pointer">
                  <Icon name="upload" size={14} />
                  <span>Import JSON Snapshot</span>
                  <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                </label>
                <button
                  type="button"
                  onClick={() => setConfirmResetModal(true)}
                  className="arch-btn-ghost px-4 py-2 rounded-md text-xs font-mono inline-flex items-center gap-1.5"
                  style={{ color: 'var(--status-err)' }}
                >
                  <Icon name="trash" size={14} />
                  <span>Wipe All Local Data</span>
                </button>
              </div>
            </div>
          </div>
        );
      };

      // VIEW 17: BIO-STATE & NSDR LAB
      const BioStateView = () => {
        const { data, setData, notify, awardXP, isAudioPlaying: isPlaying, sleepTimerSec, nsdrRunning, nsdrSecLeft, breathTick, stopAudio, startAudio, toggleNsdr, setNsdrSecLeft, setSleepTimerSec } = useContext(NexoraContext);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const today = new Date();
        const todayKey = ymd(today);
        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const todayWeekday = weekdays[today.getDay()];

        const bioLog = data.bioLog || { days: {}, templates: {} };
        const daysMap = bioLog.days || {};
        const templatesMap = bioLog.templates || {};
        const audioPrefs = data.audioPrefs || { track: 'pink', volume: 0.4, timerMin: 15, nsdrDuration: 10 };

        const [selectedDate, setSelectedDate] = useState(todayKey);
        const [customWater, setCustomWater] = useState('');
        const [sleepInput, setSleepInput] = useState('');

        const [blockTitle, setBlockTitle] = useState('');
        const [blockStart, setBlockStart] = useState('08:00');
        const [blockEnd, setBlockEnd] = useState('09:30');
        const [blockCat, setBlockCat] = useState('Deep Work');
        const [templateDay, setTemplateDay] = useState(todayWeekday);



        const currentDayData = daysMap[selectedDate] || { waterMl: 0, sleepHrs: 0, schedule: [] };

        const updateDayData = (dateKey, patch) => {
          setData((prev) => {
            const prevBio = prev.bioLog || { days: {}, templates: {} };
            const prevDays = prevBio.days || {};
            const existing = prevDays[dateKey] || { waterMl: 0, sleepHrs: 0, schedule: [] };
            return {
              ...prev,
              bioLog: {
                ...prevBio,
                days: {
                  ...prevDays,
                  [dateKey]: { ...existing, ...patch }
                }
              }
            };
          });
        };

        const updateAudioPrefs = (patch) => {
          setData((prev) => ({
            ...prev,
            audioPrefs: { ...(prev.audioPrefs || audioPrefs), ...patch }
          }));
        };

        const addWater = (ml) => {
          const amount = Number(ml) || 0;
          if (amount === 0) return;
          const prevMl = Number(currentDayData.waterMl) || 0;
          const nextMl = Math.max(0, prevMl + amount);
          updateDayData(selectedDate, { waterMl: nextMl });
          if (prevMl < 3000 && nextMl >= 3000) {
            awardXP(15, 'Reached 3000ml hydration target');
          } else {
            notify(`Hydration: ${nextMl} / 3000 ml`);
          }
        };

        const saveSleep = (e) => {
          e.preventDefault();
          const hrs = Math.max(0, Math.min(24, Number(sleepInput) || 0));
          updateDayData(selectedDate, { sleepHrs: hrs });
          setSleepInput('');
          notify(`Logged ${hrs}h sleep for ${selectedDate}`);
        };

        const last7Days = useMemo(() => {
          const arr = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
            const key = ymd(d);
            const label = weekdays[d.getDay()];
            const entry = daysMap[key] || { waterMl: 0, sleepHrs: 0 };
            arr.push({
              key,
              label,
              waterMl: Number(entry.waterMl) || 0,
              sleepHrs: Number(entry.sleepHrs) || 0
            });
          }
          return arr;
        }, [daysMap, todayKey]);

        const avgSleep = useMemo(() => {
          const total = last7Days.reduce((acc, d) => acc + d.sleepHrs, 0);
          return +(total / 7).toFixed(1);
        }, [last7Days]);

        const sleepDebt7d = useMemo(() => {
          const total = last7Days.reduce((acc, d) => acc + d.sleepHrs, 0);
          return +(56 - total).toFixed(1);
        }, [last7Days]);

        const addScheduleBlock = (e) => {
          e.preventDefault();
          if (!blockTitle.trim()) return;
          const newBlock = {
            id: 'blk-' + Date.now(),
            title: blockTitle.trim(),
            start: blockStart,
            end: blockEnd,
            category: blockCat
          };
          const nextSchedule = [...(currentDayData.schedule || []), newBlock].sort((a, b) =>
            (a.start || '').localeCompare(b.start || '')
          );
          updateDayData(selectedDate, { schedule: nextSchedule });
          setBlockTitle('');
          notify('Time block added to timeline');
        };

        const deleteScheduleBlock = (id) => {
          const nextSchedule = (currentDayData.schedule || []).filter((b) => b.id !== id);
          updateDayData(selectedDate, { schedule: nextSchedule });
        };

        const saveWeekdayTemplate = () => {
          setData((prev) => {
            const prevBio = prev.bioLog || { days: {}, templates: {} };
            return {
              ...prev,
              bioLog: {
                ...prevBio,
                templates: {
                  ...(prevBio.templates || {}),
                  [templateDay]: currentDayData.schedule || []
                }
              }
            };
          });
          notify(`Saved schedule as ${templateDay} template`);
        };

        const copyTemplateToToday = () => {
          const tpl = templatesMap[templateDay] || [];
          if (tpl.length === 0) {
            notify(`No saved blocks in ${templateDay} template`, 'err');
            return;
          }
          const cloned = tpl.map((b, i) => ({ ...b, id: 'blk-' + Date.now() + '-' + i }));
          updateDayData(selectedDate, { schedule: cloned });
          notify(`Copied ${templateDay} template to ${selectedDate}`);
        };

        const breathPhase = breathTick < 4 ? 'INHALE (4S)' : breathTick < 8 ? 'HOLD (4S)' : 'EXHALE (6S)';
        const totalNsdrSec = (audioPrefs.nsdrDuration || 10) * 60;
        const nsdrProgress = 1 - nsdrSecLeft / Math.max(1, totalNsdrSec);
        const nsdrStage =
          nsdrProgress < 0.2
            ? 'STAGE 1 // SETTLE IN & DOWN-REGULATE'
            : nsdrProgress < 0.55
            ? 'STAGE 2 // SOMATIC BODY SCAN'
            : nsdrProgress < 0.85
            ? 'STAGE 3 // RELEASE AUTONOMIC TENSION'
            : 'STAGE 4 // GENTLE RETURN TO BASELINE';

        const waterPct = Math.min(100, Math.round(((currentDayData.waterMl || 0) / 3000) * 100));

        return (
          <div className="space-y-6">
            <div className="flex flex-wrap items-end justify-between gap-4">
              <div>
                <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                  17 // PHYSIOLOGICAL TELEMETRY &amp; ACOUSTIC NEURO-MODULATION
                </div>
                <h1 className="text-2xl font-semibold heading-tight mt-1">Bio-State &amp; NSDR Lab</h1>
              </div>
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs" style={{ color: 'var(--ink-muted)' }}>ACTIVE DATE:</span>
                <input
                  type="date"
                  value={selectedDate}
                  onChange={(e) => setSelectedDate(e.target.value || todayKey)}
                  className="arch-input rounded-md px-2.5 py-1 text-xs font-mono"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    01 // HYDRATION TELEMETRY (3000 ML TARGET)
                  </span>
                  <span className="font-mono text-xs font-semibold tabular-nums" style={{ color: waterPct >= 100 ? 'var(--status-ok)' : 'var(--ink-primary)' }}>
                    {currentDayData.waterMl || 0} / 3000 ML ({waterPct}%)
                  </span>
                </div>

                <div className="w-full h-2 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                  <div
                    className="h-full transition-all duration-300"
                    style={{ width: `${waterPct}%`, backgroundColor: 'var(--status-ok)' }}
                  />
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button type="button" onClick={() => addWater(250)} className="arch-btn-primary px-3 py-1.5 rounded-md text-xs font-mono">
                    +250 ML
                  </button>
                  <button type="button" onClick={() => addWater(500)} className="arch-btn-primary px-3 py-1.5 rounded-md text-xs font-mono">
                    +500 ML
                  </button>
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      addWater(customWater);
                      setCustomWater('');
                    }}
                    className="flex gap-1.5 flex-1 min-w-[160px]"
                  >
                    <input
                      type="number"
                      value={customWater}
                      onChange={(e) => setCustomWater(e.target.value)}
                      placeholder="Custom ml..."
                      className="flex-1 arch-input rounded-md px-2.5 py-1.5 text-xs font-mono"
                    />
                    <button type="submit" className="arch-btn-ghost px-2.5 py-1.5 rounded-md text-xs font-mono">
                      + Add
                    </button>
                  </form>
                  <button
                    type="button"
                    onClick={() => updateDayData(selectedDate, { waterMl: 0 })}
                    className="arch-btn-ghost px-2.5 py-1.5 rounded-md text-xs font-mono"
                  >
                    Reset
                  </button>
                </div>

                <div className="pt-2 border-t">
                  <div className="font-mono text-[10px] uppercase mb-2" style={{ color: 'var(--ink-muted)' }}>
                    7-DAY HYDRATION CONTINUITY
                  </div>
                  <div className="grid grid-cols-7 gap-2 h-24 items-end pt-3">
                    {last7Days.map((d) => {
                      const pct = Math.min(100, Math.round((d.waterMl / 3000) * 100));
                      return (
                        <div key={d.key} className="flex flex-col items-center justify-end h-full gap-1">
                          <span className="font-mono text-[9px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                            {d.waterMl > 0 ? `${(d.waterMl / 1000).toFixed(1)}L` : '0'}
                          </span>
                          <div
                            className="w-full rounded-t transition-all"
                            style={{
                              height: `${Math.max(8, pct)}%`,
                              backgroundColor: d.waterMl >= 3000 ? 'var(--status-ok)' : 'var(--accent)',
                              opacity: d.waterMl > 0 ? 0.9 : 0.2
                            }}
                          />
                          <span className="font-mono text-[10px]" style={{ color: d.key === selectedDate ? 'var(--ink-primary)' : 'var(--ink-muted)' }}>
                            {d.label}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    02 // SLEEP ARCHITECTURE (8.0H TARGET)
                  </span>
                  <span className="font-mono text-xs tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                    7D AVG: <strong>{avgSleep}H</strong>
                  </span>
                </div>

                <div
                  className="p-3 rounded-lg border flex items-center justify-between font-mono text-xs tabular-nums"
                  style={{ backgroundColor: 'var(--bg-canvas)' }}
                >
                  <span>SLEEP DEBT VS 8H TARGET (7D):</span>
                  <span style={{ color: sleepDebt7d > 4 ? 'var(--status-warn)' : 'var(--status-ok)' }}>
                    {sleepDebt7d > 0 ? `${sleepDebt7d} HRS DEBT` : 'ZERO DEBT (SURPLUS)'}
                  </span>
                </div>

                <form onSubmit={saveSleep} className="flex gap-2">
                  <input
                    type="number"
                    step="0.5"
                    min="0"
                    max="24"
                    value={sleepInput}
                    onChange={(e) => setSleepInput(e.target.value)}
                    placeholder={`Hours slept on ${selectedDate} (logged: ${currentDayData.sleepHrs || 0}h)...`}
                    className="flex-1 arch-input rounded-md px-3 py-1.5 text-xs font-mono"
                  />
                  <button type="submit" className="arch-btn-primary px-4 py-1.5 rounded-md text-xs font-mono">
                    Log Sleep
                  </button>
                </form>

                <div className="pt-2 border-t">
                  <div className="font-mono text-[10px] uppercase mb-2" style={{ color: 'var(--ink-muted)' }}>
                    7-DAY SLEEP DURATION
                  </div>
                  <div className="grid grid-cols-7 gap-2 h-24 items-end pt-3">
                    {last7Days.map((d) => {
                      const pct = Math.min(100, Math.round((d.sleepHrs / 10) * 100));
                      return (
                        <div key={d.key} className="flex flex-col items-center justify-end h-full gap-1">
                          <span className="font-mono text-[9px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                            {d.sleepHrs}h
                          </span>
                          <div
                            className="w-full rounded-t transition-all"
                            style={{
                              height: `${Math.max(8, pct)}%`,
                              backgroundColor: d.sleepHrs >= 7.5 ? 'var(--status-ok)' : d.sleepHrs > 0 ? 'var(--status-warn)' : 'var(--accent)',
                              opacity: d.sleepHrs > 0 ? 0.9 : 0.2
                            }}
                          />
                          <span className="font-mono text-[10px]" style={{ color: d.key === selectedDate ? 'var(--ink-primary)' : 'var(--ink-muted)' }}>
                            {d.label}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    03 // DAY TIMELINE (05:00 – 23:00)
                  </span>
                  <div className="flex items-center gap-1.5">
                    <select
                      value={templateDay}
                      onChange={(e) => setTemplateDay(e.target.value)}
                      className="arch-input rounded px-2 py-1 text-[11px] font-mono"
                    >
                      {weekdays.map((w) => (
                        <option key={w} value={w}>{w} Template</option>
                      ))}
                    </select>
                    <button
                      type="button"
                      onClick={saveWeekdayTemplate}
                      className="arch-btn-ghost px-2 py-1 rounded text-[10px] font-mono"
                    >
                      Save Template
                    </button>
                    <button
                      type="button"
                      onClick={copyTemplateToToday}
                      className="arch-btn-primary px-2.5 py-1 rounded text-[10px] font-mono"
                    >
                      Copy Template to Today
                    </button>
                  </div>
                </div>

                <form onSubmit={addScheduleBlock} className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                  <input
                    value={blockTitle}
                    onChange={(e) => setBlockTitle(e.target.value)}
                    placeholder="Block title (e.g., Lecture, Gym)..."
                    className="sm:col-span-4 arch-input rounded-md px-2.5 py-1.5 text-xs"
                  />
                  <input
                    type="time"
                    min="05:00"
                    max="23:00"
                    value={blockStart}
                    onChange={(e) => setBlockStart(e.target.value)}
                    className="sm:col-span-2 arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                  />
                  <input
                    type="time"
                    min="05:00"
                    max="23:00"
                    value={blockEnd}
                    onChange={(e) => setBlockEnd(e.target.value)}
                    className="sm:col-span-2 arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                  />
                  <select
                    value={blockCat}
                    onChange={(e) => setBlockCat(e.target.value)}
                    className="sm:col-span-2 arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                  >
                    <option>Deep Work</option>
                    <option>Classes</option>
                    <option>Training</option>
                    <option>Recovery</option>
                  </select>
                  <button type="submit" className="sm:col-span-2 arch-btn-primary rounded-md py-1.5 text-xs font-mono">
                    + Block
                  </button>
                </form>

                {(currentDayData.schedule || []).length === 0 ? (
                  <EmptyState
                    code="TIMELINE.05_23 // 0_BLOCKS"
                    title="No time blocks scheduled for this date"
                    subtitle="Add time blocks between 05:00 and 23:00 or copy a saved weekday template."
                  />
                ) : (
                  <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                    {(currentDayData.schedule || []).map((b) => (
                      <div
                        key={b.id}
                        className="p-2.5 rounded-md border flex items-center justify-between gap-3"
                        style={{ backgroundColor: 'var(--bg-canvas)' }}
                      >
                        <div className="flex items-center gap-3">
                          <span className="font-mono text-xs font-semibold tabular-nums px-2 py-0.5 rounded border">
                            {b.start} – {b.end}
                          </span>
                          <div>
                            <div className="text-xs font-semibold">{b.title}</div>
                            <div className="font-mono text-[10px]" style={{ color: 'var(--ink-muted)' }}>{b.category}</div>
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={() => deleteScheduleBlock(b.id)}
                          className="arch-btn-ghost p-1 rounded"
                        >
                          <Icon name="trash" size={12} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    04 // NSDR &amp; SYNTHESIZED FOCUS AUDIO
                  </span>
                  <div className="flex items-end gap-1 h-4">
                    {[45, 90, 60, 100, 50, 80].map((h, i) => (
                      <span
                        key={i}
                        className={`w-1 rounded-sm transition-all ${isPlaying ? 'animate-pulse' : ''}`}
                        style={{
                          height: isPlaying ? `${h}%` : '20%',
                          backgroundColor: isPlaying ? 'var(--status-ok)' : 'var(--ink-muted)'
                        }}
                      />
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                  {[
                    { id: 'pink', label: 'Pink Noise' },
                    { id: 'brown', label: 'Brown Noise' },
                    { id: 'white', label: 'White Noise' },
                    { id: 'binaural', label: '40Hz Binaural' },
                    { id: 'nsdr', label: 'NSDR Guided' }
                  ].map((t) => {
                    const active = audioPrefs.track === t.id;
                    return (
                      <button
                        key={t.id}
                        type="button"
                        onClick={() => {
                          updateAudioPrefs({ track: t.id });
                          if (isPlaying) startAudio(t.id);
                        }}
                        className={`p-2.5 rounded-lg border text-xs font-mono text-center transition ${
                          active ? 'arch-btn-primary' : 'arch-btn-ghost'
                        }`}
                      >
                        {t.label}
                      </button>
                    );
                  })}
                </div>

                {audioPrefs.track === 'nsdr' ? (
                  <div className="p-4 rounded-lg border text-center space-y-4" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                    <div className="flex items-center justify-between font-mono text-xs">
                      <span style={{ color: 'var(--ink-muted)' }}>{nsdrStage}</span>
                      <div className="flex gap-1">
                        {[10, 20].map((m) => (
                          <button
                            key={m}
                            type="button"
                            onClick={() => {
                              stopAudio();
                              updateAudioPrefs({ nsdrDuration: m });
                              setNsdrSecLeft(m * 60);
                            }}
                            className={`px-2 py-0.5 rounded text-[10px] font-mono ${
                              audioPrefs.nsdrDuration === m ? 'arch-btn-primary' : 'arch-btn-ghost'
                            }`}
                          >
                            {m}M
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="py-4 flex flex-col items-center justify-center">
                      <div
                        className="w-28 h-28 rounded-full border-2 flex flex-col items-center justify-center transition-all duration-1000"
                        style={{
                          borderColor: 'var(--status-ok)',
                          transform:
                            !nsdrRunning
                              ? 'scale(1)'
                              : breathTick < 4
                              ? 'scale(1.18)'
                              : breathTick < 8
                              ? 'scale(1.18)'
                              : 'scale(0.88)'
                        }}
                      >
                        <div className="font-mono text-lg font-semibold tabular-nums">
                          {String(Math.floor(nsdrSecLeft / 60)).padStart(2, '0')}:{String(nsdrSecLeft % 60).padStart(2, '0')}
                        </div>
                        <div className="font-mono text-[10px] mt-0.5" style={{ color: 'var(--status-ok)' }}>
                          {nsdrRunning ? breathPhase : 'READY'}
                        </div>
                      </div>
                    </div>

                    <div className="flex justify-center gap-2">
                      <button
                        type="button"
                        onClick={toggleNsdr}

                        className="arch-btn-primary px-4 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-1.5"
                      >
                        <Icon name={nsdrRunning ? 'pause' : 'play'} size={13} />
                        <span>{nsdrRunning ? 'Pause NSDR' : 'Start NSDR Session'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          stopAudio();
                          setNsdrSecLeft((audioPrefs.nsdrDuration || 10) * 60);
                        }}
                        className="arch-btn-ghost px-3 py-1.5 rounded-md text-xs font-mono"
                      >
                        Reset
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="p-4 rounded-lg border space-y-4" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <button
                        type="button"
                        onClick={() => (isPlaying ? stopAudio() : startAudio(audioPrefs.track))}
                        className="arch-btn-primary px-4 py-2 rounded-md text-xs font-mono inline-flex items-center gap-2"
                      >
                        <Icon name={isPlaying ? 'pause' : 'play'} size={14} />
                        <span>{isPlaying ? 'STOP GENERATOR' : 'PLAY AUDIO'}</span>
                      </button>

                      <div className="flex items-center gap-1.5 font-mono text-xs">
                        <span style={{ color: 'var(--ink-muted)' }}>SLEEP TIMER:</span>
                        {[15, 30, 60].map((m) => (
                          <button
                            key={m}
                            type="button"
                            onClick={() => {
                              updateAudioPrefs({ timerMin: m });
                              setSleepTimerSec(m * 60);
                            }}
                            className={`px-2 py-0.5 rounded text-[10px] ${
                              audioPrefs.timerMin === m ? 'arch-btn-primary' : 'arch-btn-ghost'
                            }`}
                          >
                            {m}m
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-1">
                      <div className="flex justify-between font-mono text-[11px]">
                        <span style={{ color: 'var(--ink-muted)' }}>OUTPUT GAIN</span>
                        <span>
                          {Math.round((Number(audioPrefs.volume) ?? 0.4) * 100)}%
                          {isPlaying && sleepTimerSec > 0 ? ` • AUTO-OFF IN ${Math.ceil(sleepTimerSec / 60)}M` : ''}
                        </span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="1"
                        step="0.02"
                        value={audioPrefs.volume ?? 0.4}
                        onChange={(e) => updateAudioPrefs({ volume: Number(e.target.value) })}
                        className="w-full cursor-pointer"
                      />
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // VIEW 18: EXECUTIVE FUNCTION & DECISION MATRIX
      const ExecutiveView = () => {
        const { data, setData, notify, awardXP } = useContext(NexoraContext);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const today = new Date();
        const todayKey = ymd(today);

        const DEFAULT_MORNING = [
          { id: 'mr-1', title: 'Meds', time: '06:30' },
          { id: 'mr-2', title: 'Wake without phone', time: '06:35' },
          { id: 'mr-3', title: 'Water', time: '06:40' },
          { id: 'mr-4', title: 'Dress', time: '07:00' },
          { id: 'mr-5', title: 'Pack bag', time: '07:15' },
          { id: 'mr-6', title: 'ID/wallet/charger', time: '07:20' },
          { id: 'mr-7', title: 'Bus time check', time: '07:25' }
        ];

        const morningRoutine =
          data.morningRoutine && data.morningRoutine.length > 0 ? data.morningRoutine : DEFAULT_MORNING;
        const morningLog = data.morningLog || {};
        const todayChecked = morningLog[todayKey] || {};
        const decisions = data.decisions || [];

        const [newItemTitle, setNewItemTitle] = useState('');
        const [newItemTime, setNewItemTime] = useState('');
        const [showTips, setShowTips] = useState(true);

        const [decText, setDecText] = useState('');
        const [decQuad, setDecQuad] = useState('q1');

        const toggleMorningItem = (itemId) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          const nextState = !todayChecked[itemId];
          const nextTodayMap = { ...todayChecked, [itemId]: nextState };
          if (!nextState) delete nextTodayMap[itemId];

          setData((prev) => ({
            ...prev,
            morningRoutine: prev.morningRoutine && prev.morningRoutine.length > 0 ? prev.morningRoutine : DEFAULT_MORNING,
            morningLog: {
              ...(prev.morningLog || {}),
              [todayKey]: nextTodayMap
            }
          }));

          const completedCount = Object.keys(nextTodayMap).length;
          if (nextState && completedCount === morningRoutine.length) {
            awardXP(25, 'Completed Full Morning Protocol');
          }
        };

        const addMorningItem = (e) => {
          e.preventDefault();
          if (!newItemTitle.trim()) return;
          const item = {
            id: 'mr-' + Date.now(),
            title: newItemTitle.trim(),
            time: newItemTime.trim()
          };
          setData((prev) => ({
            ...prev,
            morningRoutine: [...morningRoutine, item]
          }));
          setNewItemTitle('');
          setNewItemTime('');
          notify('Added step to Morning Protocol');
        };

        const deleteMorningItem = (id) => {
          setData((prev) => ({
            ...prev,
            morningRoutine: morningRoutine.filter((i) => i.id !== id)
          }));
        };

        const morningStreak = useMemo(() => {
          let s = 0;
          const cur = new Date(today.getFullYear(), today.getMonth(), today.getDate());
          const hasAny = (k) => Object.keys(morningLog[k] || {}).length > 0;
          if (!hasAny(ymd(cur))) cur.setDate(cur.getDate() - 1);
          while (hasAny(ymd(cur))) {
            s++;
            cur.setDate(cur.getDate() - 1);
          }
          return s;
        }, [morningLog, todayKey]);

        const addDecision = (e) => {
          e.preventDefault();
          if (!decText.trim()) return;
          const item = {
            id: 'dec-' + Date.now(),
            title: decText.trim(),
            quadrant: decQuad,
            resolved: false,
            date: todayKey
          };
          setData((prev) => ({
            ...prev,
            decisions: [item, ...(prev.decisions || [])]
          }));
          setDecText('');
          notify('Logged to Decision Matrix');
        };

        const resolveDecision = (id) => {
          setData((prev) => ({
            ...prev,
            decisions: (prev.decisions || []).map((d) =>
              d.id === id ? { ...d, resolved: !d.resolved } : d
            )
          }));
          awardXP(10, 'Resolved executive decision');
        };

        const deleteDecision = (id) => {
          setData((prev) => ({
            ...prev,
            decisions: (prev.decisions || []).filter((d) => d.id !== id)
          }));
        };

        const STATIC_TIPS = [
          { title: 'Night-Before Launchpad', desc: 'Prepare bag, outfit, and ID tray the night before so mornings require zero decisions.' },
          { title: 'Zero-Screen First 30m', desc: 'No phone or notifications for the first 30 minutes after waking to protect dopamine baseline.' },
          { title: 'Sunlight & Hydration First', desc: 'Drink water and view natural outdoor light immediately to anchor circadian cortisol.' },
          { title: 'Hardest Task First', desc: 'Attack your highest-leverage engineering or study problem before checking messages.' },
          { title: 'One Fixed Bus Time', desc: 'Commit to one non-negotiable departure time rather than recalculating every morning.' },
          { title: 'Single Pocket Audit', desc: 'Verify ID card, wallet, keys, and charger at the door threshold before stepping out.' }
        ];

        const QUADRANTS = [
          {
            id: 'q1',
            axis: 'IMPORTANT + IRREVERSIBLE',
            title: 'Think slowly',
            sub: 'Use data and wait a day before locking in.'
          },
          {
            id: 'q2',
            axis: 'IMPORTANT + REVERSIBLE',
            title: 'Decide fast, then adjust',
            sub: 'Execute quickly and iterate from feedback.'
          },
          {
            id: 'q3',
            axis: 'NOT IMPORTANT + IRREVERSIBLE',
            title: 'Be careful, then forget',
            sub: 'Verify downside once, commit, and move on.'
          },
          {
            id: 'q4',
            axis: 'NOT IMPORTANT + REVERSIBLE',
            title: 'Just do it / delegate',
            sub: 'Zero overthinking—automate or act in <2 minutes.'
          }
        ];

        return (
          <div className="space-y-6">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                18 // AUTONOMIC LAUNCH CHECKLIST &amp; STRATEGIC TRIAGE
              </div>
              <h1 className="text-2xl font-semibold heading-tight mt-1">Executive Function &amp; Decision Matrix</h1>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-5 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="font-mono text-[11px] uppercase tracking-wider block" style={{ color: 'var(--ink-muted)' }}>
                      01 // MORNING PROTOCOL ({todayKey})
                    </span>
                    <span className="font-mono text-[10px]" style={{ color: 'var(--ink-secondary)' }}>
                      Auto-resets daily by date
                    </span>
                  </div>
                  <span className="font-mono text-xs px-2.5 py-1 rounded border tabular-nums" style={{ color: 'var(--status-ok)' }}>
                    STREAK: {morningStreak}D
                  </span>
                </div>

                <div className="divide-y">
                  {morningRoutine.map((item) => {
                    const checked = !!todayChecked[item.id];
                    return (
                      <div key={item.id} className="py-2.5 flex items-center justify-between gap-2">
                        <label className="flex items-center gap-2.5 cursor-pointer flex-1">
                          <input
                            type="checkbox"
                            checked={checked}
                            onChange={() => toggleMorningItem(item.id)}
                            className="w-4 h-4 cursor-pointer"
                          />
                          <span className={`text-xs font-medium ${checked ? 'line-through opacity-50' : ''}`}>
                            {item.title}
                          </span>
                        </label>
                        <div className="flex items-center gap-2">
                          {item.time && (
                            <span className="font-mono text-[11px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                              {item.time}
                            </span>
                          )}
                          <button
                            type="button"
                            onClick={() => deleteMorningItem(item.id)}
                            className="arch-btn-ghost p-1 rounded"
                          >
                            <Icon name="trash" size={12} />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <form onSubmit={addMorningItem} className="flex gap-2 pt-2 border-t">
                  <input
                    value={newItemTitle}
                    onChange={(e) => setNewItemTitle(e.target.value)}
                    placeholder="Add checklist item..."
                    className="flex-1 arch-input rounded-md px-2.5 py-1.5 text-xs"
                  />
                  <input
                    type="time"
                    value={newItemTime}
                    onChange={(e) => setNewItemTime(e.target.value)}
                    className="arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                  />
                  <button type="submit" className="arch-btn-primary px-3 py-1.5 rounded-md text-xs font-mono">
                    + Add
                  </button>
                </form>
              </div>

              <div className="lg:col-span-7 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    02 // 2x2 EXECUTIVE DECISION MATRIX (IMPORTANT VS REVERSIBLE)
                  </span>
                </div>

                <form onSubmit={addDecision} className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                  <input
                    value={decText}
                    onChange={(e) => setDecText(e.target.value)}
                    placeholder="Decision to evaluate..."
                    className="sm:col-span-6 arch-input rounded-md px-3 py-1.5 text-xs"
                  />
                  <select
                    value={decQuad}
                    onChange={(e) => setDecQuad(e.target.value)}
                    className="sm:col-span-4 arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                  >
                    <option value="q1">Important + Irreversible</option>
                    <option value="q2">Important + Reversible</option>
                    <option value="q3">Not Important + Irreversible</option>
                    <option value="q4">Not Important + Reversible</option>
                  </select>
                  <button type="submit" className="sm:col-span-2 arch-btn-primary rounded-md py-1.5 text-xs font-mono">
                    + Place
                  </button>
                </form>

                <div className="hairline-grid grid grid-cols-1 md:grid-cols-2 rounded-xl overflow-hidden">
                  {QUADRANTS.map((q) => {
                    const items = decisions.filter((d) => d.quadrant === q.id);
                    return (
                      <div key={q.id} className="hairline-cell p-4 min-h-[175px] flex flex-col justify-between space-y-3">
                        <div>
                          <div className="font-mono text-[10px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                            {q.axis}
                          </div>
                          <h3 className="text-sm font-semibold mt-0.5">{q.title}</h3>
                          <p className="text-[11px]" style={{ color: 'var(--ink-secondary)' }}>{q.sub}</p>
                        </div>

                        <div className="space-y-1.5">
                          {items.length === 0 ? (
                            <div className="font-mono text-[10px] py-2" style={{ color: 'var(--ink-muted)' }}>
                              [EMPTY QUADRANT]
                            </div>
                          ) : (
                            items.map((d) => (
                              <div
                                key={d.id}
                                className="px-2.5 py-1.5 rounded border flex items-center justify-between gap-2 text-xs"
                                style={{ backgroundColor: 'var(--bg-canvas)' }}
                              >
                                <span className={d.resolved ? 'line-through opacity-50' : ''}>{d.title}</span>
                                <div className="flex items-center gap-1 shrink-0">
                                  <button
                                    type="button"
                                    onClick={() => resolveDecision(d.id)}
                                    className="arch-btn-ghost px-1.5 py-0.5 rounded font-mono text-[10px]"
                                  >
                                    {d.resolved ? 'Undo' : 'Resolve'}
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => deleteDecision(d.id)}
                                    className="arch-btn-ghost p-0.5 rounded"
                                  >
                                    <Icon name="trash" size={11} />
                                  </button>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="arch-panel rounded-xl p-5 space-y-4">
              <div className="flex items-center justify-between">
                <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  03 // EXECUTIVE OPERATING RECOMMENDATIONS
                </span>
                <button
                  type="button"
                  onClick={() => setShowTips(!showTips)}
                  className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono"
                >
                  {showTips ? 'COLLAPSE [-]' : 'EXPAND [+]'}
                </button>
              </div>

              {showTips && (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {STATIC_TIPS.map((tip, i) => (
                    <div key={i} className="p-3.5 rounded-lg border space-y-1" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                      <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--status-ok)' }}>
                        RULE 0{i + 1}
                      </div>
                      <div className="text-xs font-semibold">{tip.title}</div>
                      <p className="text-xs leading-relaxed" style={{ color: 'var(--ink-secondary)' }}>
                        {tip.desc}
                      </p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      };

      // VIEW 19: TRAJECTORY & ROADMAP ARCHITECT
      const TrajectoryView = () => {
        const { data, setData, notify, awardXP } = useContext(NexoraContext);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const today = new Date();
        const todayKey = ymd(today);

        const growthMetrics = data.growthMetrics || [];
        const roadmaps = data.roadmaps || [];

        const [mName, setMName] = useState('');
        const [mUnit, setMUnit] = useState('pts');
        const [mBaseVal, setMBaseVal] = useState('');
        const [mBaseDate, setMBaseDate] = useState(todayKey);
        const [checkInVals, setCheckInVals] = useState({});

        const [selectedRoadmapId, setSelectedRoadmapId] = useState(() => roadmaps[0]?.id || '');
        const [newRoadmapTitle, setNewRoadmapTitle] = useState('');
        const [msTitle, setMsTitle] = useState('');
        const [msDate, setMsDate] = useState(todayKey);
        const [msStatus, setMsStatus] = useState('Planned');

        const activeRoadmap = roadmaps.find((r) => r.id === selectedRoadmapId) || roadmaps[0] || null;

        const addMetric = (e) => {
          e.preventDefault();
          if (!mName.trim()) return;
          const baseNum = Number(mBaseVal) || 0;
          const newM = {
            id: 'gm-' + Date.now(),
            name: mName.trim(),
            unit: mUnit.trim() || 'units',
            baselineValue: baseNum,
            baselineDate: mBaseDate || todayKey,
            points: [{ date: mBaseDate || todayKey, value: baseNum }]
          };
          setData((prev) => ({
            ...prev,
            growthMetrics: [...(prev.growthMetrics || []), newM]
          }));
          setMName('');
          setMBaseVal('');
          notify('Growth metric initialized');
        };

        const logMetricCheckIn = (metricId) => {
          const raw = checkInVals[metricId];
          if (raw === undefined || raw === '') return;
          const val = Number(raw);
          setData((prev) => ({
            ...prev,
            growthMetrics: (prev.growthMetrics || []).map((m) =>
              m.id === metricId
                ? { ...m, points: [...(m.points || []), { date: todayKey, value: val }] }
                : m
            )
          }));
          setCheckInVals((prev) => ({ ...prev, [metricId]: '' }));
          awardXP(10, 'Logged metric trajectory check-in');
        };

        const deleteMetric = (id) => {
          setData((prev) => ({
            ...prev,
            growthMetrics: (prev.growthMetrics || []).filter((m) => m.id !== id)
          }));
        };

        const addRoadmap = (e) => {
          e.preventDefault();
          if (!newRoadmapTitle.trim()) return;
          const nr = {
            id: 'rm-' + Date.now(),
            title: newRoadmapTitle.trim(),
            milestones: []
          };
          setData((prev) => ({
            ...prev,
            roadmaps: [...(prev.roadmaps || []), nr]
          }));
          setSelectedRoadmapId(nr.id);
          setNewRoadmapTitle('');
          notify('Roadmap created');
        };

        const addMilestone = (e) => {
          e.preventDefault();
          if (!activeRoadmap || !msTitle.trim()) return;
          const nms = {
            id: 'ms-' + Date.now(),
            title: msTitle.trim(),
            targetDate: msDate || todayKey,
            status: msStatus
          };
          setData((prev) => ({
            ...prev,
            roadmaps: (prev.roadmaps || []).map((r) =>
              r.id === activeRoadmap.id
                ? { ...r, milestones: [...(r.milestones || []), nms] }
                : r
            )
          }));
          setMsTitle('');
          notify('Milestone added to roadmap');
        };

        const updateMilestoneStatus = (roadmapId, msId, nextStatus) => {
          setData((prev) => ({
            ...prev,
            roadmaps: (prev.roadmaps || []).map((r) =>
              r.id === roadmapId
                ? {
                    ...r,
                    milestones: (r.milestones || []).map((m) =>
                      m.id === msId ? { ...m, status: nextStatus } : m
                    )
                  }
                : r
            )
          }));
          if (nextStatus === 'Done') {
            awardXP(30, 'Completed Roadmap Milestone');
          }
        };

        const deleteMilestone = (roadmapId, msId) => {
          setData((prev) => ({
            ...prev,
            roadmaps: (prev.roadmaps || []).map((r) =>
              r.id === roadmapId
                ? { ...r, milestones: (r.milestones || []).filter((m) => m.id !== msId) }
                : r
            )
          }));
        };

        const sortedMilestones = useMemo(() => {
          if (!activeRoadmap) return [];
          return [...(activeRoadmap.milestones || [])].sort((a, b) =>
            (a.targetDate || '').localeCompare(b.targetDate || '')
          );
        }, [activeRoadmap]);

        return (
          <div className="space-y-6">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                19 // BASELINE DELTA CHARTS &amp; MILESTONE CHRONOLOGY
              </div>
              <h1 className="text-2xl font-semibold heading-tight mt-1">Trajectory &amp; Roadmap Architect</h1>
            </div>

            <div className="arch-panel rounded-xl p-5 space-y-4">
              <span className="font-mono text-[11px] uppercase tracking-wider block" style={{ color: 'var(--ink-muted)' }}>
                01 // GROWTH TRAJECTORY GRAPHS (BASELINE &rarr; NOW)
              </span>

              <form onSubmit={addMetric} className="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                <input
                  value={mName}
                  onChange={(e) => setMName(e.target.value)}
                  placeholder="Metric name (e.g., DSA Problems Solved, Focus Hours)..."
                  className="sm:col-span-4 arch-input rounded-md px-3 py-2 text-xs"
                />
                <input
                  type="number"
                  step="any"
                  value={mBaseVal}
                  onChange={(e) => setMBaseVal(e.target.value)}
                  placeholder="Baseline value (start)"
                  className="sm:col-span-2 arch-input rounded-md px-3 py-2 text-xs font-mono"
                />
                <input
                  value={mUnit}
                  onChange={(e) => setMUnit(e.target.value)}
                  placeholder="Unit (e.g. probs, hrs)"
                  className="sm:col-span-2 arch-input rounded-md px-3 py-2 text-xs font-mono"
                />
                <input
                  type="date"
                  value={mBaseDate}
                  onChange={(e) => setMBaseDate(e.target.value)}
                  className="sm:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs font-mono"
                />
                <button type="submit" className="sm:col-span-2 arch-btn-primary rounded-md py-2 text-xs font-mono">
                  + Track Metric
                </button>
              </form>

              {growthMetrics.length === 0 ? (
                <EmptyState
                  code="TRAJECTORY.GRAPH // 0_METRICS"
                  title="No growth metrics tracked yet"
                  subtitle="Define a metric with its starting baseline above, then log check-in values over time to render your SVG trajectory chart."
                />
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {growthMetrics.map((m) => {
                    const pts = m.points && m.points.length > 0 ? m.points : [{ date: m.baselineDate, value: m.baselineValue }];
                    const startVal = Number(m.baselineValue) || 0;
                    const nowVal = Number(pts[pts.length - 1].value) || 0;
                    const delta = +(nowVal - startVal).toFixed(2);
                    const deltaSign = delta >= 0 ? `+${delta}` : `${delta}`;

                    const vals = pts.map((p) => Number(p.value) || 0);
                    const minV = Math.min(startVal, ...vals);
                    const maxV = Math.max(startVal + 1, ...vals);
                    const span = Math.max(1, maxV - minV);

                    const toX = (i) => (pts.length === 1 ? 150 : 20 + (i / (pts.length - 1)) * 260);
                    const toY = (v) => 100 - ((v - minV) / span) * 75;
                    const polyPoints = pts.map((p, i) => `${toX(i)},${toY(Number(p.value) || 0)}`).join(' ');
                    const baseY = toY(startVal);

                    return (
                      <div key={m.id} className="p-4 rounded-xl border space-y-3" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <span className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>
                              BASELINE ({m.baselineDate})
                            </span>
                            <h3 className="text-sm font-semibold">{m.name}</h3>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-xs px-2 py-0.5 rounded border tabular-nums" style={{ color: 'var(--status-ok)' }}>
                              Started {startVal} &rarr; Now {nowVal} ({deltaSign} {m.unit})
                            </span>
                            <button
                              type="button"
                              onClick={() => deleteMetric(m.id)}
                              className="arch-btn-ghost p-1 rounded"
                            >
                              <Icon name="trash" size={12} />
                            </button>
                          </div>
                        </div>

                        <div className="rounded-lg border p-2" style={{ backgroundColor: 'var(--bg-surface)' }}>
                          <svg viewBox="0 0 300 115" className="w-full h-28 overflow-visible">
                            <line
                              x1="15"
                              y1={baseY}
                              x2="285"
                              y2={baseY}
                              stroke="var(--ink-muted)"
                              strokeDasharray="3 3"
                              strokeWidth="1"
                            />
                            <text x="18" y={Math.max(12, baseY - 4)} fill="var(--ink-muted)" fontSize="8" fontFamily="JetBrains Mono, monospace">
                              BASELINE: {startVal}
                            </text>
                            {pts.length > 1 && (
                              <polyline
                                fill="none"
                                stroke="var(--status-ok)"
                                strokeWidth="2"
                                points={polyPoints}
                              />
                            )}
                            {pts.map((p, idx) => (
                              <circle
                                key={idx}
                                cx={toX(idx)}
                                cy={toY(Number(p.value) || 0)}
                                r="3.5"
                                fill="var(--status-ok)"
                              />
                            ))}
                          </svg>
                        </div>

                        <div className="flex gap-2">
                          <input
                            type="number"
                            step="any"
                            value={checkInVals[m.id] ?? ''}
                            onChange={(e) => setCheckInVals((prev) => ({ ...prev, [m.id]: e.target.value }))}
                            placeholder={`Current ${m.unit} value...`}
                            className="flex-1 arch-input rounded-md px-2.5 py-1 text-xs font-mono"
                          />
                          <button
                            type="button"
                            onClick={() => logMetricCheckIn(m.id)}
                            className="arch-btn-primary px-3 py-1 rounded-md text-xs font-mono"
                          >
                            + Check-In Now
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div className="arch-panel rounded-xl p-5 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  02 // MULTI-ROADMAP TIMELINE ARCHITECT
                </span>

                <form onSubmit={addRoadmap} className="flex gap-2">
                  <input
                    value={newRoadmapTitle}
                    onChange={(e) => setNewRoadmapTitle(e.target.value)}
                    placeholder="New roadmap (e.g., AI/ML Mastery)..."
                    className="arch-input rounded-md px-3 py-1 text-xs"
                  />
                  <button type="submit" className="arch-btn-primary px-3 py-1 rounded-md text-xs font-mono">
                    + Roadmap
                  </button>
                </form>
              </div>

              {roadmaps.length > 0 && (
                <div className="flex flex-wrap gap-1.5">
                  {roadmaps.map((r) => (
                    <button
                      key={r.id}
                      type="button"
                      onClick={() => setSelectedRoadmapId(r.id)}
                      className={`px-3 py-1 rounded-md text-xs font-mono ${
                        activeRoadmap?.id === r.id ? 'arch-btn-primary' : 'arch-btn-ghost'
                      }`}
                    >
                      {r.title} ({(r.milestones || []).length})
                    </button>
                  ))}
                </div>
              )}

              {!activeRoadmap ? (
                <EmptyState
                  code="ROADMAP.TIMELINE // 0_ROADMAPS"
                  title="No roadmaps initialized"
                  subtitle="Create your first roadmap above (e.g., AI/ML Mastery or College Year 1), then add chronological milestones."
                />
              ) : (
                <div className="space-y-4">
                  <form onSubmit={addMilestone} className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                    <input
                      value={msTitle}
                      onChange={(e) => setMsTitle(e.target.value)}
                      placeholder={`Add milestone to ${activeRoadmap.title}...`}
                      className="sm:col-span-5 arch-input rounded-md px-3 py-1.5 text-xs"
                    />
                    <input
                      type="date"
                      value={msDate}
                      onChange={(e) => setMsDate(e.target.value)}
                      className="sm:col-span-3 arch-input rounded-md px-2.5 py-1.5 text-xs font-mono"
                    />
                    <select
                      value={msStatus}
                      onChange={(e) => setMsStatus(e.target.value)}
                      className="sm:col-span-2 arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                    >
                      <option value="Planned">Planned</option>
                      <option value="In progress">In progress</option>
                      <option value="Done">Done</option>
                    </select>
                    <button type="submit" className="sm:col-span-2 arch-btn-primary rounded-md py-1.5 text-xs font-mono">
                      + Milestone
