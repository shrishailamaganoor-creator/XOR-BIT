    body {
      margin: 0;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .heading-tight {
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    /* Architectural Surface with Specular Top Highlight & Cursor Spotlight */
    .arch-panel {
      position: relative;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      box-shadow: inset 0 1px 0 0 var(--specular-top);
      transition: border-color 180ms cubic-bezier(0.22, 1, 0.36, 1), background-color 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .arch-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(380px circle at var(--mouse-x, -500px) var(--mouse-y, -500px), var(--spotlight), transparent 45%);
      z-index: 0;
    }

    .arch-panel > * {
      position: relative;
      z-index: 1;
    }

    .arch-input {
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      color: var(--ink-primary);
      transition: border-color 150ms cubic-bezier(0.22, 1, 0.36, 1);

    .arch-input:focus {
      outline: none;
      border-color: var(--border-strong);
    }

    .arch-input::placeholder {
      color: var(--ink-muted);

    .arch-btn-primary {
      background-color: var(--accent);

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;
    const NexoraContext = createContext(null);

    // 1. ZERO-DEMO-DATA FACTORY STATE
    const STORAGE_KEY = 'NEXORA_ARCHITECTURAL_OS_V1';
    const IDB_NAME = 'NexoraStyleVaultDB';
    const IDB_STORE = 'garmentMedia';

    const DEFAULT_DAY_TYPES = [
      { id: 'productive', label: 'Logged / Productive Day', color: '#10B981' },

    const EMPTY_STATE = {
      habitDesigns: [],

      profile: {
        name: 'Shrishaila M',

        semester: 'Semester 1',
        theme: 'obsidian', // 'obsidian' | 'paper' | 'industrial'
        soundEnabled: true,

      },
      subjects: [],

        roverNodes: 0,

        memoryHigh: 0
      }
    };

    // Safe localStorage wrapper
    function isPlainObject(value) {
      return value !== null && typeof value === 'object' && !Array.isArray(value);
    }

    function mergeValidatedState(defaults, candidate, path = 'state') {
      if (Array.isArray(defaults)) {
        if (candidate === undefined) return [];
        if (!Array.isArray(candidate)) throw new Error(`${path} must be an array`);
        return candidate;
      }
      if (isPlainObject(defaults)) {
        if (candidate === undefined) return { ...defaults };
        if (!isPlainObject(candidate)) throw new Error(`${path} must be an object`);
        const merged = { ...defaults };
        Object.entries(candidate).forEach(([key, value]) => {
          merged[key] = Object.prototype.hasOwnProperty.call(defaults, key)
            ? mergeValidatedState(defaults[key], value, `${path}.${key}`)
            : value;
        });
        return merged;
      }
      if (candidate === undefined) return defaults;
      if (typeof candidate !== typeof defaults) throw new Error(`${path} has an invalid value`);
      return candidate;
    }

    function normalizeImportedState(candidate) {
      if (!isPlainObject(candidate)) throw new Error('Backup data must be an object');
      const normalized = mergeValidatedState(EMPTY_STATE, candidate);
      normalized.tasks = normalized.tasks.map((task) =>
        task && task.completed && task.rewardClaimed === undefined ? { ...task, rewardClaimed: true } : task
      );
      return normalized;
    }

    function validateImportedMedia(candidate) {
      if (!isPlainObject(candidate)) throw new Error('Backup media must be an object');
      const media = {};
      Object.entries(candidate).forEach(([key, value]) => {
        if (typeof value !== 'string' || value.length === 0) {
          throw new Error('Backup contains invalid media');
        }
        media[key] = value;
      });
      return media;
    }
    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return EMPTY_STATE;
        const parsed = JSON.parse(raw);
        const mergedProfile = { ...EMPTY_STATE.profile, ...(parsed.profile || {}) };
        if (mergedProfile.name === 'Operator') mergedProfile.name = 'Shrishaila M';
        return {
          ...EMPTY_STATE,
          ...parsed,
          tasks: (Array.isArray(parsed.tasks) ? parsed.tasks : []).map((task) =>
            task && task.completed && task.rewardClaimed === undefined ? { ...task, rewardClaimed: true } : task
          ),
          profile: mergedProfile,
          arcadeScores: { ...EMPTY_STATE.arcadeScores, ...(parsed.arcadeScores || {}) },
          dayTags: parsed.dayTags || {},
          customDayTypes: parsed.customDayTypes || [],
          habitShields: parsed.habitShields || {},
          ideas: parsed.ideas || [],
          distractionLog: parsed.distractionLog || [],
          shutdownDays: parsed.shutdownDays || {},
          focusGoalHrs: parsed.focusGoalHrs !== undefined ? parsed.focusGoalHrs : 10,
          feynmanNotes: parsed.feynmanNotes || [],
          recallQs: parsed.recallQs || [],
          lifeWheel: parsed.lifeWheel || [],
          lifeSettings: parsed.lifeSettings || {}
        };
      } catch (e) {
        return EMPTY_STATE;
      }
    }

    function savePersistedState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        return false;
      }
    }

    // IndexedDB helpers for Style Lab Wardrobe & Innovation Canvas Media
    function openMediaDB() {
      return new Promise((resolve) => {
        try {
          const idb = window.indexedDB;
          if (!idb) return resolve(null);
          const req = idb.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            try {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(IDB_STORE)) {
                db.createObjectStore(IDB_STORE);
              }
            } catch (err) {}
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    async function saveMediaToIDB(key, dataUrl) {
      try {
        const db = await openMediaDB();
        if (!db) return false;
        await new Promise((resolve, reject) => {
          let tx;
          try {
            tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(dataUrl, key);
          } catch (error) {
            reject(error);
            return;
          }
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error('Media save failed'));
          tx.onabort = () => reject(tx.error || new Error('Media save was cancelled'));
        });
        return true;
      } catch (e) {
        return false;
      }
    }

    async function loadAllMediaFromIDB() {
      try {
        const db = await openMediaDB();
        if (!db) return {};
        return new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const keysReq = store.getAllKeys();
          const valsReq = store.getAll();
          tx.oncomplete = () => {
            const map = {};
            (keysReq.result || []).forEach((k, i) => {
              map[k] = valsReq.result[i];
            });
            resolve(map);
          };
          tx.onerror = () => resolve({});
        });
      } catch (e) {
        return {};
      }
    }

    async function clearMediaIDB() {
      try {
        const db = await openMediaDB();
        if (!db) return;
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).clear();
      } catch (e) {}
    }

    async function replaceAllMediaInIDB(mediaMap) {
      const db = await openMediaDB();
      if (!db) {
        if (Object.keys(mediaMap).length === 0) return;
        throw new Error('IndexedDB is unavailable');
      }
      await new Promise((resolve, reject) => {
        let tx;
        try {
          tx = db.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          store.clear();
          Object.entries(mediaMap).forEach(([key, value]) => store.put(value, key));
        } catch (error) {
          reject(error);
          return;
        }
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('Media restore failed'));
        tx.onabort = () => reject(tx.error || new Error('Media restore was cancelled'));
      });
    }
    // 2. TACTILE MECHANICAL AUDIO SYNTHESIZER (Teenage Engineering Style)
    let sharedAudioCtx = null;
    function playTactileClick(enabled, pitch = 800, durationMs = 12) {

        if (!AudioCtx) return;
        if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
        if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();

        const osc = sharedAudioCtx.createOscillator();
        const gain = sharedAudioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, sharedAudioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, sharedAudioCtx.currentTime + durationMs / 1000);

        gain.gain.setValueAtTime(0.045, sharedAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, sharedAudioCtx.currentTime + durationMs / 1000);

        osc.connect(gain);
        gain.connect(sharedAudioCtx.destination);
        osc.start();
        osc.stop(sharedAudioCtx.currentTime + durationMs / 1000);
      } catch (e) {}
    }

          return <svg {...props}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>;
        case 'check':
          return <svg {...props}><polyline points="20 6 9 17 4 12" /></svg>;
        case 'clock':
          return <svg {...props}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>;
        case 'play':
          return <svg {...props}><polygon points="5 3 19 12 5 21 5 3" /></svg>;
        case 'pause':
          return <svg {...props}><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
        case 'reset':
          return <svg {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>;
        case 'download':
          return <svg {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>;
        case 'upload':
          return <svg {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></svg>;
        case 'user':
          return <svg {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>;
        case 'chevron-left':
          return <svg {...props}><polyline points="15 18 9 12 15 6" /></svg>;
        case 'chevron-right':
          return <svg {...props}><polyline points="9 18 15 12 9 6" /></svg>;
        case 'volume':
          return <svg {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /></svg>;
        case 'mute':
          return <svg {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>;
        case 'lock':
          return <svg {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>;
        case 'unlock':
          return <svg {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></svg>;
        case 'shield':
          return <svg {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>;
        default:
          return <svg {...props}><circle cx="12" cy="12" r="9" /></svg>;
      }
    };

    // Precision 7x7 Crosshair Marker
    const Crosshair = ({ className = '' }) => (
      <svg width="7" height="7" viewBox="0 0 7 7" className={`pointer-events-none select-none opacity-40 ${className}`} aria-hidden="true">
        <path d="M3.5 0v7M0 3.5h7" stroke="currentColor" strokeWidth="1" />
      </svg>
    );

    // Architectural Empty State Component
    const EmptyState = ({ code, title, subtitle, actionLabel, onAction }) => (
      <div className="arch-panel rounded-xl p-8 text-center relative overflow-hidden">
        <Crosshair className="absolute top-2.5 left-2.5" />
        <Crosshair className="absolute top-2.5 right-2.5" />
        <Crosshair className="absolute bottom-2.5 left-2.5" />
        <Crosshair className="absolute bottom-2.5 right-2.5" />
        <div className="font-mono text-[10px] uppercase tracking-widest mb-2" style={{ color: 'var(--ink-muted)' }}>
          {code || 'SYS.EMPTY // ZERO_RECORDS'}
        </div>
        <h3 className="text-sm font-semibold heading-tight mb-1" style={{ color: 'var(--ink-primary)' }}>
          {title}
        </h3>
        <p className="text-xs max-w-md mx-auto leading-relaxed" style={{ color: 'var(--ink-secondary)' }}>
          {subtitle}
        </p>
        {actionLabel && onAction && (
          <button
            type="button"
            onClick={onAction}
            className="mt-4 arch-btn-primary px-3.5 py-1.5 rounded-md text-xs font-medium inline-flex items-center gap-1.5"
          >
            <Icon name="plus" size={14} />
            <span>{actionLabel}</span>
          </button>
        )}
      </div>
    );

    // 4. SIMULATION DECK GAMES (Precision Line-Parking Rover & Upgraded Mini-Games)

    // 4A. Precision Line-Parking Rover Telemetry Canvas
    const RoverSimulationCanvas = ({ bestNodes, soundEnabled, onUpdateNodes, onJumpModule }) => {
      const canvasRef = useRef(null);
      const keysRef = useRef({});
      const [collectedCount, setCollectedCount] = useState(0);
      const [parkedPortal, setParkedPortal] = useState(null);
      const [gear, setGear] = useState(2); // 1 = Crawl (Parking), 2 = Normal Cruise, 3 = Sport
      const [speedReadout, setSpeedReadout] = useState('0.0');

      const parkedPortalRef = useRef(null);
      const onJumpModuleRef = useRef(onJumpModule);
      const onUpdateNodesRef = useRef(onUpdateNodes);
      const soundRef = useRef(soundEnabled);
      const gearRef = useRef(gear);
      const nodeRespawnTimersRef = useRef(new Set());
      useEffect(() => () => {
        nodeRespawnTimersRef.current.forEach((timerId) => clearTimeout(timerId));
        nodeRespawnTimersRef.current.clear();
      }, []);
      useEffect(() => { onJumpModuleRef.current = onJumpModule; }, [onJumpModule]);
      useEffect(() => { onUpdateNodesRef.current = onUpdateNodes; }, [onUpdateNodes]);
      useEffect(() => { soundRef.current = soundEnabled; }, [soundEnabled]);
      useEffect(() => { gearRef.current = gear; }, [gear]);

      const stateRef = useRef({
        x: 340,
        y: 235,
        vx: 0,
        vy: 0,
        angle: -Math.PI / 2,
        nodes: [
          { x: 130, y: 175, active: true },
          { x: 340, y: 165, active: true },
          { x: 550, y: 175, active: true },
          { x: 220, y: 265, active: true },
          { x: 460, y: 265, active: true }
        ],
        portals: [
          { id: 'academy', code: 'P1', label: 'ACADEMY', x: 75, y: 54, w: 92, h: 54 },
          { id: 'bank', code: 'P2', label: 'WALLET', x: 181, y: 54, w: 92, h: 54 },
          { id: 'missions', code: 'P3', label: 'MISSIONS', x: 287, y: 54, w: 92, h: 54 },
          { id: 'skills', code: 'P4', label: 'SKILLS', x: 393, y: 54, w: 92, h: 54 },
          { id: 'projects', code: 'P5', label: 'PROJECTS', x: 499, y: 54, w: 92, h: 54 },
          { id: 'habits', code: 'P6', label: 'HABITS', x: 605, y: 54, w: 92, h: 54 }
        ]
      });

      useEffect(() => {
        const down = (e) => {
          const tag = (e.target?.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

          const key = e.key.toLowerCase();

          if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
            e.preventDefault();
          }

          keysRef.current[key] = true;

          if ((e.key === 'Enter' || key === 'e') && parkedPortalRef.current) {
            e.preventDefault();
            playTactileClick(soundRef.current, 1120, 25);
            if (onJumpModuleRef.current) {
              onJumpModuleRef.current(parkedPortalRef.current.id);
            }
          }
        };

        const up = (e) => {
          keysRef.current[e.key.toLowerCase()] = false;
        };

        window.addEventListener('keydown', down, { passive: false });
        window.addEventListener('keyup', up);
        return () => {
          window.removeEventListener('keydown', down);
          window.removeEventListener('keyup', up);
        };
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let frameCounter = 0;

        const GEAR_CONFIG = {
          1: { accel: 0.065, maxSpeed: 1.35, turnSpeed: 0.032, drag: 0.86 },
          2: { accel: 0.11,  maxSpeed: 2.35, turnSpeed: 0.040, drag: 0.89 },
          3: { accel: 0.16,  maxSpeed: 3.40, turnSpeed: 0.046, drag: 0.91 }
        };

        const loop = () => {
          frameCounter++;
          const st = stateRef.current;
          const k = keysRef.current;
          const cfg = GEAR_CONFIG[gearRef.current] || GEAR_CONFIG[2];

          if (k['a'] || k['arrowleft']) st.angle -= cfg.turnSpeed;
          if (k['d'] || k['arrowright']) st.angle += cfg.turnSpeed;

          if (k['w'] || k['arrowup']) {
            st.vx += Math.cos(st.angle) * cfg.accel;
            st.vy += Math.sin(st.angle) * cfg.accel;
          }
          if (k['s'] || k['arrowdown']) {
            st.vx -= Math.cos(st.angle) * (cfg.accel * 0.75);
            st.vy -= Math.sin(st.angle) * (cfg.accel * 0.75);
          }

          if (k[' ']) {
            st.vx *= 0.65;
            st.vy *= 0.65;
          } else {
            st.vx *= cfg.drag;
            st.vy *= cfg.drag;
          }

          const currentSpeed = Math.hypot(st.vx, st.vy);
          if (currentSpeed > cfg.maxSpeed) {
            st.vx = (st.vx / currentSpeed) * cfg.maxSpeed;
            st.vy = (st.vy / currentSpeed) * cfg.maxSpeed;
          }
          if (currentSpeed < 0.015) {
            st.vx = 0;
            st.vy = 0;
          }

          st.x = Math.max(24, Math.min(canvas.width - 24, st.x + st.vx));
          st.y = Math.max(24, Math.min(canvas.height - 24, st.y + st.vy));

          const finalSpeed = Math.hypot(st.vx, st.vy);
          if (frameCounter % 6 === 0) {
            setSpeedReadout((finalSpeed * 10).toFixed(1));
          }

          st.nodes.forEach((n) => {
            if (n.active && Math.hypot(st.x - n.x, st.y - n.y) < 20) {
              n.active = false;
              playTactileClick(soundRef.current, 980, 18);
              setCollectedCount((prev) => {
                const next = prev + 1;
                if (onUpdateNodesRef.current) onUpdateNodesRef.current(next);
                return next;
              });
              const respawnTimer = setTimeout(() => {
                nodeRespawnTimersRef.current.delete(respawnTimer);
                n.x = 70 + Math.random() * (canvas.width - 140);
                n.y = 140 + Math.random() * (canvas.height - 175);
                n.active = true;
              }, 1100);
              nodeRespawnTimersRef.current.add(respawnTimer);
            }
          });

          let activeBay = null;
          st.portals.forEach((p) => {
            const insideX = Math.abs(st.x - p.x) <= p.w / 2 - 4;
            const insideY = Math.abs(st.y - p.y) <= p.h / 2 - 2;
            if (insideX && insideY) {
              activeBay = { ...p, isStopped: finalSpeed < 0.45 };
            }
          });

          const prevBayId = parkedPortalRef.current?.id;
          const prevStopped = parkedPortalRef.current?.isStopped;
          if (activeBay?.id !== prevBayId || activeBay?.isStopped !== prevStopped) {
            if (activeBay && activeBay.id !== prevBayId) {
              playTactileClick(soundRef.current, 720, 10);
            }
            parkedPortalRef.current = activeBay;
            setParkedPortal(activeBay);
          }

          ctx.fillStyle = '#09090B';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = 'rgba(255,255,255,0.045)';
          ctx.lineWidth = 1;
          for (let gx = 0; gx < canvas.width; gx += 34) {
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.lineTo(gx, canvas.height);
            ctx.stroke();
          }
          for (let gy = 0; gy < canvas.height; gy += 34) {
            ctx.beginPath();
            ctx.moveTo(0, gy);
            ctx.lineTo(canvas.width, gy);
            ctx.stroke();
          }

          ctx.strokeStyle = 'rgba(255,255,255,0.14)';
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(16, 102);
          ctx.lineTo(canvas.width - 16, 102);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          ctx.font = '500 9px "JetBrains Mono", monospace';
          ctx.textAlign = 'left';
          ctx.fillText('LINEAR PARKING LINE // PARK ROVER IN ANY BAY & PRESS [ENTER] TO OPEN MODULE', 22, 18);

          st.portals.forEach((p) => {
            const isOccupied = activeBay && activeBay.id === p.id;
            const isLocked = isOccupied && activeBay.isStopped;
            const left = p.x - p.w / 2;
            const top = p.y - p.h / 2;

            ctx.fillStyle = isLocked
              ? 'rgba(16, 185, 129, 0.18)'
              : isOccupied
              ? 'rgba(245, 158, 11, 0.15)'
              : 'rgba(255, 255, 255, 0.025)';
            ctx.fillRect(left, top, p.w, p.h);

            ctx.fillStyle = isLocked ? '#10B981' : isOccupied ? '#F59E0B' : 'rgba(255,255,255,0.28)';
            ctx.fillRect(left + 8, top + 4, p.w - 16, 3);

            ctx.strokeStyle = isLocked ? '#10B981' : isOccupied ? '#F59E0B' : 'rgba(255,255,255,0.28)';
            ctx.lineWidth = isOccupied ? 2 : 1.25;
            ctx.beginPath();
            ctx.moveTo(left, top + p.h);
            ctx.lineTo(left, top);
            ctx.lineTo(left + p.w, top);
            ctx.lineTo(left + p.w, top + p.h);
            ctx.stroke();

            ctx.fillStyle = isLocked ? '#10B981' : isOccupied ? '#F59E0B' : '#FAFAFA';
            ctx.font = '600 10px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${p.code} // ${p.label}`, p.x, top + 24);

            ctx.fillStyle = isLocked ? '#10B981' : 'rgba(255,255,255,0.42)';
            ctx.font = '500 8px "JetBrains Mono", monospace';
            ctx.fillText(
              isLocked ? 'LOCKED [PRESS ENTER]' : isOccupied ? 'SLOW DOWN TO LOCK' : 'PARKING BAY',
              p.x,
              top + 40
            );
          });

          st.nodes.forEach((n) => {
            if (!n.active) return;
            ctx.beginPath();
            ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#F59E0B';
            ctx.fill();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.32)';
            ctx.lineWidth = 4;
            ctx.stroke();
          });

          if (st.y < 145) {
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.25)';
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(st.x, st.y);
            ctx.lineTo(st.x, 27);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.save();
          ctx.translate(st.x, st.y);
          ctx.rotate(st.angle);

          ctx.fillStyle = '#52525B';
          ctx.fillRect(-12, -11, 7, 3);
          ctx.fillRect(5, -11, 7, 3);
          ctx.fillRect(-12, 8, 7, 3);
          ctx.fillRect(5, 8, 7, 3);

          ctx.fillStyle = '#FAFAFA';
          ctx.fillRect(-14, -8, 28, 16);
          ctx.strokeStyle = '#09090B';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-14, -8, 28, 16);

          ctx.fillStyle = activeBay ? '#10B981' : '#3B82F6';
          ctx.fillRect(4, -5, 6, 10);

          if (k[' '] || (activeBay && activeBay.isStopped)) {
            ctx.fillStyle = '#F43F5E';
            ctx.fillRect(-14, -6, 2, 4);
            ctx.fillRect(-14, 2, 2, 4);
          }
          ctx.restore();

          if (activeBay) {
            ctx.fillStyle = 'rgba(9, 9, 11, 0.92)';
            ctx.fillRect(170, 276, 340, 32);
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(170, 276, 340, 32);
            ctx.fillStyle = '#10B981';
            ctx.font = '600 11px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(
              `PARKED IN [${activeBay.code}: ${activeBay.label}] — PRESS ENTER TO OPEN`,
              340,
              296
            );
          }

          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animId);
      }, []);

      const handleCanvasClick = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const cx = (e.clientX - rect.left) * scaleX;
        const cy = (e.clientY - rect.top) * scaleY;

        const clickedBay = stateRef.current.portals.find(
          (p) => Math.abs(cx - p.x) <= p.w / 2 && Math.abs(cy - p.y) <= p.h / 2
        );
        if (clickedBay) {
          playTactileClick(soundRef.current, 1080, 20);
          if (onJumpModuleRef.current) onJumpModuleRef.current(clickedBay.id);
        }
      };

      const stepMove = (dir) => {
        const st = stateRef.current;
        if (dir === 'up') {
          st.vx += Math.cos(st.angle) * 0.9;
          st.vy += Math.sin(st.angle) * 0.9;
        } else if (dir === 'down') {
          st.vx -= Math.cos(st.angle) * 0.7;
          st.vy -= Math.sin(st.angle) * 0.7;
        } else if (dir === 'left') {
          st.angle -= 0.25;
        } else if (dir === 'right') {
          st.angle += 0.25;
        } else if (dir === 'stop') {
          st.vx = 0;
          st.vy = 0;
        }
      };

      return (
        <div className="arch-panel rounded-xl p-4 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex flex-wrap items-center gap-2.5">
              <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                SIM.01 // PRECISION LINE-PARKING ROVER
              </span>
              <span className="font-mono text-xs tabular-nums px-2 py-0.5 rounded border" style={{ color: 'var(--ink-primary)' }}>
                NODES: {collectedCount} | RECORD: {bestNodes}
              </span>
              <span className="font-mono text-xs tabular-nums px-2 py-0.5 rounded border" style={{ color: 'var(--ink-secondary)' }}>
                VEL: {speedReadout} u/s
              </span>
            </div>

            <div className="flex items-center gap-1.5">
              <span className="font-mono text-[10px] uppercase mr-1" style={{ color: 'var(--ink-muted)' }}>
                SPEED LIMITER:
              </span>
              {[
                { g: 1, label: 'G1: CRAWL' },
                { g: 2, label: 'G2: CRUISE' },
                { g: 3, label: 'G3: SPORT' }
              ].map((item) => (
                <button
                  key={item.g}
                  type="button"
                  onClick={() => {
                    playTactileClick(soundEnabled, 700 + item.g * 100, 12);
                    setGear(item.g);
                  }}
                  className={`px-2 py-1 rounded text-[10px] font-mono transition ${
                    gear === item.g ? 'arch-btn-primary' : 'arch-btn-ghost'
                  }`}
                >
                  {item.label}
                </button>
              ))}
            </div>
          </div>

          <div className="relative rounded-lg overflow-hidden border" style={{ borderColor: 'var(--border-hairline)' }}>
            <canvas
              ref={canvasRef}
              width={680}
              height={320}
              onClick={handleCanvasClick}
              className="w-full h-60 sm:h-72 block bg-[#09090B] cursor-pointer"
            />
          </div>

          <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
            <div className="flex flex-wrap gap-1.5">
              <button type="button" onClick={() => stepMove('left')} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">
                STEER L [A]
              </button>
              <button type="button" onClick={() => stepMove('up')} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">
                DRIVE [W]
              </button>
              <button type="button" onClick={() => stepMove('down')} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">
                REVERSE [S]
              </button>
              <button type="button" onClick={() => stepMove('right')} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">
                STEER R [D]
              </button>
              <button type="button" onClick={() => stepMove('stop')} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">
                BRAKE [SPACE]
              </button>
            </div>

            <div className="flex items-center gap-2">
              {parkedPortal ? (
                <button
                  type="button"
                  onClick={() => onJumpModule(parkedPortal.id)}
                  className="arch-btn-primary px-3 py-1 rounded text-xs font-mono animate-pulse"
                >
                  OPEN {parkedPortal.label} [PRESS ENTER] &rarr;
                </button>
              ) : (
                <span className="font-mono text-[11px]" style={{ color: 'var(--ink-muted)' }}>
                  Park in any top bay (P1–P6) &amp; press <kbd className="px-1 py-0.5 border rounded">Enter</kbd>
                </span>
              )}
            </div>
          </div>
        </div>
      );
    };

    // 4B. Upgraded Vector Snake Game (Speed Control, Grid Rendering, Queue Input + Secret Trapdoor)
    const VectorSnakeGame = ({ bestScore, onNewBest, soundEnabled, onUnlockVault }) => {
      const [running, setRunning] = useState(false);
      const [gameOver, setGameOver] = useState(false);
      const [score, setScore] = useState(0);
      const [speedMs, setSpeedMs] = useState(145);
      const canvasRef = useRef(null);
      const secretSeqRef = useRef({ armedH: false, timestamp: 0 });
      const hoveredRef = useRef(false);

      const stateRef = useRef({
        snake: [{ x: 8, y: 6 }, { x: 7, y: 6 }, { x: 6, y: 6 }],
        dir: { x: 1, y: 0 },
        nextDir: { x: 1, y: 0 },
        food: { x: 12, y: 6 }
      });

      useEffect(() => {
        const handleSecretKey = (e) => {
          const tag = (e.target?.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

          const k = e.key.toLowerCase();
          const now = Date.now();

          if (k === 'h' && (e.ctrlKey || e.metaKey || hoveredRef.current || running)) {
            e.preventDefault();
            secretSeqRef.current = { armedH: true, timestamp: now };
            return;
          }

          if (k === 'o' && secretSeqRef.current.armedH && now - secretSeqRef.current.timestamp < 2500) {
            e.preventDefault();
            secretSeqRef.current = { armedH: false, timestamp: 0 };
            playTactileClick(soundEnabled, 1240, 30);
            if (onUnlockVault) onUnlockVault();
            return;
          }

          if (k !== 'control' && k !== 'meta' && k !== 'shift') {
            secretSeqRef.current = { armedH: false, timestamp: 0 };
          }
        };

        window.addEventListener('keydown', handleSecretKey);
        return () => window.removeEventListener('keydown', handleSecretKey);
      }, [running, soundEnabled, onUnlockVault]);

      const drawBoard = useCallback(() => {
        const ctx = canvasRef.current?.getContext('2d');
        if (!ctx) return;
        const st = stateRef.current;

        ctx.fillStyle = '#09090B';
        ctx.fillRect(0, 0, 240, 180);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= 240; x += 15) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 180); ctx.stroke();
        }
        for (let y = 0; y <= 180; y += 15) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(240, y); ctx.stroke();
        }

        ctx.fillStyle = '#10B981';
        ctx.fillRect(st.food.x * 15 + 2, st.food.y * 15 + 2, 11, 11);

        st.snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#FAFAFA' : '#A1A1AA';
          ctx.fillRect(seg.x * 15 + 1, seg.y * 15 + 1, 13, 13);
        });
      }, []);

      useEffect(() => {
        drawBoard();
      }, [drawBoard]);

      useEffect(() => {
        if (!running) return;

        const onKey = (e) => {
          const tag = (e.target?.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea') return;

          const d = stateRef.current.dir;
          if ((e.key === 'ArrowUp' || e.key === 'w') && d.y === 0) {
            e.preventDefault();
            stateRef.current.nextDir = { x: 0, y: -1 };
          } else if ((e.key === 'ArrowDown' || e.key === 's') && d.y === 0) {
            e.preventDefault();
            stateRef.current.nextDir = { x: 0, y: 1 };
          } else if ((e.key === 'ArrowLeft' || e.key === 'a') && d.x === 0) {
            e.preventDefault();
            stateRef.current.nextDir = { x: -1, y: 0 };
          } else if ((e.key === 'ArrowRight' || e.key === 'd') && d.x === 0) {
            e.preventDefault();
            stateRef.current.nextDir = { x: 1, y: 0 };
          }
        };

        window.addEventListener('keydown', onKey, { passive: false });

        const timer = setInterval(() => {
          const st = stateRef.current;
          st.dir = st.nextDir;
          const head = {
            x: (st.snake[0].x + st.dir.x + 16) % 16,
            y: (st.snake[0].y + st.dir.y + 12) % 12
          };

          if (st.snake.some((seg) => seg.x === head.x && seg.y === head.y)) {
            playTactileClick(soundEnabled, 260, 40);
            setRunning(false);
            setGameOver(true);
            return;
          }

          const nextSnake = [head, ...st.snake];
          if (head.x === st.food.x && head.y === st.food.y) {
            playTactileClick(soundEnabled, 940, 15);
            setScore((s) => {
              const ns = s + 10;
              if (ns > bestScore) onNewBest(ns);
              return ns;
            });
            let fx = Math.floor(Math.random() * 16);
            let fy = Math.floor(Math.random() * 12);
            st.food = { x: fx, y: fy };
          } else {
            nextSnake.pop();
          }
          st.snake = nextSnake;
          drawBoard();
        }, speedMs);

        return () => {
          window.removeEventListener('keydown', onKey);
          clearInterval(timer);
        };
      }, [running, speedMs, bestScore, onNewBest, soundEnabled, drawBoard]);

      const start = () => {
        stateRef.current = {
          snake: [{ x: 8, y: 6 }, { x: 7, y: 6 }, { x: 6, y: 6 }],
          dir: { x: 1, y: 0 },
          nextDir: { x: 1, y: 0 },
          food: { x: 12, y: 6 }
        };
        setScore(0);
        setGameOver(false);
        setRunning(true);
        drawBoard();
      };

      const steer = (dx, dy) => {
        const d = stateRef.current.dir;
        if (dx !== 0 && d.x === 0) stateRef.current.nextDir = { x: dx, y: 0 };
        if (dy !== 0 && d.y === 0) stateRef.current.nextDir = { x: 0, y: dy };
      };

      return (
        <div
          className="space-y-3"
          onMouseEnter={() => { hoveredRef.current = true; }}
          onMouseLeave={() => { hoveredRef.current = false; }}
        >
          <div className="flex justify-between items-center text-xs font-mono tabular-nums">
            <span style={{ color: 'var(--ink-secondary)' }}>SCORE: {score}</span>
            <div className="flex items-center gap-1">
              {[
                { label: 'CHILL', ms: 185 },
                { label: 'NORM', ms: 140 },
                { label: 'FAST', ms: 95 }
              ].map((sp) => (
                <button
                  key={sp.label}
                  type="button"
                  onClick={() => setSpeedMs(sp.ms)}
                  className={`px-1.5 py-0.5 rounded text-[9px] font-mono ${
                    speedMs === sp.ms ? 'arch-btn-primary' : 'arch-btn-ghost'
                  }`}
                >
                  {sp.label}
                </button>
              ))}
            </div>
            <span style={{ color: 'var(--ink-muted)' }}>MAX: {bestScore}</span>
          </div>

          <div className="relative">
            <canvas ref={canvasRef} width={240} height={180} className="w-full h-40 rounded-md bg-[#09090B] border block" />
            {!running && (
              <div className="absolute inset-0 bg-black/65 flex flex-col items-center justify-center p-3 text-center rounded-md">
                <div className="font-mono text-xs font-semibold mb-1">
                  {gameOver ? `COLLISION // SCORE ${score}` : 'VECTOR SNAKE STANDBY'}
                </div>
                <button type="button" onClick={start} className="arch-btn-primary px-3 py-1 rounded text-xs font-mono mt-1">
                  {gameOver ? 'PLAY AGAIN' : 'START SNAKE'}
                </button>
              </div>
            )}
          </div>

          <div className="flex items-center justify-between gap-2">
            <button type="button" onClick={() => (running ? setRunning(false) : start())} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">
              {running ? 'PAUSE' : 'RESET'}
            </button>
            <div className="flex gap-1">
              <button type="button" onClick={() => steer(0, -1)} className="arch-btn-ghost px-2.5 py-1 rounded text-[10px] font-mono">U</button>
              <button type="button" onClick={() => steer(-1, 0)} className="arch-btn-ghost px-2.5 py-1 rounded text-[10px] font-mono">L</button>
              <button type="button" onClick={() => steer(0, 1)} className="arch-btn-ghost px-2.5 py-1 rounded text-[10px] font-mono">D</button>
              <button type="button" onClick={() => steer(1, 0)} className="arch-btn-ghost px-2.5 py-1 rounded text-[10px] font-mono">R</button>
            </div>
          </div>
        </div>
      );
    };

    // 4C. Reflex & Spatial Pattern Benchmark (Dual-Mode Cognitive Trainer)
    const ReactionLatencyTest = ({ bestMs, onNewBest, soundEnabled, onAwardXP }) => {
      const [mode, setMode] = useState('reflex');
      const [phase, setPhase] = useState('idle');
      const [ms, setMs] = useState(null);
      const [history, setHistory] = useState([]);
      const startRef = useRef(0);
      const timerRef = useRef(null);

      const [seq, setSeq] = useState([]);
      const [userStep, setUserStep] = useState(0);
      const [flashTile, setFlashTile] = useState(null);
      const [patternStatus, setPatternStatus] = useState('IDLE // LVL 0');
      const scheduledTimeoutsRef = useRef(new Set());
      const scheduleTimeout = (callback, delay) => {
        const timerId = window.setTimeout(() => {
          scheduledTimeoutsRef.current.delete(timerId);
          callback();
        }, delay);
        scheduledTimeoutsRef.current.add(timerId);
        return timerId;
      };
      const cancelScheduledTimeout = (timerId) => {
        if (timerId === null || timerId === undefined) return;
        window.clearTimeout(timerId);
        scheduledTimeoutsRef.current.delete(timerId);
      };
      useEffect(() => () => {
        scheduledTimeoutsRef.current.forEach((timerId) => window.clearTimeout(timerId));
        scheduledTimeoutsRef.current.clear();
      }, []);

      useEffect(() => () => cancelScheduledTimeout(timerRef.current), []);

      const triggerReflex = () => {
        if (phase === 'idle' || phase === 'result' || phase === 'early') {
          setPhase('waiting');
          timerRef.current = scheduleTimeout(() => {
            startRef.current = performance.now();
            playTactileClick(soundEnabled, 1020, 15);
            setPhase('ready');
          }, 1000 + Math.random() * 1700);
        } else if (phase === 'waiting') {
          cancelScheduledTimeout(timerRef.current);
          playTactileClick(soundEnabled, 300, 30);
          setPhase('early');
        } else if (phase === 'ready') {
          const delta = Math.max(12, Math.round(performance.now() - startRef.current));
          playTactileClick(soundEnabled, 880, 15);
          setMs(delta);
          setHistory((prev) => [delta, ...prev].slice(0, 5));
          setPhase('result');
          if (bestMs === 0 || delta < bestMs) onNewBest(delta);
        }
      };

      const playSequence = (nextSeq) => {
        setPatternStatus(`WATCH PATTERN (${nextSeq.length})`);
        nextSeq.forEach((tileIdx, i) => {
          scheduleTimeout(() => {
            setFlashTile(tileIdx);
            playTactileClick(soundEnabled, 520 + tileIdx * 60, 18);
            scheduleTimeout(() => setFlashTile(null), 320);
          }, (i + 1) * 520);
        });
        scheduleTimeout(() => {
          setPatternStatus(`REPEAT ${nextSeq.length} NODES`);
        }, (nextSeq.length + 1) * 520);
      };

      const startPatternGame = () => {
        const first = [Math.floor(Math.random() * 9)];
        setSeq(first);
        setUserStep(0);
        playSequence(first);
      };

      const handleTileClick = (idx) => {
        if (seq.length === 0 || patternStatus.startsWith('WATCH')) return;
        playTactileClick(soundEnabled, 520 + idx * 60, 14);
        setFlashTile(idx);
        scheduleTimeout(() => setFlashTile(null), 160);

        if (idx === seq[userStep]) {
          if (userStep + 1 === seq.length) {
            const nextLen = seq.length + 1;
            if (nextLen % 3 === 0 && onAwardXP) onAwardXP(25, `Pattern Matrix Level ${nextLen}`);
            const nextSeq = [...seq, Math.floor(Math.random() * 9)];
            setSeq(nextSeq);
            setUserStep(0);
            scheduleTimeout(() => playSequence(nextSeq), 400);
          } else {
            setUserStep(userStep + 1);
          }
        } else {
          playTactileClick(soundEnabled, 240, 45);
          setPatternStatus(`FAILED AT LVL ${seq.length} // RESET`);
          setSeq([]);
          setUserStep(0);
        }
      };

      const avgMs = history.length > 0 ? Math.round(history.reduce((a, b) => a + b, 0) / history.length) : null;

      return (
        <div className="space-y-3">
          <div className="flex justify-between items-center text-xs font-mono tabular-nums">
            <div className="flex gap-1">
              <button
                type="button"
                onClick={() => setMode('reflex')}
                className={`px-2 py-0.5 rounded text-[10px] ${mode === 'reflex' ? 'arch-btn-primary' : 'arch-btn-ghost'}`}
              >
                REFLEX
              </button>
              <button
                type="button"
                onClick={() => setMode('pattern')}
                className={`px-2 py-0.5 rounded text-[10px] ${mode === 'pattern' ? 'arch-btn-primary' : 'arch-btn-ghost'}`}
              >
                3x3 MATRIX
              </button>
            </div>
            {mode === 'reflex' ? (
              <span style={{ color: 'var(--ink-muted)' }}>
                AVG: {avgMs ? `${avgMs}ms` : '--'} | BEST: {bestMs ? `${bestMs}ms` : '--'}
              </span>
            ) : (
              <span style={{ color: 'var(--ink-muted)' }}>{patternStatus}</span>
            )}
          </div>

          {mode === 'reflex' ? (
            <button
              type="button"
              onClick={triggerReflex}
              className="w-full h-40 rounded-md border font-mono text-xs uppercase tracking-wider flex flex-col items-center justify-center gap-1.5 transition p-3 text-center"
              style={{
                backgroundColor:
                  phase === 'ready'
                    ? 'var(--status-ok)'
                    : phase === 'waiting'
                    ? 'rgba(245, 158, 11, 0.16)'
                    : phase === 'early'
                    ? 'rgba(244, 63, 94, 0.18)'
                    : 'var(--bg-canvas)',
                color: phase === 'ready' ? '#09090B' : 'var(--ink-primary)'
              }}
            >
              <span className="font-semibold">
                {phase === 'idle' && 'CLICK TO ARM OPTICAL SENSOR'}
                {phase === 'waiting' && 'STEADY... WAIT FOR GREEN PULSE'}
                {phase === 'ready' && 'PULSE ACTIVE — CLICK NOW!'}
                {phase === 'early' && 'FALSE START! CLICK TO RE-ARM'}
                {phase === 'result' && `${ms} MS RECORDED — CLICK FOR NEXT SAMPLE`}
              </span>
              {history.length > 0 && phase !== 'ready' && (
                <span className="text-[10px] opacity-75">
                  RECENT: {history.map((h) => `${h}ms`).join(' / ')}
                </span>
              )}
            </button>
          ) : (
            <div className="space-y-2">
              <div className="grid grid-cols-3 gap-1.5 h-32">
                {Array.from({ length: 9 }).map((_, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => handleTileClick(idx)}
                    className="rounded border transition font-mono text-[10px]"
                    style={{
                      backgroundColor: flashTile === idx ? 'var(--status-ok)' : 'var(--bg-canvas)',
                      color: flashTile === idx ? '#09090B' : 'var(--ink-muted)'
                    }}
                  >
                    N{idx + 1}
                  </button>
                ))}
              </div>
              <button
                type="button"
                onClick={startPatternGame}
                className="w-full arch-btn-primary py-1 rounded text-xs font-mono"
              >
                {seq.length > 0 ? `RESTART MATRIX (LVL ${seq.length})` : 'INITIALIZE PATTERN SEQUENCE'}
              </button>
            </div>
          )}
        </div>
      );
    };

    // Execution Hub Sub-View Switcher Bar (Shared across Missions, Projects, Academy)
    const ExecutionHubSubNav = ({ current, onSelect }) => (
      <div className="flex flex-wrap items-center gap-1.5 p-1.5 rounded-lg border" style={{ backgroundColor: 'var(--bg-surface)' }}>
        <span className="font-mono text-[10px] uppercase tracking-wider px-2" style={{ color: 'var(--ink-muted)' }}>
          EXECUTION HUB:
        </span>
        {[
          { id: 'missions', label: 'Missions & ₹ Bounties', icon: 'missions' },
          { id: 'projects', label: 'Project Lab', icon: 'projects' },
          { id: 'academy', label: 'Academy Matrix', icon: 'academy' }
        ].map((tab) => (
          <button
            key={tab.id}
            type="button"
            onClick={() => onSelect(tab.id)}
            className={`px-3 py-1 rounded-md text-xs font-mono inline-flex items-center gap-1.5 transition ${
              current === tab.id ? 'arch-btn-primary' : 'arch-btn-ghost border-transparent'
            }`}
          >
            <Icon name={tab.icon} size={13} />
            <span>{tab.label}</span>
          </button>
        ))}
      </div>
    );

    // 5. MAIN NEXORA VIEWS
      // VIEW 1: COMMAND CENTER (Interactive Bento Workbench + Quick Capture + Focus)
      const DashboardView = () => {
        const { awardXP, completeMission, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [quickType, setQuickType] = useState('mission');
        const [quickTitle, setQuickTitle] = useState('');
        const [quickMeta, setQuickMeta] = useState('');

        const handleQuickCapture = (e) => {
          e.preventDefault();
          if (!quickTitle.trim()) return;
          playTactileClick(data.profile.soundEnabled, 880, 14);
          const today = new Date().toISOString().split('T')[0];

          if (quickType === 'mission') {
            const newTask = {
              id: 't-' + Date.now(),
              title: quickTitle.trim(),
              category: 'Engineering',
              priority: 'High',
              status: 'Pending',
              dueDate: quickMeta.trim() || today,
              bounty: 0,
              completed: false,
              rewardClaimed: false
            };
            setData((prev) => ({ ...prev, tasks: [newTask, ...prev.tasks] }));
            notify('Mission queued in Mission Control');
          } else if (quickType === 'expense' || quickType === 'income') {
            const amt = Math.abs(Number(quickMeta) || 0);
            const newTx = {
              id: 'tx-' + Date.now(),
              title: quickTitle.trim(),
              amount: amt,
              type: quickType === 'income' ? 'credit' : 'debit',
              category: quickType === 'income' ? 'Deposit' : 'Operations',
              date: today
            };
            setData((prev) => ({ ...prev, transactions: [newTx, ...prev.transactions] }));
            notify(`Logged ₹${amt} ${quickType} in Wallet`);
          } else if (quickType === 'subject') {
            const newSub = {
              id: 'sub-' + Date.now(),
              code: (quickMeta.trim() || 'CS-101').toUpperCase(),
              name: quickTitle.trim(),
              attended: 0,
              total: 0,
              targetPct: 75,
              examDate: today,
              topics: []
            };
            setData((prev) => ({ ...prev, subjects: [...prev.subjects, newSub] }));
            notify('Course added to Academy Matrix');
          }
          setQuickTitle('');
          setQuickMeta('');
        };

        const mm = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const ss = String(secondsLeft % 60).padStart(2, '0');

        const todayDate = new Date();
        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const todayKey = ymd(todayDate);
        const hour = todayDate.getHours();
        const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
        const firstName = (data.profile.name || '').split(' ')[0];

        const savedTop3 = data.top3 && data.top3.date === todayKey ? data.top3.items : [];
        const slots = [0, 1, 2].map((i) => savedTop3[i] || { text: '', done: false });
        const updateTop3 = (i, patch) => {
          const items = slots.map((s, k) => (k === i ? { ...s, ...patch } : s));
          setData((prev) => ({ ...prev, top3: { date: todayKey, items } }));
        };

        const shields = data.habitShields || {};
        const streakOf = (logs) => {
          let n = 0;
          const c = new Date();
          if (!logs[ymd(c)] && !shields[ymd(c)]) c.setDate(c.getDate() - 1);
          while (logs[ymd(c)] || shields[ymd(c)]) {
            if (logs[ymd(c)]) n++;
            c.setDate(c.getDate() - 1);
          }
          return n;
        };
        const habitStats = (data.habits || [])
          .map((h) => ({ id: h.id, name: h.name, streak: streakOf(h.logs || {}), total: Object.keys(h.logs || {}).length, doneToday: !!(h.logs || {})[todayKey] }))
          .sort((a, b) => b.streak - a.streak);
        const anyDone = (key) => (data.habits || []).some((h) => h.logs && h.logs[key]) || !!shields[key];
        let overallStreak = 0;
        const cur = new Date();
        if (!anyDone(ymd(cur))) cur.setDate(cur.getDate() - 1);
        while (anyDone(ymd(cur))) { overallStreak++; cur.setDate(cur.getDate() - 1); }

        const cd = data.profile.countdown || { name: '', date: '' };
        const setCountdown = (patch) =>
          setData((prev) => ({ ...prev, profile: { ...prev.profile, countdown: { ...cd, ...patch } } }));
        let daysToGo = null;
        if (cd.date) {
          const target = new Date(cd.date + 'T00:00:00');
          const start = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());
          daysToGo = Math.round((target - start) / 86400000);
        }

        return (
          <div className="space-y-6">
            <div className="flex flex-wrap items-end justify-between gap-4 border-b pb-4">
              <div>
                <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                  01 // TELEMETRY WORKBENCH &bull; {new Date().toISOString().split('T')[0]}
                </div>
                <h1 className="text-2xl sm:text-3xl font-semibold heading-tight mt-1">
                  {greeting}, {firstName} &mdash; <span style={{ color: 'var(--ink-secondary)' }}>{data.profile.semester}</span>
                </h1>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setProfileModal(true)}
                  className="arch-btn-ghost px-3 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-1.5"
                >
                  <Icon name="user" size={14} />
                  <span>CONFIGURE OPERATOR</span>
                </button>
              </div>
            </div>

            <div className="hairline-grid grid grid-cols-2 lg:grid-cols-4 rounded-xl overflow-hidden">
              <div className="hairline-cell p-4 relative">
                <Crosshair className="absolute top-2 right-2" />
                <div className="font-mono text-[10px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  ATTENDANCE AGGREGATE
                </div>
                <div className="text-2xl font-mono font-semibold tabular-nums mt-1.5">
                  {telemetry.totalClasses > 0 ? `${telemetry.avgAttendance}%` : '--%'}
                </div>
                <div className="font-mono text-[11px] mt-1 tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                  {telemetry.totalAttended} / {telemetry.totalClasses} sessions logged
                </div>
              </div>

              <div className="hairline-cell p-4 relative">
                <Crosshair className="absolute top-2 right-2" />
                <div className="font-mono text-[10px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  NET LIQUID CAPITAL
                </div>
                <div className="text-2xl font-mono font-semibold tabular-nums mt-1.5">
                  ₹{telemetry.netBalance.toLocaleString('en-IN')}
                </div>
                <div className="font-mono text-[11px] mt-1 tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                  Saved in Pots: ₹{telemetry.totalSaved.toLocaleString('en-IN')}
                </div>
              </div>

              <div className="hairline-cell p-4 relative">
                <Crosshair className="absolute top-2 right-2" />
                <div className="font-mono text-[10px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  ACTIVE MISSIONS
                </div>
                <div className="text-2xl font-mono font-semibold tabular-nums mt-1.5">
                  {telemetry.pendingMissions}
                </div>
                <div className="font-mono text-[11px] mt-1 tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                  {telemetry.completedMissions} completed total
                </div>
              </div>

              <div className="hairline-cell p-4 relative">
                <Crosshair className="absolute top-2 right-2" />
                <div className="font-mono text-[10px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  DEEP WORK LOGGED
                </div>
                <div className="text-2xl font-mono font-semibold tabular-nums mt-1.5">
                  {(data.focusSessions || []).reduce((a, b) => a + (b.minutes || 0), 0)}m
                </div>
                <div className="font-mono text-[11px] mt-1 tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                  LVL {telemetry.level} &bull; {data.profile.xp || 0} / {telemetry.nextThreshold} XP
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-5 arch-panel rounded-xl p-5 space-y-3">
                <Crosshair className="absolute top-2 right-2" />
                <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  TODAY // TOP 3 PRIORITIES
                </span>
                {slots.map((s, i) => (
                  <div key={i} className="flex items-center gap-2.5">
                    <input type="checkbox" checked={s.done} onChange={() => updateTop3(i, { done: !s.done })} className="w-4 h-4 cursor-pointer" />
                    <input
                      value={s.text}
                      onChange={(e) => updateTop3(i, { text: e.target.value })}
                      placeholder={`Priority ${i + 1}`}
                      className={`flex-1 arch-input rounded-md px-3 py-2 text-xs ${s.done ? 'line-through opacity-50' : ''}`}
                    />
                  </div>

      // VIEW 2: ACADEMY (B.Tech Courses, Attendance Steppers, Syllabus Tracker)
      const AcademyView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [code, setCode] = useState('');

        const [targetPct, setTargetPct] = useState('75');
        const [examDate, setExamDate] = useState('');
        const [topicInputs, setTopicInputs] = useState({});

        const addSubject = (e) => {
          e.preventDefault();
          if (!name.trim()) return;
          const ns = {
            id: 'sub-' + Date.now(),
            code: (code.trim() || 'CS-101').toUpperCase(),
            name: name.trim(),
            attended: 0,
            total: 0,
            targetPct: Math.min(100, Math.max(1, Number(targetPct) || 75)),
            examDate: examDate || new Date().toISOString().split('T')[0],
            topics: []
          };
          setData((prev) => ({ ...prev, subjects: [...prev.subjects, ns] }));
          setCode('');
          setName('');
          notify('Course registered in Academy Matrix');
        };

        const markAttendance = (id, present) => {
          playTactileClick(data.profile.soundEnabled, present ? 880 : 420, 12);
          setData((prev) => ({
            ...prev,
            subjects: prev.subjects.map((s) =>
              s.id === id
                ? {
                    ...s,
                    attended: present ? s.attended + 1 : s.attended,
                    total: s.total + 1
                  }
                : s
            )
          }));
        };

        const addTopic = (subId) => {
          const text = (topicInputs[subId] || '').trim();
          if (!text) return;
          setData((prev) => ({
            ...prev,
            subjects: prev.subjects.map((s) =>
              s.id === subId
                ? { ...s, topics: [...(s.topics || []), { id: 'tp-' + Date.now(), title: text, done: false }] }
                : s
            )
          }));
          setTopicInputs((prev) => ({ ...prev, [subId]: '' }));

        return (
          <div className="space-y-6">
            <ExecutionHubSubNav current="academy" onSelect={setActiveTab} />

              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>

            <form onSubmit={addSubject} className="arch-panel rounded-xl p-4 grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
              <input

                placeholder="Code (e.g. CS301)"
                className="sm:col-span-2 arch-input rounded-md px-3 py-2 text-xs font-mono"
              />
              <input
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Course Title (e.g. Computer Networks)"
                className="sm:col-span-4 arch-input rounded-md px-3 py-2 text-xs"
              />
              <input
                type="number"
                value={targetPct}
                onChange={(e) => setTargetPct(e.target.value)}
                placeholder="Min % (75)"
                className="sm:col-span-2 arch-input rounded-md px-3 py-2 text-xs font-mono tabular-nums"
              />
              <input
                type="date"
                value={examDate}
                onChange={(e) => setExamDate(e.target.value)}
                className="sm:col-span-2 arch-input rounded-md px-3 py-2 text-xs font-mono tabular-nums"
              />
              <button type="submit" className="sm:col-span-2 arch-btn-primary rounded-md py-2 px-3 text-xs font-medium inline-flex items-center justify-center gap-1.5">
                <Icon name="plus" size={14} />
                <span>Add Course</span>
              </button>
            </form>

            {data.subjects.length === 0 ? (
              <EmptyState
                code="ACADEMY.MATRIX // 0_COURSES"
                title="No courses registered yet"
                subtitle="Enter your semester course code, name, and target attendance percentage above to track attendance buffers and syllabus milestones."
              />
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {data.subjects.map((sub) => {
                  const pct = sub.total > 0 ? Math.round((sub.attended / sub.total) * 100) : 100;
                  const isSafe = pct >= (sub.targetPct || 75);
                  return (
                    <div key={sub.id} className="arch-panel rounded-xl p-5 space-y-4">
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <span className="font-mono text-[11px] uppercase" style={{ color: 'var(--ink-muted)' }}>
                            {sub.code} &bull; EXAM: {sub.examDate}
                          </span>
                          <h3 className="text-base font-semibold heading-tight mt-0.5">{sub.name}</h3>
                        </div>
                        <div className="flex items-center gap-2">
                          <span
                            className="font-mono text-xs font-semibold tabular-nums px-2 py-0.5 rounded border"
                            style={{
                              color: isSafe ? 'var(--status-ok)' : 'var(--status-err)',
                              borderColor: isSafe ? 'var(--status-ok)' : 'var(--status-err)'
                            }}
                          >
                            {sub.total > 0 ? `${pct}%` : 'NEW'}
                          </span>
                          <button
                            type="button"
                            onClick={() => setData((prev) => ({ ...prev, subjects: prev.subjects.filter((x) => x.id !== sub.id) }))}
                            className="arch-btn-ghost p-1.5 rounded-md"
                            title="Delete course"
                          >
                            <Icon name="trash" size={13} />
                          </button>
                        </div>
                      </div>

                      <div className="space-y-1.5">
                        <div className="flex justify-between text-xs font-mono tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                          <span>Attended: {sub.attended} / {sub.total}</span>
                          <span>Target: {sub.targetPct}%</span>
                        </div>
                        <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                          <div
                            className="h-full transition-all duration-300"
                            style={{
                              width: `${Math.min(100, pct)}%`,
                              backgroundColor: isSafe ? 'var(--status-ok)' : 'var(--status-err)'

                          type="button"
                          onClick={() => markAttendance(sub.id, false)}
                          className="arch-btn-ghost py-1.5 rounded-md text-xs font-mono"
                        >
                          +1 ABSENT
                        </button>
                      </div>

                      <div className="pt-3 border-t space-y-2">
                        <div className="font-mono text-[10px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                          SYLLABUS MODULES ({(sub.topics || []).filter((t) => t.done).length}/{(sub.topics || []).length})
                        </div>
                        <div className="space-y-1 max-h-28 overflow-y-auto">
                          {(sub.topics || []).map((tp) => (
                            <label key={tp.id} className="flex items-center gap-2 text-xs cursor-pointer">
                              <input
                                type="checkbox"
                                checked={tp.done}
                                onChange={() => {
                                  setData((prev) => ({
                                    ...prev,
                                    subjects: prev.subjects.map((s) =>
                                      s.id === sub.id
                                        ? {
                                            ...s,
                                            topics: s.topics.map((x) => (x.id === tp.id ? { ...x, done: !x.done } : x))
                                          }
                                        : s
                                    )
                                  }));
                                }}
                                className="w-3.5 h-3.5"
                              />
                              <span className={tp.done ? 'line-through opacity-50' : ''}>{tp.title}</span>
                            </label>
                          ))}
                        </div>
                        <div className="flex gap-1.5">
                          <input
                            value={topicInputs[sub.id] || ''}
                            onChange={(e) => setTopicInputs((prev) => ({ ...prev, [sub.id]: e.target.value }))}

                            placeholder="Add syllabus unit..."
                            className="flex-1 arch-input rounded px-2.5 py-1 text-xs"
                          />
                          <button type="button" onClick={() => addTopic(sub.id)} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">
