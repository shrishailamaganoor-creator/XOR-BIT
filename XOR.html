                    </button>
                  </form>

                  {sortedMilestones.length === 0 ? (
                    <div className="py-6 text-center border border-dashed rounded-lg font-mono text-xs" style={{ color: 'var(--ink-muted)' }}>
                      NO MILESTONES IN THIS ROADMAP YET
                    </div>
                  ) : (
                    <div className="border-l-2 pl-4 space-y-3 ml-2">
                      {sortedMilestones.map((ms) => {
                        const targetD = new Date((ms.targetDate || todayKey) + 'T00:00:00');
                        const startD = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                        const daysLeft = Math.round((targetD - startD) / 86400000);

                        return (
                          <div
                            key={ms.id}
                            className="p-3.5 rounded-lg border flex flex-wrap items-center justify-between gap-3"
                            style={{
                              backgroundColor: 'var(--bg-canvas)',
                              borderColor: ms.status === 'Done' ? 'var(--status-ok)' : 'var(--border-hairline)'
                            }}
                          >
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-mono text-[11px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                                  {ms.targetDate}
                                </span>
                                <span
                                  className="font-mono text-[10px] px-1.5 py-0.2 rounded border tabular-nums"
                                  style={{
                                    color:
                                      ms.status === 'Done'
                                        ? 'var(--status-ok)'
                                        : daysLeft < 0
                                        ? 'var(--status-warn)'
                                        : 'var(--ink-secondary)'
                                  }}
                                >
                                  {ms.status === 'Done'
                                    ? 'COMPLETED'
                                    : daysLeft >= 0
                                    ? `${daysLeft}D LEFT`
                                    : `${Math.abs(daysLeft)}D OVERDUE`}
                                </span>
                              </div>
                              <div className={`text-xs font-semibold mt-1 ${ms.status === 'Done' ? 'line-through opacity-60' : ''}`}>
                                {ms.title}
                              </div>
                            </div>

                            <div className="flex items-center gap-1.5">
                              {['Planned', 'In progress', 'Done'].map((st) => (
                                <button
                                  key={st}
                                  type="button"
                                  onClick={() => updateMilestoneStatus(activeRoadmap.id, ms.id, st)}
                                  className={`px-2 py-1 rounded text-[10px] font-mono ${
                                    ms.status === st ? 'arch-btn-primary' : 'arch-btn-ghost'
                                  }`}
                                >
                                  {st}
                                </button>
                              ))}
                              <button
                                type="button"
                                onClick={() => deleteMilestone(activeRoadmap.id, ms.id)}
                                className="arch-btn-ghost p-1 rounded"
                              >
                                <Icon name="trash" size={12} />
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      };

      // VIEW 20: FOCUS DISCIPLINE (Deep-Work Quota, Distraction Audit & Shutdown)
      const FocusDisciplineView = () => {
        const { data, setData, notify, awardXP } = useContext(NexoraContext);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const today = new Date();
        const todayKey = ymd(today);

        const focusSessions = data.focusSessions || [];
        const distractionLog = data.distractionLog || [];
        const shutdownDays = data.shutdownDays || {};
        const focusGoalHrs = Number(data.focusGoalHrs) || 10;

        const [app, setApp] = useState('');
        const [minutes, setMinutes] = useState('');
        const [trigger, setTrigger] = useState('Boredom');
        const [avoiding, setAvoiding] = useState('');

        const [urgeRunning, setUrgeRunning] = useState(false);
        const [urgeSecLeft, setUrgeSecLeft] = useState(600);

        const weekDays = useMemo(() => {
          const diffToMon = (today.getDay() + 6) % 7;
          const mon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMon);
          const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
          return labels.map((label, idx) => {
            const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + idx);
            const key = ymd(d);
            const dayFocusMin = focusSessions
              .filter((s) => s.date === key)
              .reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
            return { key, label, focusMin: dayFocusMin };
          });
        }, [focusSessions, todayKey]);

        const weekStartKey = weekDays[0].key;
        const weekEndKey = weekDays[6].key;

        const weekFocusMin = useMemo(
          () => weekDays.reduce((sum, d) => sum + d.focusMin, 0),
          [weekDays]
        );
        const goalMin = Math.max(60, focusGoalHrs * 60);
        const focusPct = Math.min(100, Math.round((weekFocusMin / goalMin) * 100));
        const maxDayFocus = Math.max(60, ...weekDays.map((d) => d.focusMin));

        const updateGoalHrs = (val) => {
          const num = Math.max(1, Math.min(100, Number(val) || 10));
          setData((prev) => ({ ...prev, focusGoalHrs: num }));
        };

        const addDistraction = (e) => {
          e.preventDefault();
          if (!app.trim()) return;
          playTactileClick(data.profile.soundEnabled, 880, 12);
          const entry = {
            id: 'dist-' + Date.now(),
            app: app.trim(),
            minutes: Math.max(1, Number(minutes) || 5),
            trigger,
            avoiding: avoiding.trim() || 'Unspecified task',
            date: todayKey
          };
          setData((prev) => ({
            ...prev,
            distractionLog: [entry, ...(prev.distractionLog || [])]
          }));
          setApp('');
          setMinutes('');
          setAvoiding('');
          notify('Distraction logged');
        };

        const deleteDistraction = (id) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          setData((prev) => ({
            ...prev,
            distractionLog: (prev.distractionLog || []).filter((item) => item.id !== id)
          }));
        };

        const weekDistractionMin = useMemo(
          () =>
            distractionLog
              .filter((d) => d.date >= weekStartKey && d.date <= weekEndKey)
              .reduce((sum, d) => sum + (Number(d.minutes) || 0), 0),
          [distractionLog, weekStartKey, weekEndKey]
        );

        const topTriggers = useMemo(() => {
          const counts = {};
          distractionLog
            .filter((d) => d.date >= weekStartKey && d.date <= weekEndKey)
            .forEach((d) => {
              counts[d.trigger] = (counts[d.trigger] || 0) + 1;
            });
          return Object.entries(counts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3);
        }, [distractionLog, weekStartKey, weekEndKey]);

        useEffect(() => {
          if (!urgeRunning) return;
          const interval = setInterval(() => {
            setUrgeSecLeft((prev) => {
              if (prev <= 1) {
                setUrgeRunning(false);
                playTactileClick(data.profile.soundEnabled, 880, 12);
                const todayRec = (data.shutdownDays || {})[todayKey] || {};
                if (!todayRec.urgeXpAwarded) {
                  setData((d) => ({
                    ...d,
                    shutdownDays: {
                      ...(d.shutdownDays || {}),
                      [todayKey]: { ...((d.shutdownDays || {})[todayKey] || {}), urgeXpAwarded: true }
                    }
                  }));
                  awardXP(10, 'Completed 10-minute Urge Delay');
                } else {
                  notify('10-minute urge delay complete');
                }
                return 600;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }, [urgeRunning, todayKey, data.profile.soundEnabled, data.shutdownDays, awardXP, notify, setData]);

        const SHUTDOWN_STEPS = [
          { id: 'rev', label: 'Review tasks' },
          { id: 'plan', label: 'Plan tomorrow' },
          { id: 'phone', label: 'Phone out of reach' },
          { id: 'say', label: 'Say "shutdown complete"' }
        ];

        const todayShutdown = shutdownDays[todayKey] || {};
        const isShutdownComplete = (dayObj) =>
          !!(dayObj && dayObj.rev && dayObj.plan && dayObj.phone && dayObj.say);

        const toggleShutdownStep = (stepId) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          const current = shutdownDays[todayKey] || {};
          const nextVal = !current[stepId];
          const updatedDay = { ...current, [stepId]: nextVal };
          const nowAllDone = isShutdownComplete(updatedDay);

          if (nowAllDone && !updatedDay.xpAwarded) {
            updatedDay.xpAwarded = true;
            awardXP(20, 'Completed Daily Shutdown Ritual');
          }

          setData((prev) => ({
            ...prev,
            shutdownDays: {
              ...(prev.shutdownDays || {}),
              [todayKey]: updatedDay
            }
          }));
        };

        const shutdownStreak = useMemo(() => {
          let s = 0;
          const cur = new Date(today.getFullYear(), today.getMonth(), today.getDate());
          if (!isShutdownComplete(shutdownDays[ymd(cur)])) {
            cur.setDate(cur.getDate() - 1);
          }
          while (isShutdownComplete(shutdownDays[ymd(cur)])) {
            s++;
            cur.setDate(cur.getDate() - 1);
          }
          return s;
        }, [shutdownDays, todayKey]);

        const urgeMM = String(Math.floor(urgeSecLeft / 60)).padStart(2, '0');
        const urgeSS = String(urgeSecLeft % 60).padStart(2, '0');

        return (
          <div className="space-y-5 pt-6 border-t">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                FOCUS DISCIPLINE &amp; COGNITIVE CONTAINMENT
              </div>
              <h2 className="text-lg font-semibold heading-tight mt-0.5">
                Deep-Work Quota, Distraction Audit &amp; Shutdown Protocol
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-7 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    01 // WEEKLY DEEP-WORK GOAL (MON – SUN)
                  </span>
                  <div className="flex items-center gap-2 font-mono text-xs tabular-nums">
                    <span style={{ color: 'var(--ink-secondary)' }}>
                      {weekFocusMin}m ({(weekFocusMin / 60).toFixed(1)}h) /
                    </span>
                    <input
                      type="number"
                      min="1"
                      max="100"
                      value={focusGoalHrs}
                      onChange={(e) => updateGoalHrs(e.target.value)}
                      className="w-14 arch-input rounded px-2 py-0.5 text-xs font-mono tabular-nums"
                    />
                    <span style={{ color: 'var(--ink-muted)' }}>HRS ({focusPct}%)</span>
                  </div>
                </div>

                <div className="w-full h-2 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                  <div
                    className="h-full transition-all duration-300"
                    style={{ width: `${focusPct}%`, backgroundColor: 'var(--status-ok)' }}
                  />
                </div>

                <div className="grid grid-cols-7 gap-2 h-28 items-end pt-4 px-1 border-b pb-2">
                  {weekDays.map((d) => {
                    const barPct = Math.round((d.focusMin / maxDayFocus) * 100);
                    const isToday = d.key === todayKey;
                    return (
                      <div key={d.key} className="flex flex-col items-center justify-end h-full gap-1">
                        <span className="font-mono text-[9px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                          {d.focusMin > 0 ? `${d.focusMin}m` : ''}
                        </span>
                        <div
                          className="w-full max-w-[30px] rounded-t transition-all duration-300"
                          style={{
                            height: `${Math.max(8, barPct)}%`,
                            backgroundColor: isToday ? 'var(--status-ok)' : 'var(--accent)',
                            opacity: d.focusMin > 0 ? 0.9 : 0.18
                          }}
                        />
                        <span
                          className="font-mono text-[10px]"
                          style={{ color: isToday ? 'var(--ink-primary)' : 'var(--ink-muted)' }}
                        >
                          {d.label}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="lg:col-span-5 space-y-5">
                <div className="arch-panel rounded-xl p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      02 // IMPULSE &amp; URGE DELAY (10M)
                    </span>
                    {todayShutdown.urgeXpAwarded && (
                      <span className="font-mono text-[10px] px-2 py-0.5 rounded border" style={{ color: 'var(--status-ok)' }}>
                        +10 XP EARNED TODAY
                      </span>
                    )}
                  </div>

                  {!urgeRunning ? (
                    <button
                      type="button"
                      onClick={() => {
                        playTactileClick(data.profile.soundEnabled, 880, 12);
                        setUrgeSecLeft(600);
                        setUrgeRunning(true);
                      }}
                      className="w-full arch-btn-primary py-2.5 px-4 rounded-md text-xs font-mono inline-flex items-center justify-center gap-2"
                    >
                      <Icon name="clock" size={14} />
                      <span>Wait 10 minutes before opening it</span>
                    </button>
                  ) : (
                    <div className="p-3 rounded-lg border flex items-center justify-between" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                      <div>
                        <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--status-warn)' }}>
                          HOLD IMPULSE // COUNTDOWN ACTIVE
                        </div>
                        <div className="font-mono text-2xl font-semibold tabular-nums mt-0.5">
                          {urgeMM}:{urgeSS}
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          playTactileClick(data.profile.soundEnabled, 880, 12);
                          setUrgeRunning(false);
                          setUrgeSecLeft(600);
                        }}
                        className="arch-btn-ghost px-3 py-1.5 rounded-md text-xs font-mono"
                      >
                        Cancel
                      </button>
                    </div>
                  )}
                </div>

                <div className="arch-panel rounded-xl p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      03 // DAILY SHUTDOWN RITUAL ({todayKey})
                    </span>
                    <span className="font-mono text-xs px-2 py-0.5 rounded border tabular-nums" style={{ color: 'var(--status-ok)' }}>
                      STREAK: {shutdownStreak}D
                    </span>
                  </div>

                  <div className="divide-y">
                    {SHUTDOWN_STEPS.map((step) => {
                      const checked = !!todayShutdown[step.id];
                      return (
                        <label key={step.id} className="py-2 flex items-center justify-between gap-2 cursor-pointer">
                          <div className="flex items-center gap-2.5">
                            <input
                              type="checkbox"
                              checked={checked}
                              onChange={() => toggleShutdownStep(step.id)}
                              className="w-4 h-4 cursor-pointer"
                            />
                            <span className={`text-xs font-medium ${checked ? 'line-through opacity-50' : ''}`}>
                              {step.label}
                            </span>
                          </div>
                          {checked && <Icon name="check" size={13} />}
                        </label>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>

            <div className="arch-panel rounded-xl p-5 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  04 // DISTRACTION LOG &amp; TRIGGER TELEMETRY
                </span>
                <div className="flex flex-wrap items-center gap-2 font-mono text-xs tabular-nums">
                  <span className="px-2.5 py-0.5 rounded border" style={{ color: 'var(--status-warn)' }}>
                    THIS WEEK LOST: {weekDistractionMin} MIN
                  </span>
                  {topTriggers.map(([trig, count]) => (
                    <span key={trig} className="px-2 py-0.5 rounded border text-[11px]" style={{ color: 'var(--ink-secondary)' }}>
                      {trig}: {count}
                    </span>
                  ))}
                </div>
              </div>

              <form onSubmit={addDistraction} className="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                <input
                  value={app}
                  onChange={(e) => setApp(e.target.value)}
                  placeholder="App / activity (e.g., YouTube Shorts, Instagram)..."
                  className="sm:col-span-3 arch-input rounded-md px-3 py-2 text-xs"
                />
                <input
                  type="number"
                  min="1"
                  value={minutes}
                  onChange={(e) => setMinutes(e.target.value)}
                  placeholder="Minutes"
                  className="sm:col-span-2 arch-input rounded-md px-3 py-2 text-xs font-mono tabular-nums"
                />
                <select
                  value={trigger}
                  onChange={(e) => setTrigger(e.target.value)}
                  className="sm:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs font-mono"
                >
                  <option value="Boredom">Boredom</option>
                  <option value="Stress">Stress</option>
                  <option value="Avoidance">Avoidance</option>
                  <option value="Habit">Habit</option>
                  <option value="Notification">Notification</option>
                </select>
                <input
                  value={avoiding}
                  onChange={(e) => setAvoiding(e.target.value)}
                  placeholder="What I was avoiding (e.g., OS Lab Report)..."
                  className="sm:col-span-3 arch-input rounded-md px-3 py-2 text-xs"
                />
                <button type="submit" className="sm:col-span-2 arch-btn-primary rounded-md py-2 text-xs font-mono inline-flex items-center justify-center gap-1.5">
                  <Icon name="plus" size={14} />
                  <span>Log Entry</span>
                </button>
              </form>

              {distractionLog.length === 0 ? (
                <EmptyState
                  code="DISTRACTION.LOG // 0_ENTRIES"
                  title="Zero distractions logged"
                  subtitle="Record attention leaks above with their trigger and the task you were avoiding to surface your top distraction patterns."
                />
              ) : (
                <div className="divide-y max-h-60 overflow-y-auto pr-1">
                  {distractionLog.slice(0, 15).map((item) => (
                    <div key={item.id} className="py-2.5 flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="text-xs font-semibold">{item.app}</span>
                          <span className="font-mono text-[10px] px-1.5 py-0.2 rounded border tabular-nums" style={{ color: 'var(--status-warn)' }}>
                            {item.minutes}m
                          </span>
                          <span className="font-mono text-[10px] px-1.5 py-0.2 rounded border" style={{ color: 'var(--ink-secondary)' }}>
                            Trigger: {item.trigger}
                          </span>
                        </div>
                        <div className="font-mono text-[11px] mt-0.5 truncate" style={{ color: 'var(--ink-muted)' }}>
                          Avoiding: {item.avoiding} &bull; {item.date}
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => deleteDistraction(item.id)}
                        className="arch-btn-ghost p-1.5 rounded shrink-0"
                        title="Delete entry"
                      >
                        <Icon name="trash" size={12} />
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      };

      // VIEW 21: LEARNING ENGINE (Feynman Notes + Active Recall)
      const LearningEngineView = () => {
        const { data, setData, notify, awardXP } = useContext(NexoraContext);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const todayKey = ymd(new Date());

        const subjects = data.subjects || [];
        const feynmanNotes = data.feynmanNotes || [];
        const recallQs = data.recallQs || [];

        const [editingId, setEditingId] = useState(null);
        const [topic, setTopic] = useState('');
        const [subjectName, setSubjectName] = useState('');
        const [eli12, setEli12] = useState('');
        const [gaps, setGaps] = useState('');
        const [status, setStatus] = useState('Confusing');

        const [qText, setQText] = useState('');
        const [aText, setAText] = useState('');
        const [quizActive, setQuizActive] = useState(false);
        const [quizId, setQuizId] = useState(null);
        const [showAnswer, setShowAnswer] = useState(false);

        const resetFeynmanForm = () => {
          setEditingId(null);
          setTopic('');
          setSubjectName('');
          setEli12('');
          setGaps('');
          setStatus('Confusing');
        };

        const saveFeynmanNote = (e) => {
          e.preventDefault();
          if (!topic.trim() || !eli12.trim()) return;
          playTactileClick(data.profile.soundEnabled, 880, 12);

          if (editingId) {
            const existing = feynmanNotes.find((n) => n.id === editingId);
            const giveXp = status === 'Mastered' && existing && !existing.masteredXpAwarded;
            setData((prev) => ({
              ...prev,
              feynmanNotes: (prev.feynmanNotes || []).map((n) =>
                n.id === editingId
                  ? {
                      ...n,
                      topic: topic.trim(),
                      subject: subjectName,
                      eli12: eli12.trim(),
                      gaps: gaps.trim(),
                      status,
                      masteredXpAwarded: n.masteredXpAwarded || status === 'Mastered'
                    }
                  : n
              )
            }));
            if (giveXp) {
              awardXP(20, `Mastered Feynman Note: ${topic.trim()}`);
            } else {
              notify('Feynman note updated');
            }
            resetFeynmanForm();
          } else {
            const isMastered = status === 'Mastered';
            const newNote = {
              id: 'fn-' + Date.now(),
              topic: topic.trim(),
              subject: subjectName,
              eli12: eli12.trim(),
              gaps: gaps.trim(),
              status,
              masteredXpAwarded: isMastered,
              date: todayKey
            };
            setData((prev) => ({
              ...prev,
              feynmanNotes: [newNote, ...(prev.feynmanNotes || [])]
            }));
            if (isMastered) {
              awardXP(20, `Mastered Feynman Note: ${newNote.topic}`);
            } else {
              notify('Feynman note saved');
            }
            resetFeynmanForm();
          }
        };

        const startEditNote = (note) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          setEditingId(note.id);
          setTopic(note.topic || '');
          setSubjectName(note.subject || '');
          setEli12(note.eli12 || '');
          setGaps(note.gaps || '');
          setStatus(note.status || 'Confusing');
        };

        const setNoteStatus = (note, nextStatus) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          const giveXp = nextStatus === 'Mastered' && !note.masteredXpAwarded;
          setData((prev) => ({
            ...prev,
            feynmanNotes: (prev.feynmanNotes || []).map((n) =>
              n.id === note.id
                ? {
                    ...n,
                    status: nextStatus,
                    masteredXpAwarded: n.masteredXpAwarded || nextStatus === 'Mastered'
                  }
                : n
            )
          }));
          if (giveXp) {
            awardXP(20, `Mastered Feynman Note: ${note.topic}`);
          }
        };

        const deleteFeynmanNote = (id) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          setData((prev) => ({
            ...prev,
            feynmanNotes: (prev.feynmanNotes || []).filter((n) => n.id !== id)
          }));
          if (editingId === id) resetFeynmanForm();
        };

        const statusCounts = useMemo(() => {
          const counts = { Confusing: 0, 'Getting there': 0, Mastered: 0 };
          feynmanNotes.forEach((n) => {
            if (counts[n.status] !== undefined) counts[n.status]++;
          });
          return counts;
        }, [feynmanNotes]);

        const addRecallQ = (e) => {
          e.preventDefault();
          if (!qText.trim() || !aText.trim()) return;
          playTactileClick(data.profile.soundEnabled, 880, 12);
          const newQ = {
            id: 'rq-' + Date.now(),
            question: qText.trim(),
            answer: aText.trim(),
            correct: 0,
            missed: 0,
            date: todayKey
          };
          setData((prev) => ({
            ...prev,
            recallQs: [newQ, ...(prev.recallQs || [])]
          }));
          setQText('');
          setAText('');
          notify('Question added to Recall Bank');
        };

        const deleteRecallQ = (id) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          setData((prev) => ({
            ...prev,
            recallQs: (prev.recallQs || []).filter((q) => q.id !== id)
          }));
          if (quizId === id) {
            setQuizId(null);
            setShowAnswer(false);
          }
        };

        const pickRandomQuestion = (excludeId = null) => {
          if (recallQs.length === 0) return;
          const pool =
            recallQs.length > 1 && excludeId
              ? recallQs.filter((q) => q.id !== excludeId)
              : recallQs;
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          setQuizId(chosen.id);
          setShowAnswer(false);
          setQuizActive(true);
        };

        const recordQuizResult = (id, gotIt) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          setData((prev) => ({
            ...prev,
            recallQs: (prev.recallQs || []).map((q) =>
              q.id === id
                ? {
                    ...q,
                    correct: gotIt ? (Number(q.correct) || 0) + 1 : Number(q.correct) || 0,
                    missed: !gotIt ? (Number(q.missed) || 0) + 1 : Number(q.missed) || 0
                  }
                : q
            )
          }));
          pickRandomQuestion(id);
        };

        const recallStats = useMemo(() => {
          let totalCorrect = 0;
          let totalMissed = 0;
          recallQs.forEach((q) => {
            totalCorrect += Number(q.correct) || 0;
            totalMissed += Number(q.missed) || 0;
          });
          const totalAttempts = totalCorrect + totalMissed;
          const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
          return { totalCorrect, totalMissed, totalAttempts, accuracy };
        }, [recallQs]);

        const weakestQuestions = useMemo(() => {
          return [...recallQs]
            .filter((q) => (Number(q.missed) || 0) > 0)
            .sort((a, b) => (b.missed - b.correct) - (a.missed - a.correct))
            .slice(0, 5);
        }, [recallQs]);

        const currentQuizItem = recallQs.find((q) => q.id === quizId) || recallQs[0] || null;

        return (
          <div className="space-y-5 pt-6 border-t">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                COGNITIVE COMPRESSION &amp; ACTIVE RETRIEVAL
              </div>
              <h2 className="text-lg font-semibold heading-tight mt-0.5">
                Feynman Synthesis &amp; Active Recall Engine
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    01 // FEYNMAN TECHNIQUE SYNTHESIS
                  </span>
                  <span className="font-mono text-[11px] tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                    {feynmanNotes.length} NOTES
                  </span>
                </div>

                <div className="hairline-grid grid grid-cols-3 rounded-lg overflow-hidden text-center">
                  <div className="hairline-cell p-2.5">
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>CONFUSING</div>
                    <div className="font-mono text-base font-semibold tabular-nums mt-0.5" style={{ color: 'var(--status-err)' }}>
                      {statusCounts['Confusing']}
                    </div>
                  </div>
                  <div className="hairline-cell p-2.5">
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>GETTING THERE</div>
                    <div className="font-mono text-base font-semibold tabular-nums mt-0.5" style={{ color: 'var(--status-warn)' }}>
                      {statusCounts['Getting there']}
                    </div>
                  </div>
                  <div className="hairline-cell p-2.5">
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>MASTERED</div>
                    <div className="font-mono text-base font-semibold tabular-nums mt-0.5" style={{ color: 'var(--status-ok)' }}>
                      {statusCounts['Mastered']}
                    </div>
                  </div>
                </div>

                <form onSubmit={saveFeynmanNote} className="space-y-2.5">
                  <div className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                    <input
                      value={topic}
                      onChange={(e) => setTopic(e.target.value)}
                      placeholder="Concept / Topic..."
                      className="sm:col-span-5 arch-input rounded-md px-3 py-1.5 text-xs"
                    />
                    <select
                      value={subjectName}
                      onChange={(e) => setSubjectName(e.target.value)}
                      className="sm:col-span-4 arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                    >
                      <option value="">-- Optional Course --</option>
                      {subjects.map((s) => (
                        <option key={s.id} value={s.name}>
                          {s.name}
                        </option>
                      ))}
                    </select>
                    <select
                      value={status}
                      onChange={(e) => setStatus(e.target.value)}
                      className="sm:col-span-3 arch-input rounded-md px-2 py-1.5 text-xs font-mono"
                    >
                      <option value="Confusing">Confusing</option>
                      <option value="Getting there">Getting there</option>
                      <option value="Mastered">Mastered</option>
                    </select>
                  </div>

                  <textarea
                    rows={3}
                    value={eli12}
                    onChange={(e) => setEli12(e.target.value)}
                    placeholder="Explain it like I'm 12 (plain language, zero jargon)..."
                    className="w-full arch-input rounded-md p-2.5 text-xs leading-relaxed"
                  />

                  <textarea
                    rows={2}
                    value={gaps}
                    onChange={(e) => setGaps(e.target.value)}
                    placeholder="Gaps I found (where my explanation got stuck)..."
                    className="w-full arch-input rounded-md p-2.5 text-xs leading-relaxed"
                  />

                  <div className="flex gap-2">
                    <button type="submit" className="arch-btn-primary px-3.5 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-1.5">
                      <Icon name={editingId ? 'check' : 'plus'} size={13} />
                      <span>{editingId ? 'Update Note' : 'Save Feynman Note'}</span>
                    </button>
                    {editingId && (
                      <button
                        type="button"
                        onClick={resetFeynmanForm}
                        className="arch-btn-ghost px-3 py-1.5 rounded-md text-xs font-mono"
                      >
                        Cancel
                      </button>
                    )}
                  </div>
                </form>

                {feynmanNotes.length === 0 ? (
                  <EmptyState
                    code="FEYNMAN.LAB // 0_NOTES"
                    title="No Feynman explanations recorded"
                    subtitle="Pick a concept above, explain it as if teaching a 12-year-old, and pinpoint your knowledge gaps."
                  />
                ) : (
                  <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                    {feynmanNotes.map((n) => (
                      <div key={n.id} className="p-3.5 rounded-lg border space-y-2" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                        <div className="flex flex-wrap items-start justify-between gap-2">
                          <div>
                            <div className="text-xs font-semibold">{n.topic}</div>
                            <div className="font-mono text-[10px]" style={{ color: 'var(--ink-muted)' }}>
                              {n.subject ? `${n.subject} • ` : ''}{n.date}
                            </div>
                          </div>
                          <div className="flex items-center gap-1">
                            {['Confusing', 'Getting there', 'Mastered'].map((st) => (
                              <button
                                key={st}
                                type="button"
                                onClick={() => setNoteStatus(n, st)}
                                className={`px-2 py-0.5 rounded text-[10px] font-mono ${
                                  n.status === st ? 'arch-btn-primary' : 'arch-btn-ghost'
                                }`}
                              >
                                {st}
                              </button>
                            ))}
                            <button
                              type="button"
                              onClick={() => startEditNote(n)}
                              className="arch-btn-ghost px-2 py-0.5 rounded text-[10px] font-mono"
                            >
                              Edit
                            </button>
                            <button
                              type="button"
                              onClick={() => deleteFeynmanNote(n.id)}
                              className="arch-btn-ghost p-1 rounded"
                              title="Delete note"
                            >
                              <Icon name="trash" size={12} />
                            </button>
                          </div>
                        </div>

                        <p className="text-xs leading-relaxed" style={{ color: 'var(--ink-primary)' }}>
                          <span className="font-mono text-[10px] uppercase mr-1.5" style={{ color: 'var(--ink-muted)' }}>
                            ELI12:
                          </span>
                          {n.eli12}
                        </p>

                        {n.gaps && (
                          <p className="text-xs leading-relaxed" style={{ color: 'var(--status-warn)' }}>
                            <span className="font-mono text-[10px] uppercase mr-1.5">GAPS:</span>
                            {n.gaps}
                          </p>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    02 // ACTIVE RECALL QUESTION BANK
                  </span>
                  <div className="flex items-center gap-2 font-mono text-xs tabular-nums">
                    <span className="px-2 py-0.5 rounded border" style={{ color: 'var(--status-ok)' }}>
                      ACCURACY: {recallStats.accuracy}% ({recallStats.totalCorrect}/{recallStats.totalAttempts})
                    </span>
                    {recallQs.length > 0 && (
                      <button
                        type="button"
                        onClick={() => {
                          playTactileClick(data.profile.soundEnabled, 880, 12);
                          if (quizActive) {
                            setQuizActive(false);
                          } else {
                            pickRandomQuestion();
                          }
                        }}
                        className={`px-2.5 py-1 rounded text-xs font-mono ${
                          quizActive ? 'arch-btn-primary' : 'arch-btn-ghost'
                        }`}
                      >
                        {quizActive ? 'Exit Quiz' : 'Quiz Me'}
                      </button>
                    )}
                  </div>
                </div>

                {quizActive && currentQuizItem && (
                  <div className="p-4 rounded-xl border space-y-3" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                    <div className="flex items-center justify-between font-mono text-[10px]" style={{ color: 'var(--ink-muted)' }}>
                      <span>ACTIVE RECALL PROMPT</span>
                      <span>
                        +{currentQuizItem.correct || 0} GOT IT / -{currentQuizItem.missed || 0} MISSED
                      </span>
                    </div>

                    <div className="text-sm font-semibold">{currentQuizItem.question}</div>

                    {showAnswer ? (
                      <div className="space-y-3 pt-2 border-t">
                        <div className="text-xs leading-relaxed font-mono" style={{ color: 'var(--ink-secondary)' }}>
                          {currentQuizItem.answer}
                        </div>
                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={() => recordQuizResult(currentQuizItem.id, true)}
                            className="flex-1 arch-btn-primary py-1.5 rounded-md text-xs font-mono"
                          >
                            Got it
                          </button>
                          <button
                            type="button"
                            onClick={() => recordQuizResult(currentQuizItem.id, false)}
                            className="flex-1 arch-btn-ghost py-1.5 rounded-md text-xs font-mono"
                            style={{ color: 'var(--status-err)' }}
                          >
                            Missed it
                          </button>
                        </div>
                      </div>
                    ) : (
                      <button
                        type="button"
                        onClick={() => {
                          playTactileClick(data.profile.soundEnabled, 880, 12);
                          setShowAnswer(true);
                        }}
                        className="w-full arch-btn-ghost py-2 rounded-md text-xs font-mono"
                      >
                        Show answer
                      </button>
                    )}
                  </div>
                )}

                <form onSubmit={addRecallQ} className="space-y-2">
                  <input
                    value={qText}
                    onChange={(e) => setQText(e.target.value)}
                    placeholder="Recall question prompt..."
                    className="w-full arch-input rounded-md px-3 py-1.5 text-xs"
                  />
                  <div className="flex gap-2">
                    <input
                      value={aText}
                      onChange={(e) => setAText(e.target.value)}
                      placeholder="Concise target answer..."
                      className="flex-1 arch-input rounded-md px-3 py-1.5 text-xs"
                    />
                    <button type="submit" className="arch-btn-primary px-3.5 py-1.5 rounded-md text-xs font-mono shrink-0 inline-flex items-center gap-1.5">
                      <Icon name="plus" size={13} />
                      <span>Add Q&amp;A</span>
                    </button>
                  </div>
                </form>

                {weakestQuestions.length > 0 && (
                  <div className="p-3 rounded-lg border space-y-1.5" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--status-warn)' }}>
                      WEAKEST QUESTIONS (HIGHEST MISS RATE)
                    </div>
                    {weakestQuestions.map((wq) => (
                      <div key={wq.id} className="flex items-center justify-between gap-2 text-xs">
                        <span className="truncate">{wq.question}</span>
                        <span className="font-mono text-[10px] tabular-nums shrink-0" style={{ color: 'var(--status-warn)' }}>
                          Missed {wq.missed} / Got {wq.correct}
                        </span>
                      </div>
                    ))}
                  </div>
                )}

                {recallQs.length === 0 ? (
                  <EmptyState
                    code="RECALL.BANK // 0_QUESTIONS"
                    title="No active recall prompts saved"
                    subtitle="Add question-and-answer pairs above and click 'Quiz Me' to test retrieval and surface your weakest topics."
                  />
                ) : (
                  <div className="divide-y max-h-56 overflow-y-auto pr-1">
                    {recallQs.map((q) => (
                      <div key={q.id} className="py-2.5 flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="text-xs font-semibold truncate">{q.question}</div>
                          <div className="font-mono text-[10px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                            Got: {q.correct || 0} &bull; Missed: {q.missed || 0}
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={() => deleteRecallQ(q.id)}
                          className="arch-btn-ghost p-1 rounded shrink-0"
                          title="Delete question"
                        >
                          <Icon name="trash" size={12} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // VIEW 22: LIFE & MONEY (Pay Yourself First + Life Wheel + Life in Weeks)
      const LifeMoneyView = () => {
        const { data, setData, notify, awardXP } = useContext(NexoraContext);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const today = new Date();
        const todayKey = ymd(today);

        const AREAS = [
          'Health',
          'Academics',
          'Skills',
          'Money',
          'Friends',
          'Family',
          'Fun',
          'Peace of mind'
        ];

        const lifeWheel = data.lifeWheel || [];
        const lifeSettings = data.lifeSettings || {};
        const savingsPots = data.savingsPots || [];

        const payFirstPct = lifeSettings.payFirstPct !== undefined ? Number(lifeSettings.payFirstPct) : 10;
        const birthDate = lifeSettings.birthDate || '';
        const targetAge = Math.max(20, Math.min(110, Number(lifeSettings.targetAge) || 80));

        const [incomeInput, setIncomeInput] = useState('');
        const [selectedPotId, setSelectedPotId] = useState(() => savingsPots[0]?.id || '');

        const latestSnapshot = lifeWheel[0] || null;
        const previousSnapshot = lifeWheel[1] || lifeWheel[0] || null;

        const [scores, setScores] = useState(() => {
          const base = {};
          AREAS.forEach((a) => {
            base[a] = latestSnapshot?.scores?.[a] ?? 6;
          });
          return base;
        });

        const updateSettings = (patch) => {
          setData((prev) => ({
            ...prev,
            lifeSettings: { ...(prev.lifeSettings || {}), ...patch }
          }));
        };

        const saveAmount = Math.round((Math.max(0, Number(incomeInput) || 0) * Math.max(0, payFirstPct)) / 100);
        const activePotId = savingsPots.some((p) => p.id === selectedPotId)
          ? selectedPotId
          : savingsPots[0]?.id || '';

        const transferPayFirst = (e) => {
          e.preventDefault();
          if (saveAmount <= 0) {
            notify('Enter an income amount above 0', 'err');
            return;
          }
          if (!activePotId) {
            notify('Create a savings goal in Wallet first', 'err');
            return;
          }
          playTactileClick(data.profile.soundEnabled, 880, 12);
          const targetPot = savingsPots.find((p) => p.id === activePotId);
          setData((prev) => ({
            ...prev,
            savingsPots: (prev.savingsPots || []).map((p) =>
              p.id === activePotId ? { ...p, saved: (Number(p.saved) || 0) + saveAmount } : p
            )
          }));
          setIncomeInput('');
          notify(`Moved ₹${saveAmount.toLocaleString('en-IN')} (${payFirstPct}%) to ${targetPot?.name || 'Savings Pot'}`);
        };

        const minScore = useMemo(
          () => Math.min(...AREAS.map((a) => Number(scores[a]) || 1)),
          [scores]
        );

        const saveWheelSnapshot = () => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          const alreadySavedToday = lifeWheel.some((s) => s.date === todayKey);
          const entry = {
            id: 'lw-' + Date.now(),
            date: todayKey,
            scores: { ...scores }
          };
          setData((prev) => ({
            ...prev,
            lifeWheel: [entry, ...(prev.lifeWheel || [])]
          }));
          if (!alreadySavedToday) {
            awardXP(15, 'Saved Life Wheel Snapshot');
          } else {
            notify('Life Wheel snapshot saved');
          }
        };

        const deleteSnapshot = (id) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          setData((prev) => ({
            ...prev,
            lifeWheel: (prev.lifeWheel || []).filter((s) => s.id !== id)
          }));
        };

        const totalWeeks = targetAge * 52;
        const livedWeeks = useMemo(() => {
          if (!birthDate) return 0;
          const bDate = new Date(birthDate + 'T00:00:00');
          const diffMs = today - bDate;
          if (isNaN(diffMs) || diffMs <= 0) return 0;
          const wks = Math.floor(diffMs / (7 * 86400000));
          return Math.min(totalWeeks, Math.max(0, wks));
        }, [birthDate, totalWeeks, todayKey]);

        const remainingWeeks = Math.max(0, totalWeeks - livedWeeks);

        return (
          <div className="space-y-5 pt-6 border-t">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                CAPITAL ALLOCATION, BALANCE AUDIT &amp; MEMENTO MORI
              </div>
              <h2 className="text-lg font-semibold heading-tight mt-0.5">
                Pay Yourself First, Life Wheel &amp; Life in Weeks
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-5 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    01 // PAY YOURSELF FIRST ALLOCATOR
                  </span>
                  <div className="flex items-center gap-1.5 font-mono text-xs">
                    <span style={{ color: 'var(--ink-muted)' }}>RATE:</span>
                    <input
                      type="number"
                      min="1"
                      max="100"
                      value={payFirstPct}
                      onChange={(e) => updateSettings({ payFirstPct: Math.max(1, Math.min(100, Number(e.target.value) || 10)) })}
                      className="w-14 arch-input rounded px-2 py-0.5 text-xs font-mono tabular-nums"
                    />
                    <span>%</span>
                  </div>
                </div>

                <form onSubmit={transferPayFirst} className="space-y-3">
                  <div>
                    <label className="font-mono text-[10px] uppercase block mb-1" style={{ color: 'var(--ink-muted)' }}>
                      INCOME / ALLOWANCE RECEIVED (₹)
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={incomeInput}
                      onChange={(e) => setIncomeInput(e.target.value)}
                      placeholder="Enter income amount (e.g., 5000)..."
                      className="w-full arch-input rounded-md px-3 py-2 text-xs font-mono tabular-nums"
                    />
                  </div>

                  <div className="p-3 rounded-lg border flex items-center justify-between" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                    <span className="font-mono text-[11px]" style={{ color: 'var(--ink-muted)' }}>
                      MOVE TO SAVINGS ({payFirstPct}%):
                    </span>
                    <span className="font-mono text-base font-semibold tabular-nums" style={{ color: 'var(--status-ok)' }}>
                      ₹{saveAmount.toLocaleString('en-IN')}
                    </span>
                  </div>

                  <div>
                    <label className="font-mono text-[10px] uppercase block mb-1" style={{ color: 'var(--ink-muted)' }}>
                      DESTINATION SAVINGS POT
                    </label>
                    <select
                      value={activePotId}
                      onChange={(e) => setSelectedPotId(e.target.value)}
                      className="w-full arch-input rounded-md px-3 py-2 text-xs font-mono"
                    >
                      {savingsPots.length === 0 ? (
                        <option value="">-- No Savings Pots in Wallet --</option>
                      ) : (
                        savingsPots.map((p) => (
                          <option key={p.id} value={p.id}>
                            {p.name} (Saved: ₹{Number(p.saved || 0).toLocaleString('en-IN')})
                          </option>
                        ))
                      )}
                    </select>
                  </div>

                  <button
                    type="submit"
                    className="w-full arch-btn-primary py-2 rounded-md text-xs font-mono inline-flex items-center justify-center gap-1.5"
                  >
                    <Icon name="bank" size={14} />
                    <span>Add ₹{saveAmount.toLocaleString('en-IN')} to Selected Pot</span>
                  </button>
                </form>
              </div>

              <div className="lg:col-span-7 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span className="font-mono text-[11px] uppercase tracking-wider block" style={{ color: 'var(--ink-muted)' }}>
                      02 // 8-AXIS LIFE WHEEL AUDIT
                    </span>
                    {previousSnapshot && (
                      <span className="font-mono text-[10px]" style={{ color: 'var(--ink-muted)' }}>
                        Comparing against snapshot from {previousSnapshot.date}
                      </span>
                    )}
                  </div>
                  <button
                    type="button"
                    onClick={saveWheelSnapshot}
                    className="arch-btn-primary px-3.5 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-1.5"
                  >
                    <Icon name="check" size={13} />
                    <span>Save snapshot</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {AREAS.map((area) => {
                    const val = Number(scores[area]) || 1;
                    const prevVal = previousSnapshot?.scores?.[area];
                    const isLowest = val === minScore;

                    return (
                      <div
                        key={area}
                        className="p-3 rounded-lg border space-y-1.5"
                        style={{
                          backgroundColor: 'var(--bg-canvas)',
                          borderColor: isLowest ? 'var(--status-warn)' : 'var(--border-hairline)'
                        }}
                      >
                        <div className="flex items-center justify-between text-xs">
                          <div className="flex items-center gap-1.5">
                            <span className="font-semibold">{area}</span>
                            {isLowest && (
                              <span className="font-mono text-[9px] px-1.5 py-0.2 rounded border uppercase" style={{ color: 'var(--status-warn)', borderColor: 'var(--status-warn)' }}>
                                LOWEST
                              </span>
                            )}
                          </div>
                          <div className="font-mono text-[11px] tabular-nums">
                            <span>{val}/10</span>
                            {prevVal !== undefined && (
                              <span className="ml-1.5 text-[10px]" style={{ color: 'var(--ink-muted)' }}>
                                (Prev: {prevVal})
                              </span>
                            )}
                          </div>
                        </div>

                        <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                          <div
                            className="h-full transition-all duration-200"
                            style={{
                              width: `${val * 10}%`,
                              backgroundColor: isLowest ? 'var(--status-warn)' : 'var(--status-ok)'
                            }}
                          />
                        </div>

                        <input
                          type="range"
                          min="1"
                          max="10"
                          step="1"
                          value={val}
                          onChange={(e) =>
                            setScores((prev) => ({ ...prev, [area]: Number(e.target.value) }))
                          }
                          className="w-full cursor-pointer"
                        />
                      </div>
                    );
                  })}
                </div>

                {lifeWheel.length === 0 ? (
                  <EmptyState
                    code="LIFE.WHEEL // 0_SNAPSHOTS"
                    title="No Life Wheel snapshots saved yet"
                    subtitle="Adjust the 8 sliders above and click 'Save snapshot' to record a dated baseline for future comparison."
                  />
                ) : (
                  <div className="pt-2 border-t space-y-2 max-h-40 overflow-y-auto pr-1">
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>
                      SAVED SNAPSHOT HISTORY ({lifeWheel.length})
                    </div>
                    {lifeWheel.map((snap) => {
                      const vals = AREAS.map((a) => Number(snap.scores?.[a]) || 0);
                      const avg = (vals.reduce((s, v) => s + v, 0) / AREAS.length).toFixed(1);
                      return (
                        <div key={snap.id} className="py-1.5 px-2.5 rounded border flex items-center justify-between gap-2 text-xs font-mono" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                          <span>{snap.date} &bull; AVG: {avg}/10</span>
                          <button
                            type="button"
                            onClick={() => deleteSnapshot(snap.id)}
                            className="arch-btn-ghost p-1 rounded"
                            title="Delete snapshot"
                          >
                            <Icon name="trash" size={12} />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>

            <div className="arch-panel rounded-xl p-5 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <span className="font-mono text-[11px] uppercase tracking-wider block" style={{ color: 'var(--ink-muted)' }}>
                    03 // LIFE IN WEEKS (52 WEEKS PER ROW)
                  </span>
                  <div className="font-mono text-xs tabular-nums mt-0.5">
                    <span style={{ color: 'var(--status-ok)' }}>LIVED: {livedWeeks.toLocaleString()} WKS</span>
                    <span className="mx-2" style={{ color: 'var(--ink-muted)' }}>&bull;</span>
                    <span style={{ color: 'var(--ink-secondary)' }}>REMAINING: {remainingWeeks.toLocaleString()} WKS</span>
                    <span className="mx-2" style={{ color: 'var(--ink-muted)' }}>&bull;</span>
                    <span style={{ color: 'var(--ink-muted)' }}>TOTAL: {totalWeeks.toLocaleString()} WKS</span>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2 font-mono text-xs">
                  <label className="flex items-center gap-1.5">
                    <span style={{ color: 'var(--ink-muted)' }}>BIRTH DATE:</span>
                    <input
                      type="date"
                      value={birthDate}
                      onChange={(e) => updateSettings({ birthDate: e.target.value })}
                      className="arch-input rounded px-2.5 py-1 text-xs font-mono"
                    />
                  </label>
                  <label className="flex items-center gap-1.5">
                    <span style={{ color: 'var(--ink-muted)' }}>TARGET AGE:</span>
                    <input
                      type="number"
                      min="20"
                      max="110"
                      value={targetAge}
                      onChange={(e) => updateSettings({ targetAge: Number(e.target.value) || 80 })}
                      className="w-16 arch-input rounded px-2 py-1 text-xs font-mono tabular-nums"
                    />
                  </label>
                </div>
              </div>

              <div
                className="p-3 rounded-lg border overflow-x-auto"
                style={{ backgroundColor: 'var(--bg-canvas)' }}
              >
                <div
                  className="grid gap-[2px] min-w-[520px]"
                  style={{ gridTemplateColumns: 'repeat(52, minmax(0, 1fr))' }}
                >
                  {Array.from({ length: totalWeeks }).map((_, idx) => {
                    const isLived = idx < livedWeeks;
                    return (
                      <div
                        key={idx}
                        className="h-2 rounded-[1px]"
                        style={{
                          backgroundColor: isLived ? 'var(--status-ok)' : 'var(--bg-elevated)',
                          opacity: isLived ? 0.85 : 0.45
                        }}
                      />
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        );
      };

    const NexoraApp = () => {
      const [data, setData] = useState(loadPersistedState);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [cmdOpen, setCmdOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [profileModal, setProfileModal] = useState(false);
      const [confirmResetModal, setConfirmResetModal] = useState(false);
      const [toast, setToast] = useState(null);
      const toastTimerRef = useRef(null);
      const missionRewardPendingRef = useRef(new Set());
      const audioNodesRef = useRef({ ctx: null, gain: null, sources: [] });
      const nsdrCompletionHandledRef = useRef(false);
      const [isAudioPlaying, setIsAudioPlaying] = useState(false);
      const [sleepTimerSec, setSleepTimerSec] = useState(0);
      const [nsdrRunning, setNsdrRunning] = useState(false);
      const [nsdrSecLeft, setNsdrSecLeft] = useState(((data.audioPrefs || EMPTY_STATE.audioPrefs).nsdrDuration || 10) * 60);
      const [breathTick, setBreathTick] = useState(0);
      const stateStorageWarningRef = useRef(false);
      const sidebarStorageWarningRef = useRef(false);
      const [mediaMap, setMediaMap] = useState({});
      const [hiddenSidebarIds, setHiddenSidebarIds] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('NEXORA_SIDEBAR_HIDDEN_V1') || '[]');
          return Array.isArray(saved)
            ? saved.filter((id) => typeof id === 'string' && id !== 'dashboard' && id !== 'settings')
            : [];
        } catch (error) {
          return [];
        }
      });

      const [focusMinutes, setFocusMinutes] = useState(25);
      const [secondsLeft, setSecondsLeft] = useState(25 * 60);
      const [timerRunning, setTimerRunning] = useState(false);
      const [focusLabel, setFocusLabel] = useState('');
      const notify = useCallback((msg, status = 'ok') => {
        setToast({ msg, status, id: Date.now() });
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => {
          setToast(null);
          toastTimerRef.current = null;
        }, 2800);
      }, []);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', data.profile.theme || 'obsidian');
        const saved = savePersistedState(data);
        if (saved) {
          stateStorageWarningRef.current = false;
        } else if (!stateStorageWarningRef.current) {
          stateStorageWarningRef.current = true;
          notify('Browser could not save your changes. Export a backup and free storage space.', 'err');
        }
      }, [data, notify]);

      useEffect(() => {
        try {
          localStorage.setItem('NEXORA_SIDEBAR_HIDDEN_V1', JSON.stringify(hiddenSidebarIds));
          sidebarStorageWarningRef.current = false;
        } catch (error) {
          if (!sidebarStorageWarningRef.current) {
            sidebarStorageWarningRef.current = true;
            notify('Browser could not save sidebar settings.', 'err');
          }
        }
      }, [hiddenSidebarIds, notify]);

      useEffect(() => () => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
      }, []);

      useEffect(() => {
        loadAllMediaFromIDB().then((map) => setMediaMap(map));
      }, []);

      useEffect(() => {
        let frameId = 0;
        let latestEvent = null;
        const paintSpotlight = () => {
          frameId = 0;
          const e = latestEvent;
          if (!e) return;
          const panels = document.querySelectorAll('.arch-panel');
          panels.forEach((panel) => {
            const rect = panel.getBoundingClientRect();
            panel.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            panel.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
          });
        };
        const handleMove = (e) => {
          latestEvent = e;
          if (!frameId) frameId = requestAnimationFrame(paintSpotlight);
        };
        window.addEventListener('mousemove', handleMove, { passive: true });
        return () => {
          window.removeEventListener('mousemove', handleMove);
          if (frameId) cancelAnimationFrame(frameId);
        };
      }, []);


      const awardXP = useCallback((amount, reason) => {
        if (!data.profile.gamificationEnabled) return;
        setData((prev) => {
          if (!prev.profile.gamificationEnabled) return prev;
          return {
            ...prev,
            profile: { ...prev.profile, xp: (prev.profile.xp || 0) + amount }
          };
        });
        notify(`+${amount} XP // ${reason}`);
      }, [data.profile.gamificationEnabled, notify]);
      const globalAudioPrefs = data.audioPrefs || EMPTY_STATE.audioPrefs;
      const stopAudio = useCallback(() => {
        const nodes = audioNodesRef.current;
        (nodes.sources || []).forEach((source) => {
          try { source.stop(); } catch (error) {}
        });
        if (nodes.ctx) {
          try { nodes.ctx.close(); } catch (error) {}
        }
        audioNodesRef.current = { ctx: null, gain: null, sources: [] };
        setIsAudioPlaying(false);
        setNsdrRunning(false);
        setSleepTimerSec(0);
      }, []);

      const startAudio = useCallback((trackName = globalAudioPrefs.track) => {
        stopAudio();
        if (trackName === 'nsdr') {
          nsdrCompletionHandledRef.current = false;
          setNsdrSecLeft((Number(globalAudioPrefs.nsdrDuration) || 10) * 60);
          setNsdrRunning(true);
          setIsAudioPlaying(true);
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) throw new Error('Web Audio is unavailable');
          const ctx = new AudioCtx();
          const masterGain = ctx.createGain();
          const volume = Number(globalAudioPrefs.volume);
          masterGain.gain.value = Number.isFinite(volume) ? volume : 0.4;
          masterGain.connect(ctx.destination);
          audioNodesRef.current = { ctx, gain: masterGain, sources: [] };

          if (trackName === 'binaural') {
            const oscL = ctx.createOscillator();
            const oscR = ctx.createOscillator();
            const panL = ctx.createStereoPanner();
            const panR = ctx.createStereoPanner();
            oscL.frequency.value = 200;
            oscR.frequency.value = 240;
            panL.pan.value = -1;
            panR.pan.value = 1;
            oscL.connect(panL).connect(masterGain);
            oscR.connect(panR).connect(masterGain);
            oscL.start();
            oscR.start();
            audioNodesRef.current = { ctx, gain: masterGain, sources: [oscL, oscR] };
          } else {
            const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < output.length; i++) output[i] = Math.random() * 2 - 1;
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            const filter = ctx.createBiquadFilter();
            filter.type = trackName === 'white' ? 'allpass' : 'lowpass';
            filter.frequency.value = trackName === 'brown' ? 260 : 950;
            source.connect(filter).connect(masterGain);
            source.start();
            audioNodesRef.current = { ctx, gain: masterGain, sources: [source] };
          }
          if (ctx.state === 'suspended') ctx.resume();
          setNsdrRunning(false);
          setIsAudioPlaying(true);
          setSleepTimerSec((Number(globalAudioPrefs.timerMin) || 15) * 60);
        } catch (error) {
          stopAudio();
          notify('Audio could not start. Check browser audio permissions.', 'err');
        }
      }, [globalAudioPrefs.track, globalAudioPrefs.volume, globalAudioPrefs.timerMin, globalAudioPrefs.nsdrDuration, stopAudio, notify]);

      const toggleAudio = useCallback(() => {
        if (isAudioPlaying) {
          stopAudio();
        } else {
          startAudio(globalAudioPrefs.track);
        }
      }, [globalAudioPrefs.track, isAudioPlaying, startAudio, stopAudio]);

      const toggleNsdr = useCallback(() => {
        if (nsdrRunning) {
          setNsdrRunning(false);
          setIsAudioPlaying(false);
        } else {
          nsdrCompletionHandledRef.current = false;
          setNsdrRunning(true);
          setIsAudioPlaying(true);
        }
      }, [nsdrRunning]);

      useEffect(() => () => {
        const nodes = audioNodesRef.current;
        (nodes.sources || []).forEach((source) => {
          try { source.stop(); } catch (error) {}
        });
        if (nodes.ctx) {
          try { nodes.ctx.close(); } catch (error) {}
        }
        audioNodesRef.current = { ctx: null, gain: null, sources: [] };
      }, []);
      useEffect(() => {
        if (audioNodesRef.current.gain) {
          const volume = Number(globalAudioPrefs.volume);
          audioNodesRef.current.gain.gain.value = Number.isFinite(volume) ? volume : 0.4;
        }
      }, [globalAudioPrefs.volume]);

      useEffect(() => {
        if (!isAudioPlaying || nsdrRunning || sleepTimerSec <= 0) return;
        const timer = setInterval(() => setSleepTimerSec((remaining) => Math.max(0, remaining - 1)), 1000);
        return () => clearInterval(timer);
      }, [isAudioPlaying, nsdrRunning, sleepTimerSec]);

      useEffect(() => {
        if (isAudioPlaying && !nsdrRunning && sleepTimerSec === 0) stopAudio();
      }, [isAudioPlaying, nsdrRunning, sleepTimerSec, stopAudio]);

      useEffect(() => {
        if (!nsdrRunning) return;
        const timer = setInterval(() => {
          setBreathTick((tick) => (tick + 1) % 14);
          setNsdrSecLeft((remaining) => Math.max(0, remaining - 1));
        }, 1000);
        return () => clearInterval(timer);
      }, [nsdrRunning]);

      useEffect(() => {
        if (!nsdrRunning || nsdrSecLeft > 0 || nsdrCompletionHandledRef.current) return;
        nsdrCompletionHandledRef.current = true;
        stopAudio();
        setNsdrSecLeft((Number(globalAudioPrefs.nsdrDuration) || 10) * 60);
        awardXP(20, 'Completed NSDR Restoration Protocol');
      }, [nsdrRunning, nsdrSecLeft, globalAudioPrefs.nsdrDuration, stopAudio, awardXP]);
      const completeMission = useCallback((taskId, nextCompleted) => {
        const currentTask = data.tasks.find((task) => task.id === taskId);
        if (!currentTask) return;
        const shouldAttemptReward = nextCompleted && !currentTask.rewardClaimed && !missionRewardPendingRef.current.has(taskId);
        if (shouldAttemptReward) missionRewardPendingRef.current.add(taskId);
        const todayStr = new Date().toISOString().split('T')[0];

        setData((prev) => {
          const task = prev.tasks.find((item) => item.id === taskId);
          if (!task) return prev;
          const firstCompletion = nextCompleted && !task.rewardClaimed;
          const bountyAmt = Number(task.bounty) || 0;
          const nextProfile = firstCompletion && prev.profile.gamificationEnabled
            ? { ...prev.profile, xp: (Number(prev.profile.xp) || 0) + 30 }
            : prev.profile;
          return {
            ...prev,
            profile: nextProfile,
            tasks: prev.tasks.map((item) => item.id === taskId
              ? {
                  ...item,
                  completed: nextCompleted,
                  status: nextCompleted ? 'Completed' : 'Pending',
                  rewardClaimed: item.rewardClaimed || firstCompletion
                }
              : item),
            transactions: firstCompletion && bountyAmt > 0
              ? [
                  {
                    id: `tx-bounty-${taskId}`,
                    title: `Mission Bounty: ${task.title}`,
                    amount: bountyAmt,
                    type: 'credit',
                    category: 'Mission Bounty',
                    date: todayStr
                  },
                  ...(prev.transactions || [])
                ]
              : prev.transactions
          };
        });

        if (shouldAttemptReward) {
          if (data.profile.gamificationEnabled) {
            const bountyAmt = Number(currentTask.bounty) || 0;
            notify(`+30 XP // Completed mission: ${currentTask.title}${bountyAmt > 0 ? ` (+₹${bountyAmt} credited to Wallet)` : ''}`);
          } else {
            notify('Mission completed. XP rewards are disabled.');
          }
        }
      }, [data.tasks, data.profile.gamificationEnabled, notify]);

      useEffect(() => {
        if (!timerRunning) return;
