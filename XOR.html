      // VIEW 10: UNIFIED CALENDAR (Full Color-Coded Month Grid + Custom Day Types + Events)
      const CalendarView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [evTitle, setEvTitle] = useState('');
        const [evDate, setEvDate] = useState(new Date().toISOString().split('T')[0]);
        const [evCat, setEvCat] = useState('Exams');

        const today = new Date();
        const [calCursor, setCalCursor] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
        const [activeBrush, setActiveBrush] = useState('productive');
        const [customLabel, setCustomLabel] = useState('');
        const [customColor, setCustomColor] = useState('#3B82F6');

        const allDayTypes = useMemo(
          () => [...DEFAULT_DAY_TYPES, ...(data.customDayTypes || [])],
          [data.customDayTypes]
        );

        const paintDate = (dateKey) => {
          playTactileClick(data.profile.soundEnabled, 780, 10);
          setData((prev) => {
            const nextTags = { ...(prev.dayTags || {}) };
            if (nextTags[dateKey] === activeBrush) {
              delete nextTags[dateKey];
            } else {
              nextTags[dateKey] = activeBrush;
            }
            return { ...prev, dayTags: nextTags };
          });
        };

        const addCustomDayType = (e) => {
          e.preventDefault();
          if (!customLabel.trim()) return;
          const newType = {
            id: 'custom-' + Date.now(),
            label: customLabel.trim(),
            color: customColor
          };
          setData((prev) => ({
            ...prev,
            customDayTypes: [...(prev.customDayTypes || []), newType]
          }));
          setActiveBrush(newType.id);
          setCustomLabel('');
          notify(`Created Day Type: ${newType.label}`);
        };

        const monthCells = useMemo(() => {
          const y = calCursor.getFullYear();
          const m = calCursor.getMonth();
          const firstDow = new Date(y, m, 1).getDay();
          const totalDays = new Date(y, m + 1, 0).getDate();
          const arr = [];
          for (let i = 0; i < firstDow; i++) arr.push(null);
          for (let d = 1; d <= totalDays; d++) {
            const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            arr.push({ day: d, key });
          }
          return arr;
        }, [calCursor]);

        const unifiedEvents = useMemo(() => {
          const list = [...data.calendarEvents];
          data.subjects.forEach((s) => {
            list.push({ id: `exam-${s.id}`, title: `${s.code} Exam: ${s.name}`, date: s.examDate, category: 'Course Exam' });
          });
          data.tasks.forEach((t) => {
            if (!t.completed) list.push({ id: `task-${t.id}`, title: `Mission: ${t.title}`, date: t.dueDate, category: t.category });
          });
          return list.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        }, [data.calendarEvents, data.subjects, data.tasks]);

        const addEvent = (e) => {
          e.preventDefault();
          if (!evTitle.trim()) return;
          setData((prev) => ({
            ...prev,
            calendarEvents: [...prev.calendarEvents, { id: 'ev-' + Date.now(), title: evTitle.trim(), date: evDate, category: evCat }]
          }));
          setEvTitle('');
          notify('Scheduled on Unified Calendar');
        };

        const calMonthName = calCursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        return (
          <div className="space-y-6">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                10 // COLOR-CODED LIFE CALENDAR &amp; MASTER CHRONOLOGY
              </div>
              <h1 className="text-2xl font-semibold heading-tight mt-1">Unified Calendar &amp; Day Type Matrix</h1>
            </div>

            <div className="arch-panel p-5 rounded-xl space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  01 // SELECT DAY TYPE BRUSH &amp; CLICK ANY DATE BELOW TO TAG
                </span>
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={() => setCalCursor(new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1))}
                    className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono"
                  >
                    &lt; PREV
                  </button>
                  <span className="font-mono text-xs font-semibold px-2 uppercase">{calMonthName}</span>
                  <button
                    type="button"
                    onClick={() => setCalCursor(new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1))}
                    className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono"
                  >
                    NEXT &gt;
                  </button>
                </div>
              </div>

              <div className="flex flex-wrap gap-2">
                {allDayTypes.map((dt) => {
                  const selected = activeBrush === dt.id;
                  return (
                    <button
                      key={dt.id}
                      type="button"
                      onClick={() => setActiveBrush(dt.id)}
                      className={`px-3 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-2 border transition ${
                        selected ? 'arch-btn-primary' : 'arch-btn-ghost'
                      }`}
                    >
                      <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: dt.color }} />
                      <span>{dt.label}</span>
                    </button>
                  );
                })}
              </div>

              <form onSubmit={addCustomDayType} className="flex flex-wrap items-center gap-2 pt-2 border-t">
                <span className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>
                  + ADD CUSTOM DAY TYPE:
                </span>
                <input
                  value={customLabel}
                  onChange={(e) => setCustomLabel(e.target.value)}
                  placeholder="Custom Tag Name (e.g. Fest / Competition)"
                  className="arch-input rounded-md px-2.5 py-1 text-xs"
                />
                <input
                  type="color"
                  value={customColor}
                  onChange={(e) => setCustomColor(e.target.value)}
                  className="w-8 h-7 rounded cursor-pointer bg-transparent border"
                />
                <button type="submit" className="arch-btn-ghost px-3 py-1 rounded-md text-xs font-mono">
                  + Save Tag
                </button>
              </form>

              <div className="grid grid-cols-7 gap-1.5 text-center font-mono text-[10px] uppercase pt-2" style={{ color: 'var(--ink-muted)' }}>
                {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map((d) => (
                  <div key={d}>{d}</div>
                ))}
              </div>

              <div className="grid grid-cols-7 gap-1.5">
                {monthCells.map((cell, idx) => {
                  if (!cell) {
                    return <div key={`empty-${idx}`} className="h-14 rounded border opacity-20" style={{ backgroundColor: 'var(--bg-canvas)' }} />;
                  }
                  const tagId = data.dayTags?.[cell.key];
                  const tagObj = allDayTypes.find((t) => t.id === tagId);
                  const dayEvents = unifiedEvents.filter((e) => e.date === cell.key);

                  return (
                    <button
                      key={cell.key}
                      type="button"
                      onClick={() => paintDate(cell.key)}
                      className="h-14 p-1.5 rounded border text-left font-mono transition flex flex-col justify-between overflow-hidden"
                      style={{
                        backgroundColor: tagObj ? `${tagObj.color}22` : 'var(--bg-canvas)',
                        borderColor: tagObj ? tagObj.color : 'var(--border-hairline)'
                      }}
                    >
                      <div className="flex items-center justify-between w-full">
                        <span className="text-xs font-semibold tabular-nums">{String(cell.day).padStart(2, '0')}</span>
                        {tagObj && (
                          <span className="w-2 h-2 rounded-full" style={{ backgroundColor: tagObj.color }} />
                        )}
                      </div>
                      <div className="truncate text-[9px] w-full" style={{ color: tagObj ? tagObj.color : 'var(--ink-muted)' }}>
                        {tagObj ? tagObj.label.split('/')[0] : dayEvents[0]?.title || ''}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            <form onSubmit={addEvent} className="arch-panel p-4 rounded-xl grid grid-cols-1 md:grid-cols-12 gap-2.5">
              <input value={evTitle} onChange={(e) => setEvTitle(e.target.value)} placeholder="Event Title" className="md:col-span-5 arch-input rounded-md px-3 py-2 text-xs" />
              <input type="date" value={evDate} onChange={(e) => setEvDate(e.target.value)} className="md:col-span-3 arch-input rounded-md px-3 py-2 text-xs font-mono tabular-nums" />
              <select value={evCat} onChange={(e) => setEvCat(e.target.value)} className="md:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs">
                <option>Exams</option>
                <option>Milestone</option>
                <option>Campus Event</option>
                <option>Personal</option>
              </select>
              <button type="submit" className="md:col-span-2 arch-btn-primary rounded-md py-2 text-xs font-medium">
                + Schedule
              </button>
            </form>

            {unifiedEvents.length === 0 ? (
              <EmptyState
                code="CALENDAR.AGENDA // 0_EVENTS"
                title="No chronological events scheduled"
                subtitle="Events added here—along with course exam dates and active mission deadlines—automatically merge into this timeline."
              />
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {unifiedEvents.map((ev) => (
                  <div key={ev.id} className="arch-panel p-4 rounded-xl flex items-center justify-between gap-3">
                    <div>
                      <span className="text-[10px] font-mono uppercase" style={{ color: 'var(--ink-muted)' }}>{ev.category}</span>
                      <div className="text-xs font-semibold mt-0.5">{ev.title}</div>
                    </div>
                    <div className="font-mono text-xs tabular-nums px-2.5 py-1 rounded border" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                      {ev.date}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      // VIEW 11: HABIT VERIFICATION CALENDAR, REST SHIELD & CONSISTENCY COMPOUND ENGINE
      const HabitsView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const today = new Date();
        const formatYMD = (dateObj) => {
          const y = dateObj.getFullYear();
          const m = String(dateObj.getMonth() + 1).padStart(2, '0');
          const d = String(dateObj.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        };
        const todayKey = formatYMD(today);

        const habits = data.habits || [];
        const shields = data.habitShields || {};
        const [selectedHabitId, setSelectedHabitId] = useState(() => habits[0]?.id || '');
        const [newHabitName, setNewHabitName] = useState('');
        const [viewMode, setViewMode] = useState('month');
        const [cursorDate, setCursorDate] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
        const [selectedDateKey, setSelectedDateKey] = useState(todayKey);

        const [skillTitle, setSkillTitle] = useState('Core Engineering & Systems');
        const [dailyAmount, setDailyAmount] = useState(90);
        const [dailyUnit, setDailyUnit] = useState('min');
        const [horizonValue, setHorizonValue] = useState(1);
        const [horizonUnit, setHorizonUnit] = useState('years');

        const activeHabit = useMemo(
          () => habits.find((h) => h.id === selectedHabitId) || habits[0] || null,
          [habits, selectedHabitId]
        );

        const computeStreakFromLogs = (logsObj, shieldsObj = shields) => {
          const logs = logsObj || {};
          const sh = shieldsObj || {};
          let s = 0;
          const check = new Date(today);
          if (!logs[formatYMD(check)] && !sh[formatYMD(check)]) {
            check.setDate(check.getDate() - 1);
          }
          while (logs[formatYMD(check)] || sh[formatYMD(check)]) {
            if (logs[formatYMD(check)]) s++;
            check.setDate(check.getDate() - 1);
          }
          return s;
        };

        const toggleHabitDate = (habitId, dateKey) => {
          if (!habitId) return;
          playTactileClick(data.profile.soundEnabled, 860, 12);
          let earnedXP = false;
          setData((prev) => ({
            ...prev,
            habits: (prev.habits || []).map((h) => {
              if (h.id !== habitId) return h;
              const nextLogs = { ...(h.logs || {}) };
              if (nextLogs[dateKey]) {
                delete nextLogs[dateKey];
              } else {
                nextLogs[dateKey] = true;
                earnedXP = true;
              }
              const nextStreak = computeStreakFromLogs(nextLogs, prev.habitShields);
              return { ...h, logs: nextLogs, streak: nextStreak };
            })
          }));
          if (earnedXP) {
            awardXP(25, `Verified habit on ${dateKey}`);
          }
        };

        const toggleShieldDate = (dateKey) => {
          playTactileClick(data.profile.soundEnabled, 700, 14);
          setData((prev) => {
            const nextShields = { ...(prev.habitShields || {}) };
            if (nextShields[dateKey]) {
              delete nextShields[dateKey];
              notify(`Removed Rest Day Shield on ${dateKey}`);
            } else {
              nextShields[dateKey] = true;
              notify(`Activated Rest Day Shield on ${dateKey} (Streak Protected)`);
            }
            return { ...prev, habitShields: nextShields };
          });
        };

        const addHabit = (e) => {
          e.preventDefault();
          const clean = newHabitName.trim();
          if (!clean) return;
          const item = {
            id: 'h-' + Date.now(),
            name: clean,
            targetMin: 60,
            streak: 0,
            logs: {}
          };
          setData((prev) => ({ ...prev, habits: [...(prev.habits || []), item] }));
          setSelectedHabitId(item.id);
          setNewHabitName('');
          notify('Protocol registered in Habit Matrix');
        };

        const deleteHabit = (id) => {
          const filtered = habits.filter((h) => h.id !== id);
          setData((prev) => ({ ...prev, habits: filtered }));
          if (selectedHabitId === id) {
            setSelectedHabitId(filtered[0]?.id || '');
          }
          notify('Removed habit protocol');
        };

        const habitMetrics = useMemo(() => {
          if (!activeHabit) return { streak: 0, totalDays: 0, monthRate: 0, loggedInMonth: 0, daysInMonth: 30 };
          const logs = activeHabit.logs || {};
          const totalDays = Object.keys(logs).length;
          const streak = computeStreakFromLogs(logs, shields);

          const year = cursorDate.getFullYear();
          const month = cursorDate.getMonth();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          let loggedInMonth = 0;
          for (let d = 1; d <= daysInMonth; d++) {
            const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            if (logs[key]) loggedInMonth++;
          }
          const monthRate = Math.round((loggedInMonth / daysInMonth) * 100);
          return { streak, totalDays, monthRate, loggedInMonth, daysInMonth };
        }, [activeHabit, cursorDate, todayKey, shields]);

        const calendarCells = useMemo(() => {
          const year = cursorDate.getFullYear();
          const month = cursorDate.getMonth();
          const firstDayIndex = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const cells = [];
          for (let i = 0; i < firstDayIndex; i++) cells.push(null);
          for (let d = 1; d <= daysInMonth; d++) {
            const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            cells.push({ day: d, key });
          }
          return cells;
        }, [cursorDate]);

        const rollingYearDays = useMemo(() => {
          const arr = [];
          for (let i = 364; i >= 0; i--) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            arr.push({
              key: formatYMD(d),
              label: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            });
          }
          return arr;
        }, [todayKey]);

        const projection = useMemo(() => {
          const rawVal = Math.max(0, Number(dailyAmount) || 0);
          const rawHorizon = Math.max(0, Number(horizonValue) || 0);
          const dailyMinutes = dailyUnit === 'hr' ? rawVal * 60 : rawVal;
          const dailyHours = dailyMinutes / 60;

          let totalDays = rawHorizon;
          if (horizonUnit === 'months') totalDays = Math.round(rawHorizon * 30.4375);
          if (horizonUnit === 'years') totalDays = Math.round(rawHorizon * 365.25);

          const totalMinutes = Math.round(dailyMinutes * totalDays);
          const totalHours = +(totalMinutes / 60).toFixed(1);
          const full24HrDays = +(totalHours / 24).toFixed(1);
          const workWeeks40Hr = +(totalHours / 40).toFixed(1);
          const masteryPct = Math.min(100, +((totalHours / 10000) * 100).toFixed(2));

          const milestones = [
            { label: '30 Days', days: 30 },
            { label: '90 Days', days: 90 },
            { label: '6 Months', days: 182 },
            { label: '1 Year', days: 365 },
            { label: '3 Years', days: 1095 },
            { label: '5 Years', days: 1825 },
            { label: '10 Years', days: 3650 }
          ].map((m) => {
            const mins = Math.round(dailyMinutes * m.days);
            const hrs = +(mins / 60).toFixed(1);
            return { ...m, mins, hrs };
          });

          return {
            dailyMinutes,
            dailyHours: +dailyHours.toFixed(2),
            totalDays,
            totalMinutes,
            totalHours,
            full24HrDays,
            workWeeks40Hr,
            masteryPct,
            milestones
          };
        }, [dailyAmount, dailyUnit, horizonValue, horizonUnit]);

        const monthLabel = cursorDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        return (
          <div className="space-y-6">
            <div className="pb-4 border-b flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div>
                <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                  11 // TEMPORAL TELEMETRY & COMPOUND ENGINE
                </div>
                <h1 className="text-2xl font-semibold heading-tight mt-1">
                  Habit Verification Calendar & Consistency Projector
                </h1>
              </div>
              <div className="flex items-center gap-5 font-mono text-xs tabular-nums">
                <div>
                  <span className="block text-[10px]" style={{ color: 'var(--ink-muted)' }}>SYSTEM DATE</span>
                  <span>{todayKey}</span>
                </div>
                <div className="h-6 w-[1px]" style={{ backgroundColor: 'var(--border-hairline)' }} />
                <div>
                  <span className="block text-[10px]" style={{ color: 'var(--ink-muted)' }}>ACTIVE STREAK</span>
                  <span className="font-semibold" style={{ color: 'var(--status-ok)' }}>{habitMetrics.streak} DAYS</span>
                </div>
                <div className="h-6 w-[1px]" style={{ backgroundColor: 'var(--border-hairline)' }} />
                <div>
                  <span className="block text-[10px]" style={{ color: 'var(--ink-muted)' }}>TOTAL LOGS</span>
                  <span>{habitMetrics.totalDays} DAYS</span>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 flex flex-col gap-5">
                <div className="arch-panel rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-mono uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                      01 // SELECT OR INITIALIZE HABIT PROTOCOL
                    </span>
                    <span className="text-[11px] font-mono tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                      {habits.length} ACTIVE PROTOCOLS
                    </span>
                  </div>

                  {habits.length > 0 && (
                    <div className="flex flex-wrap gap-2">
                      {habits.map((h) => {
                        const isSelected = h.id === activeHabit?.id;
                        const doneToday = !!h.logs?.[todayKey];
                        return (
                          <div
                            key={h.id}
                            onClick={() => setSelectedHabitId(h.id)}
                            className={`flex items-center gap-2.5 px-3 py-1.5 rounded-md border text-xs font-mono cursor-pointer transition ${
                              isSelected ? 'arch-btn-primary' : 'arch-btn-ghost'
                            }`}
                          >
                            <span
                              className="w-2 h-2 rounded-full"
                              style={{
                                backgroundColor: doneToday ? 'var(--status-ok)' : 'var(--ink-muted)'
                              }}
                            />
                            <span>{h.name}</span>
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                deleteHabit(h.id);
                              }}
                              title="Remove Habit"
                              className="ml-1 text-[10px] opacity-60 hover:opacity-100"
                            >
                              [X]
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  <form onSubmit={addHabit} className="flex gap-2">
                    <input
                      type="text"
                      value={newHabitName}
                      onChange={(e) => setNewHabitName(e.target.value)}
                      placeholder="New habit protocol identifier (e.g., DSA Problem Solving, FastAPI)..."
                      className="flex-1 arch-input rounded-md px-3 py-2 text-xs font-mono"
                    />
                    <button
                      type="submit"
                      className="arch-btn-primary px-4 py-2 rounded-md text-xs font-mono uppercase tracking-wider"
                    >
                      + Add Protocol
                    </button>
                  </form>
                </div>

                {habits.length === 0 ? (
                  <EmptyState
                    code="HABIT.MATRIX // 0_PROTOCOLS"
                    title="No daily habits defined yet"
                    subtitle="Register your first daily protocol above to unlock the interactive Month Grid, 365-Day Continuity Heatmap, and date-level verification logs."
                  />
                ) : (
                  <div className="arch-panel rounded-xl p-5 space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b">
                      <div>
                        <span className="text-[11px] font-mono uppercase tracking-widest block" style={{ color: 'var(--ink-muted)' }}>
                          02 // LIVE VERIFICATION MATRIX
                        </span>
                        <h2 className="text-sm font-mono font-semibold mt-0.5">
                          {activeHabit?.name}
                        </h2>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          type="button"
                          onClick={() => toggleHabitDate(activeHabit.id, todayKey)}
                          className="arch-btn-primary px-2.5 py-1 rounded text-[11px] font-mono"
                        >
                          CHECK IN +1
                        </button>
                        <button
                          type="button"
                          onClick={() => toggleShieldDate(selectedDateKey)}
                          className={`px-2.5 py-1 rounded text-[11px] font-mono inline-flex items-center gap-1 border transition ${
                            shields[selectedDateKey] ? 'arch-btn-primary' : 'arch-btn-ghost'
                          }`}
                          title="Protect streak on a rest/exam day without resetting to 0"
                        >
                          <Icon name="shield" size={12} />
                          <span>{shields[selectedDateKey] ? 'SHIELD ACTIVE' : 'REST SHIELD'}</span>
                        </button>
                        <div className="flex border rounded-md p-0.5 text-[11px] font-mono" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                          <button
                            type="button"
                            onClick={() => setViewMode('month')}
                            className={`px-2.5 py-1 rounded transition ${
                              viewMode === 'month' ? 'arch-btn-primary' : 'opacity-60 hover:opacity-100'
                            }`}
                          >
                            MONTH GRID
                          </button>
                          <button
                            type="button"
                            onClick={() => setViewMode('year')}
                            className={`px-2.5 py-1 rounded transition ${
                              viewMode === 'year' ? 'arch-btn-primary' : 'opacity-60 hover:opacity-100'
                            }`}
                          >
                            365D HORIZON
                          </button>
                        </div>
                      </div>
                    </div>

                    {viewMode === 'month' ? (
                      <>
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-1.5">
                            <button
                              type="button"
                              onClick={() => setCursorDate(new Date(cursorDate.getFullYear(), cursorDate.getMonth() - 1, 1))}
                              className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono"
                            >
                              &lt; PREV
                            </button>
                            <button
                              type="button"
                              onClick={() => setCursorDate(new Date(today.getFullYear(), today.getMonth(), 1))}
                              className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono"
                            >
                              TODAY
                            </button>
                            <button
                              type="button"
                              onClick={() => setCursorDate(new Date(cursorDate.getFullYear(), cursorDate.getMonth() + 1, 1))}
                              className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono"
                            >
                              NEXT &gt;
                            </button>
                          </div>

                          <div className="text-right font-mono tabular-nums">
                            <div className="text-xs font-semibold uppercase tracking-wider">
                              {monthLabel}
                            </div>
                            <div className="text-[11px]" style={{ color: 'var(--ink-muted)' }}>
                              {habitMetrics.loggedInMonth}/{habitMetrics.daysInMonth} DAYS ({habitMetrics.monthRate}%)
                            </div>
                          </div>
                        </div>

                        <div className="grid grid-cols-7 gap-1.5 text-center font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>
                          {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map((d) => (
                            <div key={d} className="py-1">{d}</div>
                          ))}
                        </div>

                        {/* Calendar Cells */}
                        <div className="grid grid-cols-7 gap-1.5">
                          {calendarCells.map((cell, idx) => {
                            if (!cell) {
                              return <div key={`empty-${idx}`} className="h-12 rounded border opacity-25" style={{ backgroundColor: 'var(--bg-canvas)' }} />;
                            }
                            const isLogged = !!activeHabit?.logs?.[cell.key];
                            const isShielded = !!shields[cell.key];
                            const isToday = cell.key === todayKey;
                            const isSelectedDate = cell.key === selectedDateKey;

                            return (
                              <button
                                key={cell.key}
                                type="button"
                                onClick={() => {
                                  setSelectedDateKey(cell.key);
                                  toggleHabitDate(activeHabit.id, cell.key);
                                }}
                                className="h-12 p-1.5 rounded border text-left font-mono tabular-nums transition flex flex-col justify-between relative"
                                style={{
                                  backgroundColor: isLogged
                                    ? 'rgba(16, 185, 129, 0.14)'
                                    : isShielded
                                    ? 'rgba(168, 85, 247, 0.16)'

      // VIEW 12: EXTRACURRICULAR LOG
      const ExtracurricularView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [eName, setEName] = useState('');

        const addExtra = (e) => {

          setData((prev) => ({
            ...prev,

              { id: 'ex-' + Date.now(), name: eName.trim(), category: eCat, date: new Date().toISOString().split('T')[0], achievement: eAch.trim() || 'Participant' },

      // VIEW 13: SIMULATION DECK (Precision Line-Parking Rover + Upgraded Mini-Games)
      const ArcadeView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const PUZZLES = useMemo(() => [
          { q: 'n × (n + 1) progression: 2, 6, 12, 20, 30, 42, ?', ans: '56', hint: '7 × 8' },
          { q: 'Bitwise Left Shift: 1 << 6 evaluates to ?', ans: '64', hint: '2^6' },
          { q: 'Fibonacci progression: 3, 5, 8, 13, 21, 34, ?', ans: '55', hint: '21 + 34' },
          { q: 'Bitwise XOR: (10 ^ 6) in decimal equals ?', ans: '12', hint: '1010 XOR 0110 = 1100' },
          { q: 'Primes progression: 7, 11, 13, 17, 19, 23, ?', ans: '29', hint: 'Next prime after 23' },
          { q: 'Binary tree max nodes at depth k=5 (2^5 - 1) =', ans: '31', hint: '32 - 1' }

            awardXP(50, `Solved Logic Benchmark #${puzzleIdx + 1}`);
            setLogicAns('');
            setShowHint(false);
            setPuzzleIdx((i) => i + 1);

            playTactileClick(data.profile.soundEnabled, 280, 30);

        return (
          <div className="space-y-6">
            <div className="flex flex-wrap items-end justify-between gap-4">
              <div>
                <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>

              bestNodes={data.arcadeScores.roverNodes}

                notify(`Launching ${id.toUpperCase()} module...`);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        const addIdentity = (e) => {

          const newId = {
            id: 'idv-' + Date.now(),
            statement: identityInput.trim(),
            votes: 0
          };
          setData((prev) => ({
            ...prev,
            identityVotes: [...(prev.identityVotes || []), newId]
          }));
          if (!selectedIdentityId) setSelectedIdentityId(newId.id);
          setIdentityInput('');
          notify('Identity statement registered');
        };

        const castDirectVote = (idObj) => {
          playTactileClick(data.profile.soundEnabled, 880, 12);
          setData((prev) => ({
            ...prev,
            identityVotes: (prev.identityVotes || []).map((v) =>
              v.id === idObj.id ? { ...v, votes: (Number(v.votes) || 0) + 1 } : v
            )
          }));
          awardXP(10, `Identity Vote: I am someone who ${idObj.statement}`);
        };

        const deleteIdentity = (id) => {
          setData((prev) => ({
            ...prev,
            identityVotes: (prev.identityVotes || []).filter((v) => v.id !== id)
          }));
        };

        const addStack = (e) => {
          e.preventDefault();
          if (!anchor.trim() || !habit.trim()) return;
          const newStack = {
            id: 'hd-' + Date.now(),
            kind: 'stack',
            anchor: anchor.trim(),
            habit: habit.trim(),
            place: place.trim() || 'workspace',
            twoMin: twoMin.trim() || 'Start for 2 minutes',
            identityId: selectedIdentityId || (identityVotes[0]?.id || ''),
            createdAt: todayKey,
            logs: {}
          };
          setData((prev) => ({
            ...prev,
            habitDesigns: [newStack, ...(prev.habitDesigns || [])]
          }));
          setAnchor('');
          setHabit('');
          setPlace('');
          setTwoMin('');
          notify('Habit stack architected');
        };

        const checkInStack = (stack) => {
          const alreadyDone = !!(stack.logs && stack.logs[todayKey]);
          playTactileClick(data.profile.soundEnabled, alreadyDone ? 520 : 920, 14);

          setData((prev) => {
            const nextDesigns = (prev.habitDesigns || []).map((item) => {
              if (item.id !== stack.id) return item;
              const nextLogs = { ...(item.logs || {}) };
              if (alreadyDone) {
                delete nextLogs[todayKey];
              } else {
                nextLogs[todayKey] = true;
              }
              return { ...item, logs: nextLogs };
            });

            const nextIdentities = (prev.identityVotes || []).map((v) => {
              if (v.id !== stack.identityId) return v;
              const currentVotes = Number(v.votes) || 0;
              return {
                ...v,
                votes: alreadyDone ? Math.max(0, currentVotes - 1) : currentVotes + 1
              };
            });

            return {
              ...prev,
              habitDesigns: nextDesigns,
              identityVotes: nextIdentities
            };
          });

          if (!alreadyDone) {
            awardXP(25, `Completed Stack: ${stack.habit}`);
          }
        };

        const deleteDesignItem = (id) => {
          setData((prev) => ({
            ...prev,
            habitDesigns: (prev.habitDesigns || []).filter((item) => item.id !== id)
          }));
        };

        const addScorecardAction = (e) => {
          e.preventDefault();
          if (!actionText.trim()) return;
          const newItem = {
            id: 'sc-' + Date.now(),
            kind: 'scorecard',
            title: actionText.trim(),
            tag: actionTag,
            date: todayKey
          };
          setData((prev) => ({
            ...prev,
            habitDesigns: [...(prev.habitDesigns || []), newItem]
          }));
          setActionText('');
          notify('Daily action logged to Scorecard');
        };

        const todayScorecard = scorecardItems.filter((item) => !item.date || item.date === todayKey);
        const plusCount = todayScorecard.filter((i) => i.tag === '+').length;
        const equalCount = todayScorecard.filter((i) => i.tag === '=').length;
        const minusCount = todayScorecard.filter((i) => i.tag === '-').length;

        return (
          <div className="space-y-6">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                15 // ATOMIC ARCHITECTURE &amp; IDENTITY TELEMETRY
              </div>
              <h1 className="text-2xl font-semibold heading-tight mt-1">Habit Design &amp; Identity Lab</h1>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-7 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    01 // IDENTITY VOTES (PROGRESS TOWARD 100 VOTES)
                  </span>
                  <span className="font-mono text-[11px] tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                    {identityVotes.length} IDENTITIES
                  </span>
                </div>

                <form onSubmit={addIdentity} className="flex flex-col sm:flex-row gap-2">
                  <div className="flex-1 flex items-center arch-input rounded-md px-3 py-1.5">
                    <span className="font-mono text-xs mr-1.5 shrink-0" style={{ color: 'var(--ink-muted)' }}>
                      I am someone who
                    </span>
                    <input
                      value={identityInput}
                      onChange={(e) => setIdentityInput(e.target.value)}
                      placeholder="ships clean code daily, never misses workouts..."
                      className="w-full bg-transparent text-xs focus:outline-none"
                    />
                  </div>
                  <button type="submit" className="arch-btn-primary px-3.5 py-2 rounded-md text-xs font-mono shrink-0 inline-flex items-center gap-1.5">
                    <Icon name="plus" size={14} />
                    <span>Add Identity</span>
                  </button>
                </form>

                {identityVotes.length === 0 ? (
                  <EmptyState
                    code="IDENTITY.VOTES // 0_RECORDS"
                    title="No identity statements defined"
                    subtitle="Define who you are becoming above. Every habit stack check-in casts a vote toward your 100-vote identity benchmark."
                  />
                ) : (
                  <div className="space-y-3">
                    {identityVotes.map((idObj) => {
                      const votes = Number(idObj.votes) || 0;
                      const pct = Math.min(100, votes);
                      return (
                        <div key={idObj.id} className="p-3.5 rounded-lg border space-y-2" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                          <div className="flex items-center justify-between gap-2">
                            <div className="text-xs font-semibold">
                              <span style={{ color: 'var(--ink-secondary)' }}>I am someone who </span>
                              <span>{idObj.statement}</span>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <span className="font-mono text-xs tabular-nums" style={{ color: 'var(--status-ok)' }}>
                                {votes} / 100 VOTES
                              </span>
                              <button
                                type="button"
                                onClick={() => castDirectVote(idObj)}
                                className="arch-btn-ghost px-2 py-0.5 rounded text-[10px] font-mono"
                              >
                                +1 VOTE
                              </button>
                              <button
                                type="button"
                                onClick={() => deleteIdentity(idObj.id)}
                                className="arch-btn-ghost p-1 rounded"
                              >
                                <Icon name="trash" size={12} />
                              </button>
                            </div>
                          </div>
                          <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                            <div
                              className="h-full transition-all duration-300"
                              style={{ width: `${pct}%`, backgroundColor: 'var(--status-ok)' }}
                            />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              <div className="lg:col-span-5 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    02 // DAILY HABIT SCORECARD ({todayKey})
                  </span>
                </div>

                <div className="hairline-grid grid grid-cols-3 rounded-lg overflow-hidden text-center">
                  <div className="hairline-cell p-2.5">
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>GOOD (+)</div>
                    <div className="font-mono text-lg font-semibold tabular-nums mt-0.5" style={{ color: 'var(--status-ok)' }}>
                      +{plusCount}
                    </div>
                  </div>
                  <div className="hairline-cell p-2.5">
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>NEUTRAL (=)</div>
                    <div className="font-mono text-lg font-semibold tabular-nums mt-0.5" style={{ color: 'var(--ink-secondary)' }}>
                      ={equalCount}
                    </div>
                  </div>
                  <div className="hairline-cell p-2.5">
                    <div className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>BAD (-)</div>
                    <div className="font-mono text-lg font-semibold tabular-nums mt-0.5" style={{ color: 'var(--status-err)' }}>
                      -{minusCount}
                    </div>
                  </div>
                </div>

                <form onSubmit={addScorecardAction} className="flex gap-2">
                  <input
                    value={actionText}
                    onChange={(e) => setActionText(e.target.value)}
                    placeholder="Daily action (e.g., Check phone in bed, Read 10p)..."
                    className="flex-1 arch-input rounded-md px-3 py-1.5 text-xs"
                  />
                  <select
                    value={actionTag}
                    onChange={(e) => setActionTag(e.target.value)}
                    className="arch-input rounded-md px-2.5 py-1.5 text-xs font-mono"
                  >
                    <option value="+">Good (+)</option>
                    <option value="=">Neutral (=)</option>
                    <option value="-">Bad (-)</option>
                  </select>
                  <button type="submit" className="arch-btn-primary px-3 py-1.5 rounded-md text-xs font-mono">
                    Log
                  </button>
                </form>

                {todayScorecard.length === 0 ? (
                  <div className="py-6 text-center border border-dashed rounded-lg">
                    <p className="font-mono text-xs" style={{ color: 'var(--ink-muted)' }}>
                      NO ACTIONS SCORED TODAY
                    </p>
                  </div>
                ) : (
                  <div className="divide-y max-h-48 overflow-y-auto pr-1">
                    {todayScorecard.map((item) => (
                      <div key={item.id} className="py-2 flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2.5">
                          <span
                            className="font-mono text-xs font-bold px-2 py-0.5 rounded border tabular-nums"
                            style={{
                              color: item.tag === '+' ? 'var(--status-ok)' : item.tag === '-' ? 'var(--status-err)' : 'var(--ink-secondary)',
                              borderColor: item.tag === '+' ? 'var(--status-ok)' : item.tag === '-' ? 'var(--status-err)' : 'var(--border-hairline)'
                            }}
                          >
                            {item.tag}
                          </span>
                          <span className="text-xs">{item.title}</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => deleteDesignItem(item.id)}
                          className="arch-btn-ghost p-1 rounded"
                        >
                          <Icon name="trash" size={12} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="arch-panel rounded-xl p-5 space-y-4">
              <span className="font-mono text-[11px] uppercase tracking-wider block" style={{ color: 'var(--ink-muted)' }}>
                03 // HABIT STACKING BUILDER &amp; 2-MINUTE RULE GATEWAY
              </span>

              <form onSubmit={addStack} className="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                <div className="md:col-span-3">
                  <label className="font-mono text-[10px] uppercase block mb-1" style={{ color: 'var(--ink-muted)' }}>
                    AFTER I [ANCHOR]
                  </label>
                  <input
                    value={anchor}
                    onChange={(e) => setAnchor(e.target.value)}
                    placeholder="pour morning coffee"
                    className="w-full arch-input rounded-md px-3 py-2 text-xs"
                  />
                </div>

                <div className="md:col-span-3">
                  <label className="font-mono text-[10px] uppercase block mb-1" style={{ color: 'var(--ink-muted)' }}>
                    I WILL [NEW HABIT]
                  </label>
                  <input
                    value={habit}
                    onChange={(e) => setHabit(e.target.value)}
                    placeholder="solve 1 graph problem"
                    className="w-full arch-input rounded-md px-3 py-2 text-xs"
                  />
                </div>

                <div className="md:col-span-2">
                  <label className="font-mono text-[10px] uppercase block mb-1" style={{ color: 'var(--ink-muted)' }}>
                    IN [PLACE]
                  </label>
                  <input
                    value={place}
                    onChange={(e) => setPlace(e.target.value)}
                    placeholder="at my study desk"
                    className="w-full arch-input rounded-md px-3 py-2 text-xs"
                  />
                </div>

                <div className="md:col-span-2">
                  <label className="font-mono text-[10px] uppercase block mb-1" style={{ color: 'var(--ink-muted)' }}>
                    2-MINUTE VERSION
                  </label>
                  <input
                    value={twoMin}
                    onChange={(e) => setTwoMin(e.target.value)}
                    placeholder="Open IDE & read prompt"
                    className="w-full arch-input rounded-md px-3 py-2 text-xs"
                  />
                </div>

                <div className="md:col-span-2">
                  <label className="font-mono text-[10px] uppercase block mb-1" style={{ color: 'var(--ink-muted)' }}>
                    LINKED IDENTITY
                  </label>
                  <div className="flex gap-1.5">
                    <select
                      value={selectedIdentityId}
                      onChange={(e) => setSelectedIdentityId(e.target.value)}
                      className="w-full arch-input rounded-md px-2 py-2 text-xs font-mono"
                    >
                      <option value="">-- Optional --</option>
                      {identityVotes.map((idObj) => (
                        <option key={idObj.id} value={idObj.id}>
                          {idObj.statement.slice(0, 18)}
                        </option>
                      ))}
                    </select>
                    <button type="submit" className="arch-btn-primary px-3 py-2 rounded-md text-xs font-mono shrink-0">
                      + Stack
                    </button>
                  </div>
                </div>
              </form>
            </div>

            {stacks.length === 0 ? (
              <EmptyState
                code="HABIT.STACKS // 0_ARCHITECTURES"
                title="No habit stacks built yet"
                subtitle="Chain a new behavior to an existing daily anchor above, define its 2-minute gateway version, and check in daily."
              />
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {stacks.map((st) => {
                  const doneToday = !!(st.logs && st.logs[todayKey]);
                  const doneYesterday = !!(st.logs && st.logs[yesterdayKey]);
                  const createdToday = st.createdAt === todayKey;
                  const neverMissTwiceAlert = !createdToday && !doneYesterday && !doneToday;
                  const linkedIdentity = identityVotes.find((v) => v.id === st.identityId);

                  return (
                    <div
                      key={st.id}
                      className="arch-panel rounded-xl p-5 flex flex-col justify-between space-y-4"
                      style={{
                        borderColor: neverMissTwiceAlert ? 'var(--status-warn)' : doneToday ? 'var(--status-ok)' : 'var(--border-hairline)'
                      }}
                    >
                      <div className="space-y-3">
                        {neverMissTwiceAlert && (
                          <div
                            className="px-3 py-2 rounded-md border font-mono text-[11px] flex items-center justify-between"
                            style={{
                              borderColor: 'var(--status-warn)',
                              color: 'var(--status-warn)',
                              backgroundColor: 'var(--bg-canvas)'
                            }}
                          >
                            <span>NEVER MISS TWICE // MISSED YESTERDAY ({yesterdayKey})</span>
                            <span className="font-semibold">EXECUTE 2M RULE NOW</span>
                          </div>
                        )}

                        <div className="flex items-start justify-between gap-2">
                          <span className="font-mono text-[10px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                            STACK PROTOCOL {linkedIdentity ? `• VOTE: ${linkedIdentity.statement}` : ''}
                          </span>
                          <button
                            type="button"
                            onClick={() => deleteDesignItem(st.id)}
                            className="arch-btn-ghost p-1 rounded"
                          >
                            <Icon name="trash" size={12} />
                          </button>
                        </div>

                        <p className="text-sm leading-relaxed">
                          <span style={{ color: 'var(--ink-secondary)' }}>After I </span>
                          <strong className="font-semibold">{st.anchor}</strong>
                          <span style={{ color: 'var(--ink-secondary)' }}>, I will </span>
                          <strong className="font-semibold" style={{ color: 'var(--status-ok)' }}>{st.habit}</strong>
                          <span style={{ color: 'var(--ink-secondary)' }}>, in </span>
                          <strong className="font-semibold">{st.place}</strong>.
                        </p>

                        <div className="p-2.5 rounded-md border font-mono text-xs" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                          <span style={{ color: 'var(--ink-muted)' }}>2-MINUTE GATEWAY: </span>
                          <span>{st.twoMin}</span>
                        </div>
                      </div>

                      <div className="pt-2 border-t flex items-center justify-between gap-2">
                        <span className="font-mono text-[11px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                          TOTAL CHECK-INS: {Object.keys(st.logs || {}).length}
                        </span>
                        <button
                          type="button"
                          onClick={() => checkInStack(st)}
                          className={`px-3.5 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-1.5 ${
                            doneToday ? 'arch-btn-primary' : 'arch-btn-ghost'
                          }`}
                        >
                          <Icon name="check" size={13} />
                          <span>{doneToday ? 'VERIFIED TODAY' : 'CHECK IN TODAY (+1 VOTE)'}</span>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      // VIEW 16: STUDY VAULT & 1-3-7 REVISION MATRIX
      const StudyVaultView = () => {
        const { data, setData, notify, awardXP } = useContext(NexoraContext);

        const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const addDays = (d, days) => ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() + days));

        const today = new Date();
        const todayKey = ymd(today);

        const revisionTopics = data.revisionTopics || [];
        const problemPages = data.problemPages || [];

        const [topicInput, setTopicInput] = useState('');
        const [calCursor, setCalCursor] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
        const [selectedDateKey, setSelectedDateKey] = useState(todayKey);

        const [rootTitle, setRootTitle] = useState('');
        const [rootDiff, setRootDiff] = useState('Med');
        const [vaultSearch, setVaultSearch] = useState('');
        const [expandedIds, setExpandedIds] = useState({});
        const [subFormParentId, setSubFormParentId] = useState(null);
        const [subTitle, setSubTitle] = useState('');
        const [subDiff, setSubDiff] = useState('Med');

        const handleAddTopic = (e) => {
          e.preventDefault();
          const clean = topicInput.trim();
          if (!clean) return;

          const newTopic = {
            id: 'rev-' + Date.now(),
            title: clean,
            createdAt: todayKey,
            reviews: [
              { interval: 1, date: addDays(today, 1), done: false },
              { interval: 3, date: addDays(today, 3), done: false },
              { interval: 7, date: addDays(today, 7), done: false }
            ]
          };

          setData((prev) => ({
            ...prev,
            revisionTopics: [newTopic, ...(prev.revisionTopics || [])]
          }));
          setTopicInput('');
          notify('Scheduled +1, +3, +7 day revisions');
        };

        const markReviewDone = (topicId, interval, currentlyDone) => {
          playTactileClick(data.profile.soundEnabled, currentlyDone ? 520 : 920, 12);
          setData((prev) => ({
            ...prev,
            revisionTopics: (prev.revisionTopics || []).map((t) => {
              if (t.id !== topicId) return t;
              return {
                ...t,
                reviews: (t.reviews || []).map((r) =>
                  r.interval === interval ? { ...r, done: !currentlyDone } : r
                )
              };
            })
          }));
          if (!currentlyDone) {
            awardXP(10, `Completed Day +${interval} revision`);
          }
        };

        const deleteTopic = (topicId) => {
          setData((prev) => ({
            ...prev,
            revisionTopics: (prev.revisionTopics || []).filter((t) => t.id !== topicId)
          }));
        };

        const allReviewsFlat = useMemo(() => {
          const list = [];
          revisionTopics.forEach((t) => {
            (t.reviews || []).forEach((r) => {
              list.push({
                topicId: t.id,
                title: t.title,
                createdAt: t.createdAt,
                interval: r.interval,
                date: r.date,
                done: r.done,
                overdue: !r.done && r.date < todayKey
              });
            });
          });
          return list;
        }, [revisionTopics, todayKey]);

        const dueTodayOrOverdue = useMemo(
          () =>
            allReviewsFlat
              .filter((r) => !r.done && r.date <= todayKey)
              .sort((a, b) => a.date.localeCompare(b.date)),
          [allReviewsFlat, todayKey]
        );

        const monthCells = useMemo(() => {
          const y = calCursor.getFullYear();
          const m = calCursor.getMonth();
          const firstDow = new Date(y, m, 1).getDay();
          const daysInMonth = new Date(y, m + 1, 0).getDate();
          const cells = [];
          for (let i = 0; i < firstDow; i++) cells.push(null);
          for (let d = 1; d <= daysInMonth; d++) {
            const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            cells.push({ day: d, key });
          }
          return cells;
        }, [calCursor]);

        const selectedDayReviews = useMemo(
          () => allReviewsFlat.filter((r) => r.date === selectedDateKey),
          [allReviewsFlat, selectedDateKey]
        );

        const addPage = (parentId, titleText, diffTag) => {
          const clean = titleText.trim();
          if (!clean) return;
          const newPage = {
            id: 'pg-' + Date.now(),
            parentId: parentId || null,
            title: clean,
            difficulty: diffTag || 'Med',
            notes: '',
            createdAt: todayKey
          };
          setData((prev) => ({
            ...prev,
            problemPages: [...(prev.problemPages || []), newPage]
          }));
          setExpandedIds((prev) => ({
            ...prev,
            [newPage.id]: true,
            ...(parentId ? { [parentId]: true } : {})
          }));
          notify('Page added to Problem Vault');
        };

        const handleAddRootPage = (e) => {
          e.preventDefault();
          addPage(null, rootTitle, rootDiff);
          setRootTitle('');
        };

        const handleAddSubPage = (e, parentId) => {
          e.preventDefault();
          addPage(parentId, subTitle, subDiff);
          setSubTitle('');
          setSubFormParentId(null);
        };

        const updatePageField = (pageId, field, value) => {
          setData((prev) => ({
            ...prev,
            problemPages: (prev.problemPages || []).map((p) =>
              p.id === pageId ? { ...p, [field]: value } : p
            )
          }));
        };

        const deletePageAndChildren = (targetId) => {
          const toRemove = new Set([targetId]);
          let added = true;
          while (added) {
            added = false;
            problemPages.forEach((p) => {
              if (p.parentId && toRemove.has(p.parentId) && !toRemove.has(p.id)) {
                toRemove.add(p.id);
                added = true;
              }
            });
          }
          setData((prev) => ({
            ...prev,
            problemPages: (prev.problemPages || []).filter((p) => !toRemove.has(p.id))
          }));
          notify('Page and sub-pages deleted');
        };

        const toggleExpand = (id) => {
          setExpandedIds((prev) => ({ ...prev, [id]: !prev[id] }));
        };

        const visiblePageIds = useMemo(() => {
          const q = vaultSearch.trim().toLowerCase();
          if (!q) return null;
          const keep = new Set();
          const byId = {};
          problemPages.forEach((p) => { byId[p.id] = p; });

          problemPages.forEach((p) => {
            const match =
              (p.title || '').toLowerCase().includes(q) ||
              (p.notes || '').toLowerCase().includes(q);
            if (match) {
              let cur = p;
              while (cur) {
                keep.add(cur.id);
                cur = cur.parentId ? byId[cur.parentId] : null;
              }
            }
          });
          return keep;
        }, [problemPages, vaultSearch]);

        const diffColor = (diff) => {
          if (diff === 'Easy') return 'var(--status-ok)';
          if (diff === 'Hard') return 'var(--status-err)';
          return 'var(--status-warn)';
        };

        const renderPageNodes = (parentId = null, depth = 0) => {
          const children = problemPages.filter(
            (p) => (p.parentId || null) === parentId && (!visiblePageIds || visiblePageIds.has(p.id))
          );
          if (children.length === 0) return null;

          return (
            <div className={depth > 0 ? 'pl-4 border-l space-y-2.5 mt-2.5' : 'space-y-3'}>
              {children.map((page) => {
                const isExpanded = !!expandedIds[page.id] || !!visiblePageIds;
                const childCount = problemPages.filter((c) => c.parentId === page.id).length;

                return (
                  <div
                    key={page.id}
                    className="rounded-lg border p-3 space-y-2.5"
                    style={{ backgroundColor: depth % 2 === 0 ? 'var(--bg-canvas)' : 'var(--bg-surface)' }}
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-2 min-w-0 flex-1">
                        <button
                          type="button"
                          onClick={() => toggleExpand(page.id)}
                          className="arch-btn-ghost px-1.5 py-0.5 rounded font-mono text-[10px]"
                          title="Expand / Collapse"
                        >
                          {isExpanded ? '[-]' : '[+]'}
                        </button>
                        <input
                          value={page.title}
                          onChange={(e) => updatePageField(page.id, 'title', e.target.value)}
                          className="bg-transparent text-xs font-semibold focus:outline-none flex-1 min-w-[120px]"
                        />
                      </div>

                      <div className="flex items-center gap-1.5 shrink-0">
                        <select
                          value={page.difficulty || 'Med'}
                          onChange={(e) => updatePageField(page.id, 'difficulty', e.target.value)}
                          className="arch-input rounded px-2 py-0.5 font-mono text-[10px]"
                          style={{ color: diffColor(page.difficulty), borderColor: diffColor(page.difficulty) }}
                        >
                          <option value="Easy">Easy</option>
                          <option value="Med">Med</option>
                          <option value="Hard">Hard</option>
                        </select>

                        {childCount > 0 && (
                          <span className="font-mono text-[10px] px-1.5 py-0.5 rounded border" style={{ color: 'var(--ink-muted)' }}>
                            {childCount} sub
                          </span>
                        )}

                        <button
                          type="button"
                          onClick={() => {
                            setSubFormParentId(subFormParentId === page.id ? null : page.id);
                            setSubTitle('');
                            setSubDiff('Med');
                          }}
                          className="arch-btn-ghost px-2 py-0.5 rounded font-mono text-[10px] inline-flex items-center gap-1"
                        >
                          <Icon name="plus" size={11} />
                          <span>Sub-page</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => deletePageAndChildren(page.id)}
                          className="arch-btn-ghost p-1 rounded"
                          title="Delete page and sub-pages"
                        >
                          <Icon name="trash" size={12} />
                        </button>
                      </div>
                    </div>

                    {subFormParentId === page.id && (
                      <form onSubmit={(e) => handleAddSubPage(e, page.id)} className="flex flex-wrap gap-2 pt-1">
                        <input
                          autoFocus
                          value={subTitle}
                          onChange={(e) => setSubTitle(e.target.value)}
                          placeholder="Sub-page title..."
                          className="flex-1 arch-input rounded px-2.5 py-1 text-xs"
                        />
                        <select
                          value={subDiff}
                          onChange={(e) => setSubDiff(e.target.value)}
                          className="arch-input rounded px-2 py-1 text-xs font-mono"
                        >
                          <option value="Easy">Easy</option>
                          <option value="Med">Med</option>
                          <option value="Hard">Hard</option>
                        </select>
                        <button type="submit" className="arch-btn-primary px-2.5 py-1 rounded text-xs font-mono">
                          Create
                        </button>
                      </form>
                    )}

                    {isExpanded && (
                      <div className="space-y-2">
                        <textarea
                          rows={3}
                          value={page.notes || ''}
                          onChange={(e) => updatePageField(page.id, 'notes', e.target.value)}
                          placeholder="Notes, complexity analysis, edge cases, or solution outline..."
                          className="w-full arch-input rounded-md p-2.5 text-xs font-mono leading-relaxed"
                        />
                        {renderPageNodes(page.id, depth + 1)}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        };

        const monthTitle = calCursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        return (
          <div className="space-y-6">
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                16 // SPACED REPETITION &amp; HIERARCHICAL KNOWLEDGE TREE
              </div>
              <h1 className="text-2xl font-semibold heading-tight mt-1">Study Vault &amp; 1-3-7 Revision Matrix</h1>
            </div>

            <div className="arch-panel rounded-xl p-5 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    01 // DUE TODAY &amp; OVERDUE QUEUE ({todayKey})
                  </span>
                  <span className="font-mono text-xs px-2 py-0.5 rounded border tabular-nums" style={{ color: dueTodayOrOverdue.length > 0 ? 'var(--status-warn)' : 'var(--status-ok)' }}>
                    {dueTodayOrOverdue.length} PENDING
                  </span>
                </div>

                <form onSubmit={handleAddTopic} className="flex gap-2 w-full sm:w-auto">
                  <input
                    value={topicInput}
                    onChange={(e) => setTopicInput(e.target.value)}
                    placeholder="Type topic name to auto-schedule +1, +3, +7..."
                    className="flex-1 sm:w-72 arch-input rounded-md px-3 py-1.5 text-xs"
                  />
                  <button type="submit" className="arch-btn-primary px-3.5 py-1.5 rounded-md text-xs font-mono inline-flex items-center gap-1.5 shrink-0">
                    <Icon name="plus" size={14} />
                    <span>Log Topic</span>
                  </button>
                </form>
              </div>

              {dueTodayOrOverdue.length === 0 ? (
                <div className="py-5 text-center border border-dashed rounded-lg">
                  <p className="font-mono text-xs" style={{ color: 'var(--ink-muted)' }}>
                    ZERO REVIEWS DUE OR OVERDUE FOR {todayKey}
                  </p>
                </div>
              ) : (
                <div className="divide-y">
                  {dueTodayOrOverdue.map((item) => (
                    <div key={`${item.topicId}-${item.interval}`} className="py-2.5 flex items-center justify-between gap-3">
                      <div className="flex items-center gap-2.5 min-w-0">
                        <span
                          className="font-mono text-[10px] px-2 py-0.5 rounded border shrink-0 tabular-nums"
                          style={{
                            color: item.overdue ? 'var(--status-warn)' : 'var(--ink-primary)',
                            borderColor: item.overdue ? 'var(--status-warn)' : 'var(--border-hairline)'
                          }}
                        >
                          DAY +{item.interval}
                        </span>
                        <span className="text-xs font-semibold truncate">{item.title}</span>
                        {item.overdue && (
                          <span className="font-mono text-[10px] uppercase shrink-0" style={{ color: 'var(--status-warn)' }}>
                            OVERDUE ({item.date})
                          </span>
                        )}
                      </div>
                      <button
                        type="button"
                        onClick={() => markReviewDone(item.topicId, item.interval, false)}
                        className="arch-btn-primary px-3 py-1 rounded text-xs font-mono inline-flex items-center gap-1 shrink-0"
                      >
                        <Icon name="check" size={12} />
                        <span>Done (+10 XP)</span>
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-5 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    02 // 1-3-7 REVISION CALENDAR
                  </span>
                  <div className="flex items-center gap-1">
                    <button
                      type="button"
                      onClick={() => setCalCursor(new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1))}
                      className="arch-btn-ghost px-2 py-0.5 rounded text-xs font-mono"
                    >
                      &lt;
                    </button>
                    <span className="font-mono text-xs font-semibold px-1.5 uppercase">{monthTitle}</span>
                    <button
                      type="button"
                      onClick={() => setCalCursor(new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1))}
                      className="arch-btn-ghost px-2 py-0.5 rounded text-xs font-mono"
                    >
                      &gt;
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>
                  {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map((d) => (
                    <div key={d}>{d}</div>
                  ))}
                </div>

                <div className="grid grid-cols-7 gap-1">
                  {monthCells.map((cell, idx) => {
                    if (!cell) {
                      return <div key={`empty-${idx}`} className="h-12 rounded border opacity-20" style={{ backgroundColor: 'var(--bg-canvas)' }} />;
                    }
                    const dayRevs = allReviewsFlat.filter((r) => r.date === cell.key);
                    const hasOverdue = dayRevs.some((r) => r.overdue);
                    const isSelected = cell.key === selectedDateKey;
                    const isToday = cell.key === todayKey;

                    return (
                      <button
                        key={cell.key}
                        type="button"
                        onClick={() => setSelectedDateKey(cell.key)}
                        className="h-12 p-1.5 rounded border text-left font-mono transition flex flex-col justify-between"
                        style={{
                          backgroundColor: 'var(--bg-canvas)',
                          borderColor: isSelected
                            ? 'var(--ink-primary)'
                            : hasOverdue
                            ? 'var(--status-warn)'
                            : 'var(--border-hairline)'
                        }}
                      >
                        <span className={`text-[11px] tabular-nums ${isToday ? 'underline font-bold' : ''}`}>
                          {String(cell.day).padStart(2, '0')}
                        </span>
                        <div className="flex flex-wrap gap-1">
                          {dayRevs.slice(0, 4).map((r, i) => (
                            <span
                              key={i}
                              className="w-1.5 h-1.5 rounded-full"
                              style={{
                                backgroundColor: r.done
                                  ? 'var(--status-ok)'
                                  : r.overdue
                                  ? 'var(--status-warn)'
                                  : 'var(--ink-secondary)'
                              }}
                            />
                          ))}
                        </div>
                      </button>
                    );
                  })}
                </div>

                <div className="pt-3 border-t space-y-2.5">
                  <div className="flex items-center justify-between font-mono text-xs tabular-nums">
