      // VIEW 3: WALLET (College Student Money Tracker, 2-Tap Spend, 7D Chart & Goals)
      const BankView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [amount, setAmount] = useState('');
        const [note, setNote] = useState('');
        const [mode, setMode] = useState('debit');
        const [editingBudget, setEditingBudget] = useState(false);
        const [budgetInput, setBudgetInput] = useState(data.profile.monthlyBudget || 6000);

        const [potName, setPotName] = useState('');
        const [potTarget, setPotTarget] = useState('');
        const [depositInputs, setDepositInputs] = useState({});

        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        const currentMonthPrefix = todayStr.slice(0, 7);

        const monthlyBudget = Number(data.profile.monthlyBudget) || 6000;
        const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        const daysLeftInMonth = Math.max(1, daysInMonth - today.getDate() + 1);

        const monthTransactions = data.transactions.filter((t) => (t.date || '').startsWith(currentMonthPrefix));
        const spentThisMonth = monthTransactions
          .filter((t) => t.type === 'debit')
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);

        const budgetLeft = Math.max(0, monthlyBudget - spentThisMonth);
        const safeToSpendToday = Math.round(budgetLeft / daysLeftInMonth);

        const daysPassedThisMonth = Math.max(1, today.getDate());
        const avgDailySpend = spentThisMonth > 0 ? spentThisMonth / daysPassedThisMonth : 0;
        const moneyLeftPool = telemetry.netBalance > 0 ? telemetry.netBalance : budgetLeft;
        const daysCanSurvive = avgDailySpend > 0 ? Math.floor(moneyLeftPool / avgDailySpend) : '∞';

        const sevenDaysAgo = new Date(today);
        sevenDaysAgo.setDate(today.getDate() - 6);
        const sevenDaysAgoStr = sevenDaysAgo.toISOString().split('T')[0];

        const wastedThisWeek = data.transactions
          .filter((t) => t.type === 'debit' && t.tag === 'waste' && (t.date || '') >= sevenDaysAgoStr)
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);

        const last7Days = useMemo(() => {
          const days = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const key = d.toISOString().split('T')[0];
            const label = d.toLocaleDateString('en-IN', { weekday: 'short' });
            const total = data.transactions
              .filter((t) => t.type === 'debit' && t.date === key)
              .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            days.push({ key, label, total });
          }
          const max = Math.max(100, ...days.map((d) => d.total));
          return days.map((d) => ({ ...d, pct: Math.round((d.total / max) * 100) }));
        }, [data.transactions]);

        const handleCategoryTap = (categoryLabel) => {
          const num = Math.abs(Number(amount) || 0);
          if (num <= 0) {
            notify('Enter an amount in ₹ first!', 'err');
            return;
          }
          playTactileClick(data.profile.soundEnabled, 880, 14);
          const ntx = {
            id: 'tx-' + Date.now(),
            title: note.trim() || categoryLabel,
            amount: num,
            type: mode,
            category: categoryLabel,
            tag: mode === 'debit' ? 'worth' : null,
            date: todayStr
          };
          setData((prev) => ({ ...prev, transactions: [ntx, ...prev.transactions] }));
          setAmount('');
          setNote('');
          notify(mode === 'debit' ? `Spent ₹${num} on ${categoryLabel}` : `Added +₹${num} to Wallet`);
        };

        const toggleWorthOrWaste = (txId) => {
          playTactileClick(data.profile.soundEnabled, 660, 12);
          setData((prev) => ({
            ...prev,
            transactions: prev.transactions.map((t) =>
              t.id === txId ? { ...t, tag: t.tag === 'waste' ? 'worth' : 'waste' } : t
            )
          }));
        };

        const saveMonthlyBudget = (e) => {
          e.preventDefault();
          const val = Math.max(500, Number(budgetInput) || 6000);
          setData((prev) => ({
            ...prev,
            profile: { ...prev.profile, monthlyBudget: val }
          }));
          setEditingBudget(false);
          notify(`Monthly budget set to ₹${val.toLocaleString('en-IN')}`);
        };

        const addPot = (e, presetName, presetTarget) => {
          if (e) e.preventDefault();
          const finalName = presetName || potName.trim();
          const finalTarget = Number(presetTarget || potTarget) || 0;
          if (!finalName || finalTarget <= 0) return;
          const np = {
            id: 'pot-' + Date.now(),
            name: finalName,
            target: finalTarget,
            saved: 0
          };
          setData((prev) => ({ ...prev, savingsPots: [...prev.savingsPots, np] }));
          setPotName('');
          setPotTarget('');
          notify(`Goal created: ${finalName}`);
        };

        const depositToPot = (potId) => {
          const val = Math.abs(Number(depositInputs[potId]) || 0);
          if (val <= 0) return;
          playTactileClick(data.profile.soundEnabled, 920, 14);
          setData((prev) => ({
            ...prev,
            savingsPots: prev.savingsPots.map((p) => (p.id === potId ? { ...p, saved: p.saved + val } : p))
          }));
          setDepositInputs((prev) => ({ ...prev, [potId]: '' }));
          notify(`Saved ₹${val} towards your goal!`);
        };

        return (
          <div className="space-y-6">
            <div className="flex flex-wrap items-end justify-between gap-4">
              <div>
                <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                  03 // CAMPUS WALLET &amp; DAILY SURVIVAL
                </div>
                <h1 className="text-2xl font-semibold heading-tight mt-1">My Wallet</h1>
              </div>

              {editingBudget ? (
                <form onSubmit={saveMonthlyBudget} className="flex items-center gap-2">
                  <input
                    type="number"
                    value={budgetInput}
                    onChange={(e) => setBudgetInput(e.target.value)}
                    placeholder="Monthly Budget ₹"
                    className="arch-input rounded-md px-2.5 py-1 text-xs font-mono w-32"
                    autoFocus
                  />
                  <button type="submit" className="arch-btn-primary px-3 py-1 rounded-md text-xs font-mono">
                    Save
                  </button>
                </form>
              ) : (
                <button
                  type="button"
                  onClick={() => {
                    setBudgetInput(monthlyBudget);
                    setEditingBudget(true);
                  }}
                  className="arch-btn-ghost px-3 py-1.5 rounded-md text-xs font-mono"
                >
                  Monthly Budget: ₹{monthlyBudget.toLocaleString('en-IN')} [Edit]
                </button>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="arch-panel rounded-xl p-5 md:col-span-2 flex flex-col justify-between">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    SAFE TO SPEND TODAY
                  </span>
                  <span className="font-mono text-[11px] px-2 py-0.5 rounded border" style={{ color: 'var(--status-ok)' }}>
                    {daysLeftInMonth} days left in month
                  </span>
                </div>
                <div className="my-3">
                  <div className="text-3xl sm:text-4xl font-mono font-bold tabular-nums" style={{ color: 'var(--status-ok)' }}>
                    Safe to spend today: ₹{safeToSpendToday.toLocaleString('en-IN')}
                  </div>
                  <p className="text-xs mt-1.5" style={{ color: 'var(--ink-secondary)' }}>
                    You have <strong>₹{budgetLeft.toLocaleString('en-IN')}</strong> left from your ₹{monthlyBudget.toLocaleString('en-IN')} monthly budget (Spent ₹{spentThisMonth.toLocaleString('en-IN')} so far).
                  </p>
                </div>
              </div>

              <div className="arch-panel rounded-xl p-5 flex flex-col justify-between">
                <span className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                  SURVIVAL RUNWAY
                </span>
                <div className="my-2">
                  <div className="text-3xl font-mono font-bold tabular-nums">
                    {daysCanSurvive} <span className="text-base font-normal">days</span>
                  </div>
                  <div className="text-xs mt-1" style={{ color: 'var(--ink-secondary)' }}>
                    Days I can survive at my avg spend of ₹{Math.round(avgDailySpend).toLocaleString('en-IN')}/day
                  </div>
                </div>
                <div className="pt-2 border-t flex justify-between text-[11px] font-mono" style={{ color: 'var(--ink-muted)' }}>
                  <span>Wallet Balance:</span>
                  <span style={{ color: 'var(--ink-primary)' }}>₹{telemetry.netBalance.toLocaleString('en-IN')}</span>
                </div>
              </div>
            </div>

            <div
              className="arch-panel rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-2"
              style={{
                borderColor: wastedThisWeek > 0 ? 'var(--status-warn)' : 'var(--border-hairline)'
              }}
            >
              <div className="text-xs">
                {wastedThisWeek > 0 ? (
                  <span>
                    You wasted <strong className="font-mono" style={{ color: 'var(--status-warn)' }}>₹{wastedThisWeek.toLocaleString('en-IN')}</strong> this week — that's about <strong>{Math.max(1, Math.round(wastedThisWeek / 40))} plates of hostel Maggi!</strong> Keep an eye on impulse buys.
                  </span>
                ) : (
                  <span style={{ color: 'var(--ink-secondary)' }}>
                    You wasted <strong className="font-mono" style={{ color: 'var(--status-ok)' }}>₹0</strong> this week! Every rupee spent so far is tagged "Worth it".
                  </span>
                )}
              </div>
              <span className="font-mono text-[10px] uppercase" style={{ color: 'var(--ink-muted)' }}>
                TAG EXPENSES BELOW AS WORTH IT / WASTE
              </span>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-7 space-y-5">
                <div className="arch-panel rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      QUICK-ADD (1: AMOUNT &rarr; 2: TAP CATEGORY)
                    </span>
                    <div className="flex gap-1">
                      <button
                        type="button"
                        onClick={() => setMode('debit')}
                        className={`px-2.5 py-1 rounded text-[11px] font-mono ${mode === 'debit' ? 'arch-btn-primary' : 'arch-btn-ghost'}`}
                      >
                        Spend (-)
                      </button>
                      <button
                        type="button"
                        onClick={() => setMode('credit')}
                        className={`px-2.5 py-1 rounded text-[11px] font-mono ${mode === 'credit' ? 'arch-btn-primary' : 'arch-btn-ghost'}`}
                      >
                        Pocket Money (+)
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                    <input
                      type="number"
                      value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      placeholder="₹ Amount (e.g. 60)"
                      className="sm:col-span-5 arch-input rounded-md px-3 py-2.5 text-sm font-mono tabular-nums"
                    />
                    <input
                      type="text"
                      value={note}
                      onChange={(e) => setNote(e.target.value)}
                      placeholder="Optional note (e.g. Canteen chai, Auto)..."
                      className="sm:col-span-7 arch-input rounded-md px-3 py-2.5 text-xs"
                    />
                  </div>

                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className="font-mono text-[10px] mr-1" style={{ color: 'var(--ink-muted)' }}>QUICK ₹:</span>
                    {[20, 50, 100, 200, 500].map((preset) => (
                      <button
                        key={preset}
                        type="button"
                        onClick={() => setAmount(String(preset))}
                        className="arch-btn-ghost px-2 py-0.5 rounded text-[11px] font-mono"
                      >
                        ₹{preset}
                      </button>
                    ))}
                  </div>

                  <div>
                    <div className="font-mono text-[10px] uppercase mb-2" style={{ color: 'var(--ink-muted)' }}>
                      {mode === 'debit' ? 'TAP A CATEGORY TO LOG IMMEDIATELY:' : 'TAP TO ADD MONEY TO WALLET:'}
                    </div>
                    {mode === 'debit' ? (
                      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                        {['Food', 'Travel', 'Recharge', 'Fun', 'Books', 'Other'].map((cat) => (
                          <button
                            key={cat}
                            type="button"
                            onClick={() => handleCategoryTap(cat)}
                            className="arch-btn-primary py-2 px-2 rounded-lg text-xs font-medium text-center"
                          >
                            {cat}
                          </button>
                        ))}
                      </div>
                    ) : (
                      <div className="grid grid-cols-3 gap-2">
                        {['Home Allowance', 'Intern / Gig', 'Cashback / Gift'].map((src) => (
                          <button
                            key={src}
                            type="button"
                            onClick={() => handleCategoryTap(src)}
                            className="arch-btn-primary py-2 px-2 rounded-lg text-xs font-medium text-center"
                          >
                            + {src}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div className="arch-panel rounded-xl p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      RECENT SPENDING (TAP TO TAG WORTH IT / WASTE)
                    </span>
                    <span className="font-mono text-[11px]" style={{ color: 'var(--ink-muted)' }}>
                      {data.transactions.length} entries
                    </span>
                  </div>

                  {data.transactions.length === 0 ? (
                    <div className="py-8 text-center border border-dashed rounded-lg">
                      <p className="text-xs font-mono" style={{ color: 'var(--ink-muted)' }}>
                        NO EXPENSES YET — TYPE ₹ AMOUNT &amp; TAP A CATEGORY ABOVE!
                      </p>
                    </div>
                  ) : (
                    <div className="divide-y max-h-80 overflow-y-auto pr-1">
                      {data.transactions.slice(0, 20).map((tx) => {
                        const isWaste = tx.tag === 'waste';
                        return (
                          <div key={tx.id} className="py-3 flex items-center justify-between gap-3">
                            <div>
                              <div className="text-xs font-medium">{tx.title}</div>
                              <div className="font-mono text-[10px]" style={{ color: 'var(--ink-muted)' }}>
                                {tx.category} &bull; {tx.date}
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              {tx.type === 'debit' && (
                                <button
                                  type="button"
                                  onClick={() => toggleWorthOrWaste(tx.id)}
                                  className="px-2 py-0.5 rounded border text-[10px] font-mono transition"
                                  style={{
                                    borderColor: isWaste ? 'var(--status-err)' : 'var(--status-ok)',
                                    color: isWaste ? 'var(--status-err)' : 'var(--status-ok)'
                                  }}
                                >
                                  {isWaste ? 'Waste' : 'Worth it'}
                                </button>
                              )}

                              <span
                                className="font-mono text-xs font-semibold tabular-nums"
                                style={{ color: tx.type === 'credit' ? 'var(--status-ok)' : 'var(--ink-primary)' }}
                              >
                                {tx.type === 'credit' ? '+' : '-'}₹{Number(tx.amount).toLocaleString('en-IN')}
                              </span>

                              <button
                                type="button"
                                onClick={() =>
                                  setData((prev) => ({
                                    ...prev,
                                    transactions: prev.transactions.filter((x) => x.id !== tx.id)
                                  }))
                                }
                                className="arch-btn-ghost p-1 rounded"
                                title="Delete"
                              >
                                <Icon name="trash" size={12} />
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>

              <div className="lg:col-span-5 space-y-5">
                <div className="arch-panel rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      LAST 7 DAYS SPENDING
                    </span>
                    <span className="font-mono text-[11px]" style={{ color: 'var(--ink-secondary)' }}>
                      7D Total: ₹{last7Days.reduce((s, d) => s + d.total, 0).toLocaleString('en-IN')}
                    </span>
                  </div>

                  <div className="h-36 flex items-end justify-between gap-2 pt-4 px-2 border-b">
                    {last7Days.map((d) => (
                      <div key={d.key} className="flex-1 flex flex-col items-center gap-1.5 h-full justify-end">
                        <span className="font-mono text-[9px] tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                          {d.total > 0 ? `₹${d.total}` : ''}
                        </span>
                        <div
                          className="w-full max-w-[28px] rounded-t transition-all duration-300"
                          style={{
                            height: `${Math.max(6, d.pct)}%`,
                            backgroundColor: d.key === todayStr ? 'var(--status-ok)' : 'var(--accent)',
                            opacity: d.total > 0 ? 0.9 : 0.15
                          }}
                        />
                        <span className="font-mono text-[10px]" style={{ color: d.key === todayStr ? 'var(--ink-primary)' : 'var(--ink-muted)' }}>
                          {d.label}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="arch-panel rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      SAVINGS GOALS (LAPTOP, TRIP, GEAR)
                    </span>
                    <div className="flex gap-1">
                      <button
                        type="button"
                        onClick={() => addPot(null, 'New Laptop', 65000)}
                        className="arch-btn-ghost px-2 py-0.5 rounded text-[10px] font-mono"
                      >
                        + Laptop
                      </button>
                      <button
                        type="button"
                        onClick={() => addPot(null, 'College Trip', 8000)}
                        className="arch-btn-ghost px-2 py-0.5 rounded text-[10px] font-mono"
                      >
                        + Trip
                      </button>
                    </div>
                  </div>

                  <form onSubmit={(e) => addPot(e)} className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                    <input
                      value={potName}
                      onChange={(e) => setPotName(e.target.value)}
                      placeholder="Goal (e.g. Headphones, Goa Trip)"
                      className="sm:col-span-5 arch-input rounded-md px-3 py-1.5 text-xs"
                    />
                    <input
                      type="number"
                      value={potTarget}
                      onChange={(e) => setPotTarget(e.target.value)}
                      placeholder="Target ₹"
                      className="sm:col-span-4 arch-input rounded-md px-3 py-1.5 text-xs font-mono tabular-nums"
                    />
                    <button type="submit" className="sm:col-span-3 arch-btn-primary rounded-md py-1.5 text-xs font-medium">
                      + Add Goal
                    </button>
                  </form>

                  {data.savingsPots.length === 0 ? (
                    <div className="p-4 text-center border border-dashed rounded-lg">
                      <p className="text-xs font-mono" style={{ color: 'var(--ink-muted)' }}>
                        NO GOALS YET — CLICK "+ LAPTOP" OR "+ TRIP" ABOVE TO START!
                      </p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {data.savingsPots.map((p) => {
                        const pct = p.target > 0 ? Math.min(100, Math.round((p.saved / p.target) * 100)) : 0;
                        return (
                          <div key={p.id} className="p-3.5 rounded-lg border space-y-2.5" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                            <div className="flex justify-between items-center">
                              <span className="text-xs font-semibold">{p.name}</span>
                              <div className="flex items-center gap-2">
                                <span className="font-mono text-xs tabular-nums" style={{ color: 'var(--ink-secondary)' }}>
                                  ₹{p.saved.toLocaleString('en-IN')} / ₹{p.target.toLocaleString('en-IN')} ({pct}%)
                                </span>
                                <button
                                  type="button"
                                  onClick={() =>
                                    setData((prev) => ({
                                      ...prev,
                                      savingsPots: prev.savingsPots.filter((x) => x.id !== p.id)
                                    }))
                                  }
                                  className="arch-btn-ghost p-1 rounded"
                                >
                                  <Icon name="trash" size={11} />
                                </button>
                              </div>
                            </div>

                            <div className="w-full h-2 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                              <div
                                className="h-full transition-all duration-300"
                                style={{ width: `${pct}%`, backgroundColor: 'var(--status-ok)' }}
                              />
                            </div>

                            <div className="flex gap-2 pt-1">
                              <input
                                type="number"
                                value={depositInputs[p.id] || ''}
                                onChange={(e) => setDepositInputs((prev) => ({ ...prev, [p.id]: e.target.value }))}
                                placeholder="Add ₹ to goal..."
                                className="flex-1 arch-input rounded px-2.5 py-1 text-xs font-mono tabular-nums"
                              />
                              <button
                                type="button"
                                onClick={() => depositToPot(p.id)}
                                className="arch-btn-primary px-3 py-1 rounded text-xs font-mono"
                              >
                                + Save ₹
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      };

      // VIEW 4: MISSION CONTROL (Tasks List, Kanban Board & ₹ Bounties)
      const MissionsView = () => {
        const { completeMission, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [title, setTitle] = useState('');
        const [category, setCategory] = useState('Engineering');
        const [priority, setPriority] = useState('High');
        const [dueDate, setDueDate] = useState(new Date().toISOString().split('T')[0]);
        const [bounty, setBounty] = useState('');
        const [viewMode, setViewMode] = useState('list');

        const addTask = (e) => {
          e.preventDefault();
          if (!title.trim()) return;
          const nt = {
            id: 't-' + Date.now(),
            title: title.trim(),
            category,
            priority,
            status: 'Pending',
            dueDate,
            bounty: Math.max(0, Number(bounty) || 0),
            completed: false,
            rewardClaimed: false
          };
          setData((prev) => ({ ...prev, tasks: [nt, ...prev.tasks] }));
          setTitle('');
          setBounty('');
          notify(nt.bounty > 0 ? `Mission queued with ₹${nt.bounty} bounty` : 'Mission registered');
        };

        const toggleMissionComplete = (t) => {
          const nextCompleted = !t.completed;
          playTactileClick(data.profile.soundEnabled, nextCompleted ? 960 : 520, 14);
          completeMission(t.id, nextCompleted);
        };

        return (
          <div className="space-y-6">
            <ExecutionHubSubNav current="missions" onSelect={setActiveTab} />

            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                  04 // EXECUTION & DELIVERABLES
                </div>
                <h1 className="text-2xl font-semibold heading-tight mt-1">Mission Control &amp; ₹ Bounties</h1>
              </div>
              <div className="flex gap-1.5">
                <button
                  type="button"
                  onClick={() => setViewMode('list')}
                  className={`px-3 py-1.5 rounded-md text-xs font-mono ${viewMode === 'list' ? 'arch-btn-primary' : 'arch-btn-ghost'}`}
                >
                  LIST VIEW
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode('board')}
                  className={`px-3 py-1.5 rounded-md text-xs font-mono ${viewMode === 'board' ? 'arch-btn-primary' : 'arch-btn-ghost'}`}
                >
                  BOARD VIEW
                </button>
              </div>
            </div>

            <form onSubmit={addTask} className="arch-panel rounded-xl p-4 grid grid-cols-1 sm:grid-cols-12 gap-2.5">
              <input
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="Mission directive..."
                className="sm:col-span-4 arch-input rounded-md px-3 py-2 text-xs"
              />
              <select value={category} onChange={(e) => setCategory(e.target.value)} className="sm:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs">
                <option>Engineering</option>
                <option>Academics</option>
                <option>Career</option>
                <option>Personal</option>
              </select>
              <select value={priority} onChange={(e) => setPriority(e.target.value)} className="sm:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs font-mono">
                <option>Critical</option>
                <option>High</option>
                <option>Standard</option>
              </select>
              <input
                type="number"
                value={bounty}
                onChange={(e) => setBounty(e.target.value)}
                placeholder="₹ Bounty (opt)"
                className="sm:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs font-mono tabular-nums"
              />
              <input
                type="date"
                value={dueDate}
                onChange={(e) => setDueDate(e.target.value)}
                className="sm:col-span-1 arch-input rounded-md px-2 py-2 text-xs font-mono tabular-nums"
              />
              <button type="submit" className="sm:col-span-1 arch-btn-primary rounded-md py-2 text-xs font-medium">
                Add
              </button>
            </form>

            {data.tasks.length === 0 ? (
              <EmptyState
                code="MISSIONS.QUEUE // 0_DIRECTIVES"
                title="Mission queue is clear"
                subtitle="Add academic assignments, engineering sprints, or personal deliverables above. Attach an optional ₹ Bounty to auto-credit your Wallet upon completion."
              />
            ) : viewMode === 'list' ? (
              <div className="arch-panel rounded-xl divide-y">
                {data.tasks.map((t) => (
                  <div key={t.id} className="p-3.5 flex items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <input
                        type="checkbox"
                        checked={t.completed}
                        onChange={() => toggleMissionComplete(t)}
                        className="w-4 h-4 cursor-pointer"
                      />
                      <div>
                        <div className="flex items-center gap-2">
                          <span className={`text-xs font-medium ${t.completed ? 'line-through opacity-50' : ''}`}>
                            {t.title}
                          </span>
                          {Number(t.bounty) > 0 && (
                            <span
                              className="px-2 py-0.5 rounded border font-mono text-[10px] tabular-nums"
                              style={{ color: 'var(--status-ok)', borderColor: 'var(--status-ok)' }}
                            >
                              BOUNTY: +₹{Number(t.bounty).toLocaleString('en-IN')}
                            </span>
                          )}
                        </div>
                        <div className="text-[11px] font-mono tabular-nums" style={{ color: 'var(--ink-muted)' }}>
                          {t.category} &bull; Priority: {t.priority} &bull; Due: {t.dueDate}
                        </div>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setData((prev) => ({ ...prev, tasks: prev.tasks.filter((x) => x.id !== t.id) }))}
                      className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono"
                    >
                      Delete
                    </button>
                  </div>
                ))}
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {['Pending Directives', 'Completed Directives'].map((col, idx) => (
                  <div key={col} className="arch-panel p-4 rounded-xl space-y-3">
                    <div className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      {col}
                    </div>
                    {data.tasks.filter((t) => (idx === 0 ? !t.completed : t.completed)).map((t) => (
                      <div key={t.id} className="p-3 rounded-lg border flex justify-between items-center" style={{ backgroundColor: 'var(--bg-canvas)' }}>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-medium">{t.title}</span>
                            {Number(t.bounty) > 0 && (

      // VIEW 5: SKILL MATRIX (Career & Technical Progression)

              />

            {data.skills.length === 0 ? (

            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {data.skills.map((sk) => (
                  <div key={sk.id} className="arch-panel p-5 rounded-xl space-y-4">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-[10px] font-mono uppercase" style={{ color: 'var(--ink-muted)' }}>

                          onClick={() =>
                            setData((prev) => ({

                    </div>

                    <div>
                      <div className="flex justify-between text-xs font-mono tabular-nums mb-1" style={{ color: 'var(--ink-secondary)' }}>
                        <span>Mastery Progress</span>
                        <span>{sk.progress}%</span>
                      </div>
                      <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                        <div className="h-full" style={{ width: `${sk.progress}%`, backgroundColor: 'var(--accent)' }} />
                      </div>
                    </div>

                    <div className="space-y-2 pt-2 border-t">
                      <div className="text-[10px] font-mono uppercase" style={{ color: 'var(--ink-muted)' }}>
                        MILESTONES
                      </div>
                      {(sk.milestones || []).map((m, idx) => (
                        <label key={idx} className="flex items-center gap-2 text-xs cursor-pointer">
                          <input
                            type="checkbox"
                            checked={m.done}
                            onChange={() => {
                              if (!m.done) awardXP(50, `Milestone: ${m.title}`);
                              setData((prev) => ({
                                ...prev,
                                skills: prev.skills.map((s) =>
                                  s.id !== sk.id
                                    ? s
                                    : {
                                        ...s,
                                        progress: Math.min(100, Math.max(0, s.progress + (m.done ? -20 : 20))),
                                        milestones: s.milestones.map((ms, i) => (i === idx ? { ...ms, done: !ms.done } : ms))
                                      }
                                )
                              }));

                          />

                      <div className="flex gap-1.5 pt-1">
                        <input
                          value={milestoneText[sk.id] || ''}

                          placeholder="Add milestone..."

                        />
                        <button type="button" onClick={() => addMilestone(sk.id)} className="arch-btn-ghost px-2.5 py-1 rounded text-xs font-mono">

      // VIEW 6: PROJECT LAB (Engineering Portfolio)
      const ProjectsView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [pName, setPName] = useState('');

        return (

              <input value={pTech} onChange={(e) => setPTech(e.target.value)} placeholder="Stack (comma-separated)" className="md:col-span-3 arch-input rounded-md px-3 py-2 text-xs font-mono" />
              <input value={pDesc} onChange={(e) => setPDesc(e.target.value)} placeholder="Architecture summary" className="md:col-span-4 arch-input rounded-md px-3 py-2 text-xs" />
              <button type="submit" className="md:col-span-2 arch-btn-primary rounded-md py-2 text-xs font-medium">

            {data.projects.length === 0 ? (

              />
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {data.projects.map((p) => (
                  <div key={p.id} className="arch-panel p-5 rounded-xl flex flex-col justify-between space-y-4">
                    <div>
                      <div className="flex justify-between items-center text-[11px] font-mono tabular-nums mb-1.5" style={{ color: 'var(--ink-muted)' }}>
                        <span>{p.status}</span>
                        <span>Due {p.deadline}</span>
                      </div>
                      <h3 className="text-base font-semibold">{p.name}</h3>
                      <p className="text-xs mt-1" style={{ color: 'var(--ink-secondary)' }}>{p.description}</p>
                      <div className="flex flex-wrap gap-1.5 mt-3">
                        {p.tech.map((t, i) => (
                          <span key={i} className="px-2 py-0.5 rounded border font-mono text-[10px]">
                            {t}
                          </span>
                        ))}
                      </div>
                    </div>
                    <div className="space-y-2">
                      <div className="flex justify-between text-xs font-mono tabular-nums">

                      <input

                            )

                      />
                      <button

      // VIEW 6B: INNOVATION CANVAS (OneNote-Style Idea Cards + HTML5 Sketch & Draw Pad)
      const InnovationCanvasView = () => {
        const { awardXP, data, mediaMap, notify, setData, setMediaMap } = useContext(NexoraContext);
        const [ideaTitle, setIdeaTitle] = useState('');
        const [ideaTag, setIdeaTag] = useState('Architecture');
        const [ideaNotes, setIdeaNotes] = useState('');
        const [uploadedImg, setUploadedImg] = useState(null);

        const sketchRef = useRef(null);
        const isDrawingRef = useRef(false);
        const [penColor, setPenColor] = useState('#FAFAFA');
        const [brushSize, setBrushSize] = useState(2.5);
        const [hasSketched, setHasSketched] = useState(false);

        const clearSketchPad = useCallback(() => {
          const canvas = sketchRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#09090B';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = 'rgba(255,255,255,0.05)';
          ctx.lineWidth = 1;
          for (let x = 0; x < canvas.width; x += 24) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
          }
          for (let y = 0; y < canvas.height; y += 24) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
          }
          setHasSketched(false);
        }, []);

        useEffect(() => {
          clearSketchPad();
        }, [clearSketchPad]);

        const getCanvasCoords = (e) => {
          const canvas = sketchRef.current;
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: ((clientX - rect.left) * canvas.width) / rect.width,
            y: ((clientY - rect.top) * canvas.height) / rect.height
          };
        };

        const startDraw = (e) => {
          const canvas = sketchRef.current;
          if (!canvas) return;
          isDrawingRef.current = true;
          setHasSketched(true);
          const { x, y } = getCanvasCoords(e);
          const ctx = canvas.getContext('2d');
          ctx.beginPath();
          ctx.moveTo(x, y);
        };

        const moveDraw = (e) => {
          if (!isDrawingRef.current) return;
          const canvas = sketchRef.current;
          if (!canvas) return;
          const { x, y } = getCanvasCoords(e);
          const ctx = canvas.getContext('2d');
          ctx.strokeStyle = penColor;
          ctx.lineWidth = brushSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineTo(x, y);
          ctx.stroke();
        };

        const endDraw = () => {
          isDrawingRef.current = false;
        };

        const handleImageUpload = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => setUploadedImg(reader.result);
          reader.readAsDataURL(file);
        };

        const handlePaste = (e) => {
          const items = e.clipboardData?.items || [];
          for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
              const blob = items[i].getAsFile();
              const reader = new FileReader();
              reader.onload = () => {
                setUploadedImg(reader.result);
                notify('Image pasted from clipboard');
              };
              reader.readAsDataURL(blob);
            }
          }
        };

        const commitIdeaCard = async (includeSketch = false) => {
          if (!ideaTitle.trim() && !ideaNotes.trim()) {
            notify('Enter an idea title or specification notes first', 'err');
            return;
          }
          const id = 'idea-' + Date.now();
          let finalMediaUrl = uploadedImg;

          if (includeSketch && sketchRef.current) {
            finalMediaUrl = sketchRef.current.toDataURL('image/png');
          }

          if (finalMediaUrl) {
            const mediaSaved = await saveMediaToIDB(`idea-${id}`, finalMediaUrl);
            if (!mediaSaved) {
              notify('Could not save the image. The concept was not added.', 'err');
              return;
            }
            setMediaMap((prev) => ({ ...prev, [`idea-${id}`]: finalMediaUrl }));
          }

          const newCard = {
            id,
            title: ideaTitle.trim() || 'Untitled System Concept',
            tag: ideaTag,
            notes: ideaNotes.trim(),
            date: new Date().toISOString().split('T')[0],
            hasMedia: !!finalMediaUrl
          };

          setData((prev) => ({ ...prev, ideas: [newCard, ...(prev.ideas || [])] }));
          setIdeaTitle('');
          setIdeaNotes('');
          setUploadedImg(null);
          if (includeSketch) clearSketchPad();
          awardXP(35, 'Logged Concept in Innovation Canvas');
        };

        return (
          <div className="space-y-6" onPaste={handlePaste}>
            <div>
              <div className="font-mono text-[11px] uppercase tracking-widest" style={{ color: 'var(--ink-muted)' }}>
                06B // ONENOTE-STYLE ARCHITECTURE &amp; WIREFRAME STUDIO
              </div>
              <h1 className="text-2xl font-semibold heading-tight mt-1">Innovation Canvas</h1>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    01 // IDEA SPECIFICATION SHEET (PASTE IMAGE SUPPORTED)
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                  <input
                    value={ideaTitle}
                    onChange={(e) => setIdeaTitle(e.target.value)}
                    placeholder="Concept / System Title..."
                    className="sm:col-span-8 arch-input rounded-md px-3 py-2 text-xs"
                  />
                  <select
                    value={ideaTag}
                    onChange={(e) => setIdeaTag(e.target.value)}
                    className="sm:col-span-4 arch-input rounded-md px-2.5 py-2 text-xs font-mono"
                  >
                    <option>Architecture</option>
                    <option>Startup / Product</option>
                    <option>Hardware / IoT</option>
                    <option>Algorithm</option>
                    <option>UI / Wireframe</option>
                  </select>
                </div>

                <textarea
                  rows={6}
                  value={ideaNotes}
                  onChange={(e) => setIdeaNotes(e.target.value)}
                  placeholder="Write structured engineering notes, system requirements, or paste an image (Ctrl+V) anywhere..."
                  className="w-full arch-input rounded-md p-3 text-xs leading-relaxed"
                />

                <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                  <label className="arch-btn-ghost px-3 py-1.5 rounded-md text-xs font-mono cursor-pointer inline-flex items-center gap-1.5">
                    <Icon name="upload" size={13} />
                    <span>{uploadedImg ? 'Image Attached ✓' : 'Attach Photo'}</span>
                    <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                  </label>

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => commitIdeaCard(false)}
                      className="arch-btn-ghost px-3.5 py-1.5 rounded-md text-xs font-mono"
                    >
                      Save Note Card
                    </button>
                    <button
                      type="button"
                      onClick={() => commitIdeaCard(true)}
                      className="arch-btn-primary px-3.5 py-1.5 rounded-md text-xs font-mono"
                    >
                      Save with Sketch &rarr;
                    </button>
                  </div>
                </div>
              </div>

              <div className="lg:col-span-6 arch-panel rounded-xl p-5 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="font-mono text-[11px] uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                    02 // INTERACTIVE WIREFRAME SKETCH PAD
                  </span>
                  <div className="flex items-center gap-1.5">
                    {[
                      { c: '#FAFAFA', label: 'White' },
                      { c: '#10B981', label: 'Neon' },
                      { c: '#F59E0B', label: 'Orange' },
                      { c: '#F43F5E', label: 'Red' },
                      { c: '#09090B', label: 'Eraser' }
                    ].map((pen) => (
                      <button
                        key={pen.label}
                        type="button"
                        onClick={() => {
                          setPenColor(pen.c);
                          setBrushSize(pen.label === 'Eraser' ? 14 : 2.5);
                        }}
                        className={`px-2 py-0.5 rounded text-[10px] font-mono border ${
                          penColor === pen.c ? 'arch-btn-primary' : 'arch-btn-ghost'
                        }`}
                      >
                        {pen.label}
                      </button>
                    ))}
                    <button
                      type="button"
                      onClick={clearSketchPad}
                      className="arch-btn-ghost px-2 py-0.5 rounded text-[10px] font-mono"
                    >
                      Clear
                    </button>
                  </div>
                </div>

                <div className="rounded-lg overflow-hidden border" style={{ borderColor: 'var(--border-hairline)' }}>
                  <canvas
                    ref={sketchRef}
                    width={540}
                    height={250}
                    onMouseDown={startDraw}
                    onMouseMove={moveDraw}
                    onMouseUp={endDraw}
                    onMouseLeave={endDraw}
                    onTouchStart={startDraw}
                    onTouchMove={moveDraw}
                    onTouchEnd={endDraw}
                    className="w-full h-56 block bg-[#09090B] cursor-crosshair touch-none"
                  />
                </div>
              </div>
            </div>

            {(data.ideas || []).length === 0 ? (
              <EmptyState
                code="INNOVATION.CANVAS // 0_CARDS"
                title="No concept cards or wireframes saved"
                subtitle="Write system notes on the left, sketch diagrams on the right (or paste screenshots with Ctrl+V), and click 'Save with Sketch'."
              />
            ) : (
              <div className="space-y-4">
                {(data.ideas || []).map((card) => {
                  const mediaSrc = mediaMap[`idea-${card.id}`];
                  return (
                    <div key={card.id} className="arch-panel rounded-xl p-5 grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
                      <div className={mediaSrc ? 'md:col-span-7 space-y-2' : 'md:col-span-12 space-y-2'}>
                        <div className="flex items-center justify-between">
                          <span className="font-mono text-[10px] uppercase tracking-wider px-2 py-0.5 rounded border" style={{ color: 'var(--ink-muted)' }}>
                            {card.tag} &bull; {card.date}
                          </span>
                          <button
                            type="button"
                            onClick={() =>
                              setData((prev) => ({
                                ...prev,
                                ideas: (prev.ideas || []).filter((x) => x.id !== card.id)
                              }))
                            }
                            className="arch-btn-ghost p-1 rounded"
                          >
                            <Icon name="trash" size={13} />
                          </button>
                        </div>
                        <h3 className="text-base font-semibold heading-tight">{card.title}</h3>
                        <p className="text-xs leading-relaxed whitespace-pre-wrap" style={{ color: 'var(--ink-secondary)' }}>
                          {card.notes}
                        </p>
                      </div>

                      {mediaSrc && (
                        <div className="md:col-span-5 rounded-lg overflow-hidden border bg-[#09090B]">
                          <img src={mediaSrc} alt={card.title} className="w-full max-h-56 object-contain block" />
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      // VIEW 7: STYLE LAB (Digital Wardrobe + IndexedDB Image Upload + Milestone Locks)
      const StyleLabView = () => {
        const { awardXP, data, focusLabel, focusMinutes, mediaMap, notify, secondsLeft, setActiveTab, setConfirmResetModal, setData, setFocusLabel, setFocusMinutes, setMediaMap, setProfileModal, setSecondsLeft, setTimerRunning, telemetry, timerRunning } = useContext(NexoraContext);
        const [wName, setWName] = useState('');
        const [wCat, setWCat] = useState('Tops / Shirts');
        const [wOccasion, setWOccasion] = useState('Campus');
        const [wPrice, setWPrice] = useState('');
        const [reqLevel, setReqLevel] = useState('');
        const [reqBalance, setReqBalance] = useState('');

          e.preventDefault();
          if (!wName.trim()) return;
          const fileInput = e.target.elements.clothImg;
          const file = fileInput?.files?.[0];
          const id = 'w-' + Date.now();
          let hasImage = false;

          if (file) {
            let imageData;
            try {
              imageData = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Image file could not be read'));
                reader.readAsDataURL(file);
              });
            } catch (error) {
              notify('Could not read the garment image. Item was not added.', 'err');
              return;
            }
            const mediaSaved = await saveMediaToIDB(`wardrobe-${id}`, imageData);
            if (!mediaSaved) {
              notify('Could not save the garment image. Item was not added.', 'err');
              return;
            }
            setMediaMap((prev) => ({ ...prev, [`wardrobe-${id}`]: imageData }));
            hasImage = true;
          }

          const nw = {
            id,
            name: wName.trim(),
            category: wCat,
            occasion: wOccasion,
            price: Number(wPrice) || 0,
            reqLevel: Math.max(1, Number(reqLevel) || 1),
            reqBalance: Math.max(0, Number(reqBalance) || 0),
            hasImage
          };
          setData((prev) => ({ ...prev, wardrobe: [nw, ...prev.wardrobe] }));
          setWName('');
          setWPrice('');
          setReqLevel('');
          setReqBalance('');
          if (fileInput) fileInput.value = '';
          notify('Garment cataloged in Style Lab');
        };

        const saveOutfit = () => {
          if (!outfitName.trim() || selectedForOutfit.length === 0) return;
          const no = {
            id: 'out-' + Date.now(),
            name: outfitName.trim(),
            itemIds: selectedForOutfit
          };
          setData((prev) => ({ ...prev, outfits: [no, ...prev.outfits] }));
          setOutfitName('');
          setSelectedForOutfit([]);
          notify('Outfit saved to Lookbook');
        };

        return (
          <div className="space-y-6">
            <div>

              <select value={wCat} onChange={(e) => setWCat(e.target.value)} className="md:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs">

              </select>
              <select value={wOccasion} onChange={(e) => setWOccasion(e.target.value)} className="md:col-span-1 arch-input rounded-md px-2 py-2 text-xs">

                  <option key={o}>{o}</option>
                ))}
              </select>
              <input type="number" value={wPrice} onChange={(e) => setWPrice(e.target.value)} placeholder="Cost ₹" className="md:col-span-1 arch-input rounded-md px-2.5 py-2 text-xs font-mono tabular-nums" />
              <input type="number" value={reqLevel} onChange={(e) => setReqLevel(e.target.value)} placeholder="Req LVL" className="md:col-span-1 arch-input rounded-md px-2 py-2 text-xs font-mono tabular-nums" title="Minimum Operator Level to unlock" />
              <input type="number" value={reqBalance} onChange={(e) => setReqBalance(e.target.value)} placeholder="Req Wallet ₹" className="md:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs font-mono tabular-nums" title="Minimum Wallet Balance required to unlock" />
              <input type="file" name="clothImg" accept="image/*" className="md:col-span-1 text-[10px] font-mono" />
              <button type="submit" className="md:col-span-1 arch-btn-primary rounded-md py-2 text-xs font-medium">

            <div className="arch-panel p-4 rounded-xl flex flex-wrap items-center justify-between gap-3">

              <EmptyState

              <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                {data.wardrobe.map((item) => {
                  const isSel = selectedForOutfit.includes(item.id);

                  const minLvl = Number(item.reqLevel) || 1;

                    <div

      };

      // VIEW 8: EXPERIENCE ARCHIVE (India & Personal Bucket List)

        const [budgetFilter, setBudgetFilter] = useState('ALL');

              <select value={section} onChange={(e) => setSection(e.target.value)} className="md:col-span-2 arch-input rounded-md px-2.5 py-2 text-xs">

              <button type="submit" className="md:col-span-1 arch-btn-primary rounded-md py-2 text-xs font-medium">

            {data.experiences.length === 0 ? (

                title="No expeditions or experiences logged"
                subtitle="Add travel destinations across India or personal milestones above and filter by budget bracket."
              />
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {['India', 'Personal'].map((sec) => (
                  <div key={sec} className="space-y-3">
                    <h2 className="font-mono text-xs uppercase tracking-wider" style={{ color: 'var(--ink-muted)' }}>
                      {sec === 'India' ? 'EXPEDITIONS ACROSS INDIA' : 'PERSONAL MILESTONES'}
                    </h2>
                    {filtered.filter((e) => e.section === sec).map((ex) => (
                      <div key={ex.id} className="arch-panel p-4 rounded-xl flex justify-between items-center">
                        <div>
                          <div className="text-[10px] font-mono tabular-nums" style={{ color: 'var(--ink-muted)' }}>

                        <button

                                x.id === ex.id ? { ...x, status: x.status === 'Completed' ? 'Planned' : 'Completed' } : x
                              )

                        >
                          {ex.status}

                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      // VIEW 9: MEMORY VAULT (Local Journal & Timeline)
      const MemoryVaultView = () => {

            type,
            title: title.trim(),
            date: new Date().toISOString().split('T')[0],

            text: text.trim()
          };

          setTitle('');
          setText('');
          notify('Entry committed to local Memory Vault');
        };

        return (
          <div className="space-y-6">
