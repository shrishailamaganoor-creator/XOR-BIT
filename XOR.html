        const interval = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              setTimerRunning(false);
              playTactileClick(data.profile.soundEnabled, 1040, 35);
              const sessionRecord = {
                id: 'fs-' + Date.now(),
                label: focusLabel.trim() || 'Deep Work Block',
                minutes: focusMinutes,
                date: new Date().toISOString().split('T')[0]
              };
              setData((d) => ({
                ...d,
                focusSessions: [sessionRecord, ...(d.focusSessions || [])]
              }));
              awardXP(50, `Completed ${focusMinutes}m Focus Block`);
              return focusMinutes * 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [timerRunning, focusMinutes, focusLabel, data.profile.soundEnabled, awardXP]);

      // Navigation definitions with Focus Discipline, Learning Engine, and Life & Money integrated
      const navItems = useMemo(() => [
        { id: 'dashboard', label: 'Today', icon: 'dashboard', keyHint: '1' },
        { id: 'academy', label: 'Academy', icon: 'academy', badge: data.subjects.length, keyHint: '2' },
        { id: 'bank', label: 'Wallet', icon: 'bank', badge: data.transactions.length, keyHint: '3' },
        { id: 'missions', label: 'Mission Control', icon: 'missions', badge: data.tasks.filter((t) => !t.completed).length, keyHint: '4' },
        { id: 'skills', label: 'Skill Matrix', icon: 'skills', badge: data.skills.length, keyHint: '5' },
        { id: 'projects', label: 'Project Lab', icon: 'projects', badge: data.projects.length, keyHint: '6' },
        { id: 'innovation', label: 'Innovation Canvas', icon: 'innovation', badge: (data.ideas || []).length, keyHint: '7' },
        { id: 'style', label: 'Style Lab', icon: 'style', badge: data.wardrobe.length, keyHint: '8' },
        { id: 'calendar', label: 'Unified Calendar', icon: 'calendar', keyHint: '9' },
        { id: 'habits', label: 'Habit Matrix', icon: 'habits', badge: data.habits.length },
        { id: 'focus-discipline', label: 'Focus Discipline', icon: 'clock', badge: (data.distractionLog || []).length },
        { id: 'learning-engine', label: 'Learning Engine', icon: 'memory', badge: (data.feynmanNotes || []).length + (data.recallQs || []).length },
        { id: 'life-money', label: 'Life & Money', icon: 'bank', badge: (data.lifeWheel || []).length },
        { id: 'extracurricular', label: 'Extracurriculars', icon: 'extracurricular', badge: data.extracurriculars.length },
        { id: 'arcade', label: 'Simulation Deck', icon: 'arcade' },
        { id: 'habit-design', label: 'Habit Design', icon: 'habits', badge: (data.habitDesigns || []).length },
        { id: 'study-vault', label: 'Study Vault', icon: 'memory', badge: (data.revisionTopics || []).length },
        { id: 'bio-state', label: 'Bio-State Lab', icon: 'clock' },
        { id: 'executive', label: 'Executive Lab', icon: 'shield', badge: (data.decisions || []).filter((d) => !d.resolved).length },
        { id: 'trajectory', label: 'Trajectory', icon: 'skills', badge: (data.roadmaps || []).length },
        { id: 'settings', label: 'System Core', icon: 'settings' }
      ], [data]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setCmdOpen((prev) => !prev);
            return;
          }
          if (e.key === 'Escape') {
            setCmdOpen(false);
            setProfileModal(false);
            setConfirmResetModal(false);
            if (activeTab === 'secret-vault') {
              setActiveTab('arcade');
              notify('Vault locked');
            }
            return;
          }
          if (e.altKey && (e.code === 'KeyS' || e.code === 'KeyG')) {
            e.preventDefault();
            setActiveTab(e.code === 'KeyS' ? 'style' : 'arcade');
            return;
          }
          const tag = (e.target?.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || cmdOpen) return;

          if (e.key === '/') {
            e.preventDefault();
            setCmdOpen(true);
          } else if (e.key >= '1' && e.key <= '9') {
            const idx = parseInt(e.key, 10) - 1;
            const visibleItems = navItems.filter((item) => !hiddenSidebarIds.includes(item.id));
            if (visibleItems[idx]) {
              playTactileClick(data.profile.soundEnabled, 640, 10);
              setActiveTab(visibleItems[idx].id);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [cmdOpen, navItems, hiddenSidebarIds, data.profile.soundEnabled, activeTab, notify]);

      const telemetry = useMemo(() => {
        const totalAttended = data.subjects.reduce((acc, s) => acc + (Number(s.attended) || 0), 0);
        const totalClasses = data.subjects.reduce((acc, s) => acc + (Number(s.total) || 0), 0);
        const avgAttendance = totalClasses > 0 ? Math.round((totalAttended / totalClasses) * 100) : 0;

        const credits = data.transactions
          .filter((t) => t.type === 'credit')
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        const debits = data.transactions
          .filter((t) => t.type === 'debit')
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        const netBalance = credits - debits;

        const totalSaved = data.savingsPots.reduce((acc, p) => acc + (Number(p.saved) || 0), 0);
        const pendingMissions = data.tasks.filter((t) => !t.completed).length;
        const completedMissions = data.tasks.filter((t) => t.completed).length;

        const xp = Number(data.profile.xp) || 0;
        const thresholdFor = (lvl) => Math.round(1200 * Math.pow(lvl, 1.65));
        let level = 1;
        while (xp >= thresholdFor(level)) {
          level++;
        }
        const prevThreshold = level === 1 ? 0 : thresholdFor(level - 1);
        const nextThreshold = thresholdFor(level);
        const span = Math.max(1, nextThreshold - prevThreshold);
        const xpProgress = Math.min(100, Math.max(0, Math.round(((xp - prevThreshold) / span) * 100)));

        return {
          avgAttendance,
          totalAttended,
          totalClasses,
          credits,
          debits,
          netBalance,
          totalSaved,
          pendingMissions,
          completedMissions,
          level,
          xpProgress,
          prevThreshold,
          nextThreshold
        };
      }, [data]);

      // Global Search Results
      const searchResults = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return [];
        const res = [];
        data.subjects.forEach((s) => {
          if (s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)) {
            res.push({ title: `${s.code} — ${s.name}`, module: 'Academy', tab: 'academy' });
          }
        });
        data.tasks.forEach((t) => {
          if (t.title.toLowerCase().includes(q)) {
            res.push({ title: t.title, module: 'Mission Control', tab: 'missions' });
          }
        });
        data.projects.forEach((p) => {
          if (p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)) {
            res.push({ title: p.name, module: 'Project Lab', tab: 'projects' });
          }
        });
        (data.ideas || []).forEach((idCard) => {
          if (idCard.title.toLowerCase().includes(q) || (idCard.notes || '').toLowerCase().includes(q)) {
            res.push({ title: idCard.title, module: 'Innovation Canvas', tab: 'innovation' });
          }
        });
        (data.feynmanNotes || []).forEach((fn) => {
          if ((fn.topic || '').toLowerCase().includes(q) || (fn.eli12 || '').toLowerCase().includes(q)) {
            res.push({ title: `Feynman: ${fn.topic}`, module: 'Learning Engine', tab: 'learning-engine' });
          }
        });
        (data.recallQs || []).forEach((rq) => {
          if ((rq.question || '').toLowerCase().includes(q) || (rq.answer || '').toLowerCase().includes(q)) {
            res.push({ title: `Recall Q: ${rq.question}`, module: 'Learning Engine', tab: 'learning-engine' });
          }
        });
        return res.slice(0, 12);
      }, [searchQuery, data]);

      const contextValue = {
        awardXP,
        isAudioPlaying,
        sleepTimerSec,
        nsdrRunning,
        nsdrSecLeft,
        breathTick,
        startAudio,
        stopAudio,
        toggleAudio,
        toggleNsdr,
        setNsdrRunning,
        setNsdrSecLeft,
        setIsAudioPlaying,
        setSleepTimerSec,
        completeMission,
        data,
        focusLabel,
        focusMinutes,
        hiddenSidebarIds,
        mediaMap,
        navItems,
        notify,
        secondsLeft,
        setActiveTab,
        setConfirmResetModal,
        setData,
        setFocusLabel,
        setFocusMinutes,
        setHiddenSidebarIds,
        setMediaMap,
        setProfileModal,
        setSecondsLeft,
        setTimerRunning,
        telemetry,
        timerRunning
      };

      const renderActiveView = () => {
        switch (activeTab) {
          case 'dashboard': return <DashboardView />;
          case 'academy': return <AcademyView />;
          case 'bank': return <BankView />;
          case 'missions': return <MissionsView />;
          case 'skills': return <SkillsView />;
          case 'projects': return <ProjectsView />;
          case 'innovation': return <InnovationCanvasView />;
          case 'style': return <StyleLabView />;
          case 'calendar': return <CalendarView />;
          case 'habits': return <HabitsView />;
          case 'focus-discipline': return <FocusDisciplineView />;
          case 'learning-engine': return <LearningEngineView />;
          case 'life-money': return <LifeMoneyView />;
          case 'extracurricular': return <ExtracurricularView />;
          case 'arcade': return <ArcadeView />;
          case 'habit-design': return <HabitDesignView />;
          case 'study-vault': return <StudyVaultView />;
          case 'bio-state': return <BioStateView />;
          case 'executive': return <ExecutiveView />;
          case 'trajectory': return <TrajectoryView />;
          case 'secret-vault': return <SecretVaultView />;
          case 'settings': return <SettingsView />;
          default: return <DashboardView />;
        }
      };

      return (
        <NexoraContext.Provider value={contextValue}>
          <div className="min-h-screen flex flex-col lg:flex-row">
            {/* Architectural Sidebar */}
            <aside
              className={`border-b lg:border-b-0 lg:border-r lg:min-h-screen shrink-0 flex flex-col justify-between transition-all duration-200 ${
                sidebarCollapsed ? 'lg:w-16' : 'lg:w-64'
              }`}
              style={{ backgroundColor: 'var(--bg-surface)' }}
            >
              <div className="p-3.5 space-y-4">
                <div className="flex items-center justify-between gap-2 px-1">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div
                      className="w-7 h-7 rounded-md flex items-center justify-center font-mono text-xs font-bold shrink-0"
                      style={{ backgroundColor: 'var(--accent)', color: 'var(--accent-fg)' }}
                    >
                      XB
                    </div>
                    {!sidebarCollapsed && (
                      <div className="truncate">
                        <div className="font-mono text-xs font-bold tracking-wider">XOR Bit | OS</div>
                        <div className="font-mono text-[10px] truncate" style={{ color: 'var(--ink-muted)' }}>
                          {data.profile.name}
                        </div>
                      </div>
                    )}
                  </div>
                  <button
                    type="button"
                    onClick={() => setSidebarCollapsed((c) => !c)}
                    className="hidden lg:inline-flex arch-btn-ghost p-1.5 rounded-md"
                    title="Toggle Sidebar"
                  >
                    <Icon name={sidebarCollapsed ? 'chevron-right' : 'chevron-left'} size={14} />
                  </button>
                </div>

                {!sidebarCollapsed && (
                  <button
                    type="button"
                    onClick={() => setCmdOpen(true)}
                    className="w-full arch-input rounded-md px-2.5 py-1.5 text-xs font-mono flex items-center justify-between"
                    style={{ color: 'var(--ink-muted)' }}
                  >
                    <span className="inline-flex items-center gap-2">
                      <Icon name="search" size={13} />
                      <span>Command / Search...</span>
                    </span>
                    <kbd className="text-[10px] border rounded px-1">⌘K</kbd>
                  </button>
                )}

                <nav className="flex lg:flex-col gap-1 overflow-x-auto lg:overflow-x-visible pb-1 lg:pb-0">
                  {navItems
                    .filter((item) => !hiddenSidebarIds.includes(item.id))
                    .map((item, index) => {
                      const isActive = activeTab === item.id;
                      return (
                        <button
                          key={item.id}
                          type="button"
                          onClick={() => {
                            playTactileClick(data.profile.soundEnabled, 680, 10);
                            setActiveTab(item.id);
                          }}
                          className={`px-2.5 py-2 rounded-md text-xs font-mono flex items-center justify-between gap-2 shrink-0 transition ${
                            isActive ? 'arch-btn-primary' : 'arch-btn-ghost border-transparent'
                          }`}
                          title={item.label}
                        >
                          <span className="inline-flex items-center gap-2.5 truncate">
                            <Icon name={item.icon} size={15} />
                            {!sidebarCollapsed && <span className="truncate">{item.label}</span>}
                          </span>
                          {!sidebarCollapsed && (
                            <span className="inline-flex items-center gap-1">
                              {item.badge !== undefined && item.badge > 0 && (
                                <span className="px-1.5 py-0.2 rounded text-[10px] border tabular-nums">
                                  {item.badge}
                                </span>
                              )}
                              {index < 9 && (
                                <kbd className="font-mono text-[9px] opacity-50">{index + 1}</kbd>
                              )}
                            </span>
                          )}
                        </button>
                      );
                    })}
                </nav>

                <button
                  type="button"
                  onClick={toggleAudio}
                  aria-pressed={isAudioPlaying}
                  aria-label={isAudioPlaying ? 'Turn background audio off' : 'Turn background audio on'}
                  className="w-full arch-btn-ghost rounded-md px-2.5 py-2 text-xs font-mono flex items-center justify-between gap-2"
                  title={isAudioPlaying ? 'Background audio is on' : 'Background audio is off'}
                >
                  <span className="inline-flex items-center gap-2">
                    <Icon name={isAudioPlaying ? 'volume' : 'mute'} size={14} />
                    {!sidebarCollapsed && <span>BACKGROUND AUDIO {isAudioPlaying ? 'ON' : 'OFF'}</span>}
                  </span>
                  <span className={`w-2 h-2 rounded-full ${isAudioPlaying ? 'animate-pulse' : ''}`} style={{ backgroundColor: isAudioPlaying ? 'var(--status-ok)' : 'var(--ink-muted)' }} />
                </button>
              </div>

              {!sidebarCollapsed && (
                <div className="hidden lg:block p-3.5 border-t space-y-2">
                  <div className="flex items-center justify-between text-[11px] font-mono tabular-nums">
                    <span style={{ color: 'var(--ink-muted)' }}>OPERATOR LVL {telemetry.level}</span>
                    <span>{telemetry.xpProgress}%</span>
                  </div>
                  <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: 'var(--bg-elevated)' }}>
                    <div
                      className="h-full transition-all duration-300"
                      style={{ width: `${telemetry.xpProgress}%`, backgroundColor: 'var(--status-ok)' }}
                    />
                  </div>
                </div>
              )}
            </aside>

            {/* Main Content Shell */}
            <div className="flex-1 flex flex-col min-w-0 lg:min-h-screen">
              <main className="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
                {renderActiveView()}
              </main>
              <footer
                className="mt-auto min-h-[56px] px-5 py-3 border-t flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono"
                style={{ backgroundColor: 'var(--bg-surface)', color: 'var(--ink-muted)' }}
              >
                <div className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: 'var(--status-ok)' }} />
                  <span>XOR Bit | Architectural OS</span>
                </div>
                <div className="tracking-wider uppercase" style={{ color: 'var(--ink-primary)' }}>
                  DESIGNED &amp; DEVELOPED BY <span className="font-semibold">SHRISHAILA M</span>
                </div>
              </footer>
            </div>

            {/* Command Palette Modal (Ctrl+K) */}
            {cmdOpen && (
              <div
                className="fixed inset-0 z-50 bg-black/70 flex items-start justify-center pt-20 p-4"
                onClick={() => setCmdOpen(false)}
              >
                <div
                  className="arch-panel rounded-xl w-full max-w-lg p-4 space-y-3"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center gap-2 border-b pb-2.5">
                    <Icon name="search" size={16} />
                    <input
                      autoFocus
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Jump to module or search courses, missions, notes..."
                      className="w-full bg-transparent text-xs font-mono focus:outline-none"
                    />
                    <button
                      type="button"
                      onClick={() => setCmdOpen(false)}
                      className="arch-btn-ghost px-2 py-0.5 rounded text-[10px] font-mono"
                    >
                      ESC
                    </button>
                  </div>

                  {searchQuery.trim() ? (
                    <div className="space-y-1 max-h-64 overflow-y-auto">
                      {searchResults.length === 0 ? (
                        <div className="py-6 text-center font-mono text-xs" style={{ color: 'var(--ink-muted)' }}>
                          NO MATCHING RECORDS
                        </div>
                      ) : (
                        searchResults.map((r, i) => (
                          <button
                            key={i}
                            type="button"
                            onClick={() => {
                              setActiveTab(r.tab);
                              setCmdOpen(false);
                              setSearchQuery('');
                            }}
                            className="w-full p-2 rounded-md arch-btn-ghost flex items-center justify-between text-xs font-mono text-left"
                          >
                            <span className="truncate">{r.title}</span>
                            <span className="text-[10px]" style={{ color: 'var(--ink-muted)' }}>{r.module}</span>
                          </button>
                        ))
                      )}
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-1.5 max-h-64 overflow-y-auto">
                      {navItems.map((item) => (
                        <button
                          key={item.id}
                          type="button"
                          onClick={() => {
                            setActiveTab(item.id);
                            setCmdOpen(false);
                          }}
                          className="p-2 rounded-md arch-btn-ghost flex items-center gap-2 text-xs font-mono text-left"
                        >
                          <Icon name={item.icon} size={14} />
                          <span className="truncate">{item.label}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Operator Profile Modal */}
            {profileModal && (
              <div
                className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4"
                onClick={() => setProfileModal(false)}
              >
                <div
                  className="arch-panel rounded-xl w-full max-w-md p-5 space-y-4"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs uppercase" style={{ color: 'var(--ink-muted)' }}>
                      CONFIGURE OPERATOR PROFILE
                    </span>
                    <button
                      type="button"
                      onClick={() => setProfileModal(false)}
                      className="arch-btn-ghost px-2 py-0.5 rounded text-xs font-mono"
                    >
                      ESC
                    </button>
                  </div>
                  <div className="space-y-3">
                    <input
                      value={data.profile.name}
                      onChange={(e) => setData((prev) => ({ ...prev, profile: { ...prev.profile, name: e.target.value } }))}
                      placeholder="Operator Name"
                      className="w-full arch-input rounded-md px-3 py-2 text-xs"
                    />
                    <input
                      value={data.profile.title}
                      onChange={(e) => setData((prev) => ({ ...prev, profile: { ...prev.profile, title: e.target.value } }))}
                      placeholder="Program / Branch"
                      className="w-full arch-input rounded-md px-3 py-2 text-xs"
                    />
                    <input
                      value={data.profile.semester}
                      onChange={(e) => setData((prev) => ({ ...prev, profile: { ...prev.profile, semester: e.target.value } }))}
                      placeholder="Active Semester"
                      className="w-full arch-input rounded-md px-3 py-2 text-xs"
                    />
                  </div>
                  <button
                    type="button"
                    onClick={() => setProfileModal(false)}
                    className="w-full arch-btn-primary py-2 rounded-md text-xs font-mono"
                  >
                    SAVE &amp; CLOSE
                  </button>
                </div>
              </div>
            )}

            {/* Confirm Wipe Modal */}
            {confirmResetModal && (
              <div
                className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4"
                onClick={() => setConfirmResetModal(false)}
              >
                <div
                  className="arch-panel rounded-xl w-full max-w-md p-5 space-y-4"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="font-mono text-xs uppercase" style={{ color: 'var(--status-err)' }}>
                    CONFIRM FULL FACTORY WIPE
                  </div>
                  <p className="text-xs leading-relaxed" style={{ color: 'var(--ink-secondary)' }}>
                    This will permanently clear all local XOR Bit telemetry and media from this browser.
                  </p>
                  <div className="flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setConfirmResetModal(false)}
                      className="arch-btn-ghost px-3 py-1.5 rounded-md text-xs font-mono"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={async () => {
                        localStorage.removeItem(STORAGE_KEY);
                        await clearMediaIDB();
                        setData(EMPTY_STATE);
                        setMediaMap({});
                        setConfirmResetModal(false);
                        notify('System wiped to factory zero state');
                      }}
                      className="arch-btn-primary px-3.5 py-1.5 rounded-md text-xs font-mono"
                      style={{ backgroundColor: 'var(--status-err)', color: '#FFFFFF' }}
                    >
                      Confirm Wipe
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Toast Notification */}
            {toast && (
              <div
                className="fixed bottom-5 right-5 z-50 arch-panel px-4 py-2.5 rounded-lg text-xs font-mono shadow-lg border"
                style={{
                  borderColor: toast.status === 'err' ? 'var(--status-err)' : 'var(--status-ok)',
                  color: toast.status === 'err' ? 'var(--status-err)' : 'var(--ink-primary)'
                }}
              >
                {toast.msg}
              </div>
            )}
          </div>
        </NexoraContext.Provider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NexoraApp />);
  </script>

  <!-- PWA Install Banner & Modal -->
  <div id="pwa-install-banner" class="hidden fixed bottom-4 right-4 z-50 transition-all duration-300">
    <div class="flex items-center gap-3 px-4 py-2.5 rounded-xl border shadow-2xl backdrop-blur-md"
         style="background-color: rgba(17, 17, 19, 0.94); border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center font-mono font-bold text-sm shrink-0"
           style="background: linear-gradient(135deg, #FDE047, #F59E0B); color: #09090B;">
        ⚡
      </div>
      <div class="flex flex-col text-left">
        <span class="font-mono text-xs font-bold text-white tracking-wide">Install XOR Bit</span>
        <span class="font-mono text-[10px] text-zinc-400">Add to phone or laptop home screen</span>
      </div>
      <div class="flex items-center gap-1.5 ml-2">
        <button id="pwa-install-btn" type="button"
                class="px-3 py-1.5 rounded-lg text-xs font-mono font-semibold transition hover:opacity-90 active:scale-95"
                style="background-color: #FAFAFA; color: #09090B;">
          Install
        </button>
        <button id="pwa-dismiss-btn" type="button"
                class="px-2 py-1.5 rounded-lg text-xs font-mono text-zinc-400 hover:text-white transition"
                aria-label="Close">
          ✕
        </button>
      </div>
    </div>
  </div>

  <!-- iOS Safari Install Instructions Modal -->
  <div id="pwa-ios-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm rounded-2xl border p-5 space-y-4"
         style="background-color: #111113; border-color: rgba(255,255,255,0.12); color: #FAFAFA;">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">⚡</span>
          <span class="font-mono text-sm font-bold">Install XOR Bit on iPhone</span>
        </div>
        <button id="pwa-ios-close" class="text-zinc-400 hover:text-white font-mono text-sm">✕</button>
      </div>
      <div class="text-xs space-y-3 font-mono text-zinc-300">
        <div class="flex items-start gap-2.5">
          <span class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-[10px] shrink-0 font-bold">1</span>
          <span>Tap the <strong>Share</strong> button <span class="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-700">⎋ / ⬆</span> at the bottom of Safari.</span>
        </div>
        <div class="flex items-start gap-2.5">
          <span class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-[10px] shrink-0 font-bold">2</span>
          <span>Scroll down and tap <strong>Add to Home Screen</strong> <span class="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-700">⊞</span>.</span>
        </div>
        <div class="flex items-start gap-2.5">
          <span class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-[10px] shrink-0 font-bold">3</span>
          <span>Tap <strong>Add</strong> in the top-right corner to install it!</span>
        </div>
      </div>
      <button id="pwa-ios-gotit" class="w-full py-2 rounded-lg text-xs font-mono font-semibold"
              style="background-color: #FAFAFA; color: #09090B;">
        Got it
      </button>
    </div>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[XOR Bit] Service Worker registered:', reg.scope))
          .catch((err) => console.warn('[XOR Bit] Service Worker error:', err));
      });
    }

    // PWA Install Handling
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    const banner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const dismissBtn = document.getElementById('pwa-dismiss-btn');
    const iosModal = document.getElementById('pwa-ios-modal');
    const iosClose = document.getElementById('pwa-ios-close');
    const iosGotit = document.getElementById('pwa-ios-gotit');

    if (!isStandalone) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (banner && !sessionStorage.getItem('xor_pwa_dismissed')) {
          banner.classList.remove('hidden');
        }
      });

      if (isIOS && !sessionStorage.getItem('xor_pwa_dismissed')) {
        setTimeout(() => {
          if (banner) banner.classList.remove('hidden');
        }, 1500);
      }

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('[XOR Bit] Install choice:', outcome);
            deferredPrompt = null;
            if (banner) banner.classList.add('hidden');
          } else if (isIOS) {
            if (iosModal) iosModal.classList.remove('hidden');
          } else {
            alert('To install XOR Bit on this device, click the Install App icon in your browser address bar or menu (⋮).');
          }
        });
      }

      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          if (banner) banner.classList.add('hidden');
          sessionStorage.setItem('xor_pwa_dismissed', 'true');
        });
      }

      if (iosClose) iosClose.addEventListener('click', () => iosModal.classList.add('hidden'));
      if (iosGotit) iosGotit.addEventListener('click', () => iosModal.classList.add('hidden'));

      window.addEventListener('appinstalled', () => {
        if (banner) banner.classList.add('hidden');
        console.log('[XOR Bit] Installed successfully as app');
      });
    }
  </script>
</body>
</html>
